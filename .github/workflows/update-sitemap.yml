name: Update sitemap.xml

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "_articles_en/**"
      - "_articles_ja/**"
      - "images/**"
      - "_config.yml"
      - ".github/scripts/generate_sitemap.py"
      - ".github/workflows/update-sitemap.yml"
  # 上記のパスに触れない変更のあとで sitemap を取り直したい場合や、
  # 過去に生成が失敗して sitemap が古いままの場合に手動で実行する。
  workflow_dispatch:

permissions:
  contents: write

# push と workflow_dispatch が重なると sitemap.xml の更新が競合するため直列化する。
# 後から来た実行が正しい内容を書くので、実行中のものはキャンセルしない。
concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 既定の GITHUB_TOKEN は main を保護するルールセットに弾かれる。
          # GitHub Actions 自体をバイパスに登録するには organization 所有である
          # 必要があり、個人リポジトリでは指定できない（API が 422 を返す）。
          # そのため書き込み権限付きの deploy key で push する。
          # ルールセット側の Bypass list には Deploy keys を登録してある。
          ssh-key: ${{ secrets.SITEMAP_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap.xml
        run: python3 .github/scripts/generate_sitemap.py

      - name: Commit and push if sitemap changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "sitemap.xml is already up to date."
          else
            git commit -m "chore: update sitemap.xml [skip ci]"
            # このジョブの実行中に main が進むと push が弾かれるため、
            # 一度だけ rebase して再試行する。
            # refspec は明示する。checkout の状態に依存せず push 先が定まる。
            git push origin HEAD:main \
              || (git pull --rebase origin main && git push origin HEAD:main)
          fi
