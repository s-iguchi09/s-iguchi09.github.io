name: Update sitemap.xml

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "_articles_en/**"
      - "_articles_ja/**"
      - "images/**"
      - "_config.yml"
      - ".github/scripts/generate_sitemap.py"
      - ".github/workflows/update-sitemap.yml"
  # 上記のパスに触れない変更のあとで sitemap を取り直したい場合や、
  # 過去に生成が失敗して sitemap が古いままの場合に手動で実行する。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate sitemap.xml
        run: python3 .github/scripts/generate_sitemap.py

      - name: Commit and push if sitemap changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "sitemap.xml is already up to date."
          else
            git commit -m "chore: update sitemap.xml [skip ci]"
            # このジョブの実行中に main が進むと push が弾かれるため、
            # 一度だけ rebase して再試行する。
            git push || (git pull --rebase origin main && git push)
          fi
