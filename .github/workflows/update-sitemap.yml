name: Update sitemap.xml

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "_articles_en/**"
      - "_articles_ja/**"
      - "images/**"
      - "_config.yml"
      - ".github/scripts/generate_sitemap.py"
      - ".github/workflows/update-sitemap.yml"
  # 上記のパスに触れない変更のあとで sitemap を取り直したい場合や、
  # 過去に生成が失敗して sitemap が古いままの場合に手動で実行する。
  workflow_dispatch:

# push は deploy key で行うため、GITHUB_TOKEN に書き込み権限は要らない。
permissions:
  contents: read

# push と workflow_dispatch が重なると sitemap.xml の更新が競合するため直列化する。
# 後から来た実行が正しい内容を書くので、実行中のものはキャンセルしない。
concurrency:
  group: update-sitemap
  cancel-in-progress: false

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_dispatch では選択したブランチが対象になる。main 以外の
          # 内容を main へ push しないよう、参照先を固定する。
          ref: main
          fetch-depth: 0
          # 認証情報をジョブに残さない。push 用の鍵は push する step の中だけで用意する。
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate and push sitemap.xml
        env:
          DEPLOY_KEY: ${{ secrets.SITEMAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          # 書き込み権限付きの deploy key は、この step の中でだけ使う。
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/sitemap_deploy
          chmod 600 ~/.ssh/sitemap_deploy
          # ssh-keyscan は取得したホスト鍵を検証しないため使わない。
          # GitHub が公開している SSH ホスト鍵を HTTPS（＝証明書で認証された経路）で
          # 取得して登録する。鍵がローテーションされても追従できる。
          curl -fsSL https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/sitemap_deploy -o IdentitiesOnly=yes"
          git remote set-url origin "git@github.com:${{ github.repository }}.git"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # 毎回、最新の main を基点に生成し直す。push が競合したときに rebase で
            # 載せ替えるだけだと、main 側の変更が sitemap に反映されないため。
            git fetch origin main
            git reset --hard origin/main

            # 生成物が不正なら非ゼロ終了する。set -e により、壊れた
            # サイトマップが main へ push されることはない。
            python3 .github/scripts/generate_sitemap.py
            git add sitemap.xml sitemap_index.xml _data/lastmod.yml
            if git diff --cached --quiet; then
              echo "sitemap.xml and _data/lastmod.yml are already up to date."
              exit 0
            fi

            # deploy key による push はワークフローを起動しうる（GITHUB_TOKEN と異なる）。
            # sitemap.xml と _data/lastmod.yml は上記 paths に含まれないうえ、二重に抑止する。
            git commit -m "chore: update sitemap.xml and feed lastmod data [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push が競合した（${attempt} 回目）。生成からやり直す。"
          done

          echo "::error::sitemap.xml の push に 3 回失敗した。"
          exit 1
