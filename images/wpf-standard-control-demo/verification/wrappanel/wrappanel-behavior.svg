  <text class="cell" x="26" y="87.5">defaults: Orientation / ItemWidth / ItemHeight</text>
  <text class="cell" x="1012" y="87.5" text-anchor="end">Horizontal / NaN / NaN</text>
  <text class="cell" x="26" y="117.5">the demo's 5 labels, Horizontal, 150 wide</text>
