  <text class="cell" x="26" y="297.5">ItemHeight=100, 5 labels, 150 wide: label height / second row starts at y / its first label at y</text>
  <text class="cell" x="1012" y="297.5" text-anchor="end">96 / 100 / 102</text>
  <text class="cell" x="26" y="327.5">5 labels in a ScrollViewer, horizontal Disabled (default), 150 wide</text>
  <text class="cell" x="1012" y="327.5" text-anchor="end">3 rows of 2, 2, 1</text>
  <text class="cell" x="26" y="357.5">5 labels in a ScrollViewer, horizontal Auto, 150 wide</text>
  <text class="cell" x="1012" y="357.5" text-anchor="end">1 rows of 5</text>
  <text class="cell" x="26" y="387.5">Background=null: hit test in the gap between two labels</text>
  <text class="cell" x="1012" y="387.5" text-anchor="end">(nothing)</text>
  <text class="cell" x="26" y="417.5">Background=Transparent: hit test in the gap between two labels</text>
  <text class="cell" x="1012" y="417.5" text-anchor="end">Panel</text>
