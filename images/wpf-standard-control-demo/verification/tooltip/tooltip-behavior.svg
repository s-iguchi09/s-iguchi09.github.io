<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1077 440" width="1077" height="440" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1077" height="440" />
  <text class="title" x="12" y="24">ToolTip: defaults, timing, reuse, keyboard, disabled elements and placement (real mouse)</text>
  <rect class="head" x="12" y="38" width="1053" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1051" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">defaults: InitialShowDelay / ShowDuration / BetweenShowDelay</text>
  <text class="cell" x="1051" y="87.5" text-anchor="end">1000 / 2147483647 / 100</text>
  <text class="cell" x="26" y="117.5">defaults: Placement / ShowsToolTipOnKeyboardFocus / ShowOnDisabled / HasDropShadow</text>
  <text class="cell" x="1051" y="117.5" text-anchor="end">Mouse / null / False / False</text>
  <text class="cell" x="26" y="147.5">real mouse over a button: InitialShowDelay 500 / 2000</text>
  <text class="cell" x="1051" y="147.5" text-anchor="end">opened after 600 ms / opened after 2050 ms</text>
  <text class="cell" x="26" y="177.5">ShowDuration=1000, pointer kept on the button: open 2.5 s later</text>
  <text class="cell" x="1051" y="177.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="207.5">string ToolTip opened twice: same ToolTip instance</text>
  <text class="cell" x="1051" y="207.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="237.5">disabled button: ShowOnDisabled False / True</text>
  <text class="cell" x="1051" y="237.5" text-anchor="end">did not open / opened after 350 ms</text>
  <text class="cell" x="26" y="267.5">Placement=Bottom: tooltip from the button's top-left / from the pointer</text>
  <text class="cell" x="1051" y="267.5" text-anchor="end">(0, 30) / (-80, 15)</text>
  <text class="cell" x="26" y="297.5">Bottom, HorizontalOffset 50: tooltip from the button's top-left / from the pointer</text>
  <text class="cell" x="1051" y="297.5" text-anchor="end">(50, 30) / (-30, 15)</text>
  <text class="cell" x="26" y="327.5">Placement=Mouse (default): tooltip from the button's top-left / from the pointer</text>
  <text class="cell" x="1051" y="327.5" text-anchor="end">(80, 32) / (0, 17)</text>
  <text class="cell" x="26" y="357.5">real Tab key to a button, ShowsToolTipOnKeyboardFocus=True: focused / tooltip opened</text>
  <text class="cell" x="1051" y="357.5" text-anchor="end">True / True</text>
  <text class="cell" x="26" y="387.5">real Tab key to a button, ShowsToolTipOnKeyboardFocus=False: focused / tooltip opened</text>
  <text class="cell" x="1051" y="387.5" text-anchor="end">True / False</text>
  <text class="cell" x="26" y="417.5">real Tab key to a button, ShowsToolTipOnKeyboardFocus=null: focused / tooltip opened</text>
  <text class="cell" x="1051" y="417.5" text-anchor="end">True / True</text>
