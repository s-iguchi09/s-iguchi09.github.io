  <rect class="bg" x="0" y="0" width="1108" height="410" />
  <text class="title" x="12" y="24">DatePicker: calendar popup and bindings</text>
  <rect class="head" x="12" y="38" width="1084" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1082" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">bound to a DateTime (not nullable); SelectedDate = null</text>
  <text class="cell" x="1082" y="87.5" text-anchor="end">source 2026-04-15, HasError True, Validation.HasError True</text>
  <text class="cell" x="26" y="117.5">IsDropDownOpen = True before showing: IsDropDownOpen / Popup.IsOpen</text>
  <text class="cell" x="1082" y="117.5" text-anchor="end">True / True</text>
  <text class="cell" x="26" y="147.5">  exception while showing</text>
  <text class="cell" x="1082" y="147.5" text-anchor="end">no exception</text>
  <text class="cell" x="26" y="177.5">IsTodayHighlighted not set: DatePicker / popup Calendar value (source)</text>
  <text class="cell" x="1082" y="177.5" text-anchor="end">True (DefaultStyle) / True (Local)</text>
  <text class="cell" x="26" y="207.5">  today's day button: IsToday / IsEnabled / today marker</text>
  <text class="cell" x="1082" y="207.5" text-anchor="end">True / True / DayStates=Today, TodayBackground opacity 1</text>
  <text class="cell" x="26" y="237.5">IsTodayHighlighted True: DatePicker / popup Calendar value (source)</text>
  <text class="cell" x="1082" y="237.5" text-anchor="end">True (Local) / True (Local)</text>
  <text class="cell" x="26" y="267.5">  today's day button: IsToday / IsEnabled / today marker</text>
  <text class="cell" x="1082" y="267.5" text-anchor="end">True / True / DayStates=Today, TodayBackground opacity 1</text>
  <text class="cell" x="26" y="297.5">IsTodayHighlighted False: DatePicker / popup Calendar value (source)</text>
  <text class="cell" x="1082" y="297.5" text-anchor="end">False (Local) / False (Local)</text>
  <text class="cell" x="26" y="327.5">  today's day button: IsToday / IsEnabled / today marker</text>
  <text class="cell" x="1082" y="327.5" text-anchor="end">True / True / DayStates=RegularDay, TodayBackground opacity 0</text>
  <text class="cell" x="26" y="357.5">FirstDayOfWeek=Sunday: the popup Calendar's FirstDayOfWeek</text>
  <text class="cell" x="1082" y="357.5" text-anchor="end">Sunday</text>
  <text class="cell" x="26" y="387.5">FirstDayOfWeek=Monday: the popup Calendar's FirstDayOfWeek</text>
  <text class="cell" x="1082" y="387.5" text-anchor="end">Monday</text>
