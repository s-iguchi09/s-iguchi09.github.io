<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1226 560" width="1226" height="560" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1226" height="560" />
  <text class="title" x="12" y="24">DatePicker (xml:lang="en-US"): range 2026-04-10 to 2026-04-20, blackout dates, input</text>
  <rect class="head" x="12" y="38" width="1202" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1200" y="57.5" text-anchor="end">result</text>
  <text class="cell" x="26" y="87.5">SelectedDate = 04-15: DisplayDate / then DisplayDate = 07-01: SelectedDate</text>
  <text class="cell" x="1200" y="87.5" text-anchor="end">2026-04-15 / 2026-04-15</text>
  <text class="cell" x="26" y="117.5">out of range from code: SelectedDate = 04-05</text>
  <text class="cell" x="1200" y="117.5" text-anchor="end">no exception; SelectedDate 2026-04-05</text>
  <text class="cell" x="26" y="147.5">out of range through Text: Text = "4/5/2026"</text>
  <text class="cell" x="1200" y="147.5" text-anchor="end">no exception; SelectedDate 2026-04-05, Text "4/5/2026"</text>
  <text class="cell" x="26" y="177.5">out of range typed: "4/5/2026" + Enter</text>
  <text class="cell" x="1200" y="177.5" text-anchor="end">SelectedDate 2026-04-05, Text "4/5/2026", DateValidationError 0</text>
  <text class="cell" x="26" y="207.5">in range typed: "4/18/2026" + Enter</text>
  <text class="cell" x="1200" y="207.5" text-anchor="end">SelectedDate 2026-04-18, Text "4/18/2026", DateValidationError 0</text>
  <text class="cell" x="26" y="237.5">unparsable typed: "abc" + Enter</text>
  <text class="cell" x="1200" y="237.5" text-anchor="end">SelectedDate 2026-04-15, Text "4/15/2026", DateValidationError 1 ("abc")</text>
  <text class="cell" x="26" y="267.5">text cleared + Enter</text>
  <text class="cell" x="1200" y="267.5" text-anchor="end">SelectedDate null, Text "", DateValidationError 0</text>
  <text class="cell" x="26" y="297.5">calendar popup, day button 2026-04-05</text>
  <text class="cell" x="1200" y="297.5" text-anchor="end">IsEnabled False, IsBlackedOut False, IsInactive False</text>
  <text class="cell" x="26" y="327.5">calendar popup, day button 2026-04-12</text>
  <text class="cell" x="1200" y="327.5" text-anchor="end">IsEnabled True, IsBlackedOut False, IsInactive False</text>
  <text class="cell" x="26" y="357.5">BlackoutDates 04-12..04-13; SelectedDate = 04-12 from code</text>
  <text class="cell" x="1200" y="357.5" text-anchor="end">ArgumentOutOfRangeException; SelectedDate 2026-04-15</text>
  <text class="cell" x="26" y="387.5">  calendar popup, day button 2026-04-12</text>
  <text class="cell" x="1200" y="387.5" text-anchor="end">IsEnabled True, IsBlackedOut True</text>
  <text class="cell" x="26" y="417.5">SelectedDate 04-10, then DisplayDateStart = 04-15</text>
  <text class="cell" x="1200" y="417.5" text-anchor="end">no exception; DisplayDateStart 2026-04-10, SelectedDate 2026-04-10</text>
  <text class="cell" x="26" y="447.5">Text = "4/15/2026"</text>
  <text class="cell" x="1200" y="447.5" text-anchor="end">no exception; SelectedDate 2026-04-15, Text "4/15/2026"</text>
  <text class="cell" x="26" y="477.5">Text = "2026-04-15"</text>
  <text class="cell" x="1200" y="477.5" text-anchor="end">no exception; SelectedDate 2026-04-15, Text "4/15/2026"</text>
  <text class="cell" x="26" y="507.5">Text = "April 15, 2026"</text>
  <text class="cell" x="1200" y="507.5" text-anchor="end">no exception; SelectedDate 2026-04-15, Text "4/15/2026"</text>
  <text class="cell" x="26" y="537.5">Text = "15/4/2026"</text>
  <text class="cell" x="1200" y="537.5" text-anchor="end">no exception; SelectedDate null, Text ""</text>
