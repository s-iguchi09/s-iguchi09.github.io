  <text class="cell" x="26" y="57.5">item</text>
  <text class="cell" x="870" y="57.5" text-anchor="end">value</text>
  <text class="cell" x="26" y="87.5">base class of Slider / ProgressBar / ScrollBar</text>
  <text class="cell" x="870" y="87.5" text-anchor="end">RangeBase / RangeBase / RangeBase</text>
  <text class="cell" x="26" y="117.5">Minimum / Maximum / Value</text>
