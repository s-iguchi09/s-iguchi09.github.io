  <text class="cell" x="26" y="147.5">SmallChange / LargeChange</text>
  <text class="cell" x="870" y="147.5" text-anchor="end">0.1 / 1</text>
  <text class="cell" x="26" y="177.5">Orientation / IsDirectionReversed</text>
  <text class="cell" x="870" y="177.5" text-anchor="end">Horizontal / False</text>
  <text class="cell" x="26" y="207.5">TickPlacement / TickFrequency / Ticks</text>
  <text class="cell" x="870" y="207.5" text-anchor="end">None / 1 / </text>
