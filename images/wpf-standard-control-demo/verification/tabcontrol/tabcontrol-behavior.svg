    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1077" height="440" />
  <text class="title" x="12" y="24">TabControl: string format, selection, items and keyboard</text>
  <rect class="head" x="12" y="38" width="1053" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1051" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base class / default TabStripPlacement / first Dock value (demo start)</text>
  <text class="cell" x="1051" y="87.5" text-anchor="end">Selector / Top / Left</text>
  <text class="cell" x="26" y="117.5">SelectedIndex before showing / after showing</text>
  <text class="cell" x="1051" y="117.5" text-anchor="end">-1 / 0</text>
  <text class="cell" x="26" y="147.5">demo "Format: {0}.": text / SelectedContent / SelectedContentStringFormat</text>
  <text class="cell" x="1051" y="147.5" text-anchor="end">Format: Item1. / Item1 / Format: {0}.</text>
  <text class="cell" x="26" y="177.5">  switched to Tab2 (its own "Own {0}"): text / SelectedContentStringFormat</text>
