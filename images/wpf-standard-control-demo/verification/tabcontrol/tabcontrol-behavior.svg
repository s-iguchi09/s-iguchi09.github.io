  <text class="cell" x="26" y="207.5">  Tab2 selected before showing: text / SelectedContentStringFormat</text>
  <text class="cell" x="1051" y="207.5" text-anchor="end">Own Item2 / Own {0}</text>
  <text class="cell" x="26" y="237.5">2 tabs, SelectedIndex = 5: exception / SelectedIndex</text>
  <text class="cell" x="1051" y="237.5" text-anchor="end">no exception / 0</text>
  <text class="cell" x="26" y="267.5">  SelectedIndex = -2: exception / SelectedIndex</text>
  <text class="cell" x="1051" y="267.5" text-anchor="end">ArgumentException / 0</text>
  <text class="cell" x="26" y="297.5">Tab2 selected, SelectedItem = a TabItem not in the list</text>
  <text class="cell" x="1051" y="297.5" text-anchor="end">1</text>
