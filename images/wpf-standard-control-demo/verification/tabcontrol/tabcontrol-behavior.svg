  <text class="cell" x="1051" y="327.5" text-anchor="end">null / (nothing)</text>
  <text class="cell" x="26" y="357.5">3 tabs, Tab2 selected and removed: SelectedIndex / selected tab</text>
  <text class="cell" x="1051" y="357.5" text-anchor="end">1 / Tab3</text>
  <text class="cell" x="26" y="387.5">Items filled, then ItemsSource / ItemsSource, then Items.Add</text>
  <text class="cell" x="1051" y="387.5" text-anchor="end">InvalidOperationException / InvalidOperationException</text>
  <text class="cell" x="26" y="417.5">focus on Tab1's header, Right arrow: SelectedIndex / focused header</text>
  <text class="cell" x="1051" y="417.5" text-anchor="end">1 / Tab2</text>
