  <rect class="bg" x="0" y="0" width="1242" height="710" />
  <text class="title" x="12" y="24">InkCanvas: defaults, the demo's start, drawing with the real mouse, modes and commands</text>
  <rect class="head" x="12" y="38" width="1218" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1216" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">defaults: EditingMode, EditingModeInverted, ActiveEditingMode, Background</text>
  <text class="cell" x="1216" y="87.5" text-anchor="end">Ink, EraseByStroke, Ink, #FFFFFFFF</text>
  <text class="cell" x="26" y="117.5">  pen: Color; Width, Height; StylusTip, IsHighlighter; recognizer</text>
  <text class="cell" x="1216" y="117.5" text-anchor="end">Black; 2.0031496062992127, same; Ellipse, False; True</text>
  <text class="cell" x="26" y="147.5">  Background after style (source) / SystemColors.WindowBrush; metadata</text>
  <text class="cell" x="1216" y="147.5" text-anchor="end">#FFFFFFFF (Style) / #FFFFFFFF; null</text>
  <text class="cell" x="26" y="177.5">demo's start: EditingMode, EditingModeInverted</text>
  <text class="cell" x="1216" y="177.5" text-anchor="end">Ink, InkAndGesture</text>
  <text class="cell" x="26" y="207.5">  pen color, background; contrast ratio</text>
  <text class="cell" x="1216" y="207.5" text-anchor="end">AntiqueWhite (#FFFAEBD7), AliceBlue (#FFF0F8FF); 1.09 : 1</text>
  <text class="cell" x="26" y="237.5">Ink, real drag: strokes; ActiveEditingMode while dragging; stroke color, width</text>
  <text class="cell" x="1216" y="237.5" text-anchor="end">1; Ink; Black, 2</text>
  <text class="cell" x="26" y="267.5">  DefaultDrawingAttributes changed in place (as the demo does): 1st stroke; 2nd stroke</text>
  <text class="cell" x="1216" y="267.5" text-anchor="end">Black, 2; Red, 10</text>
  <text class="cell" x="26" y="297.5">  same DrawingAttributes object: default and 1st stroke; 1st and 2nd</text>
  <text class="cell" x="1216" y="297.5" text-anchor="end">False; False</text>
  <text class="cell" x="26" y="327.5">Background null, real drag left to right: strokes; Gesture event</text>
  <text class="cell" x="1216" y="327.5" text-anchor="end">1; none</text>
  <text class="cell" x="26" y="357.5">None, real drag left to right: strokes; Gesture event</text>
  <text class="cell" x="1216" y="357.5" text-anchor="end">0; none</text>
  <text class="cell" x="26" y="387.5">GestureOnly, real drag left to right: strokes; Gesture event</text>
  <text class="cell" x="1216" y="387.5" text-anchor="end">0; Right</text>
  <text class="cell" x="26" y="417.5">InkAndGesture, real drag left to right: strokes; Gesture event</text>
  <text class="cell" x="1216" y="417.5" text-anchor="end">0; Right</text>
  <text class="cell" x="26" y="447.5">InkAndGesture, Gesture handler sets Cancel, real drag left to right: strokes; Gesture event</text>
  <text class="cell" x="1216" y="447.5" text-anchor="end">1; Right</text>
  <text class="cell" x="26" y="477.5">InkAndGesture, SetEnabledGestures(Circle), real drag left to right: strokes; Gesture event</text>
  <text class="cell" x="1216" y="477.5" text-anchor="end">1; NoGesture</text>
  <text class="cell" x="26" y="507.5">EraseByStroke, one line from x 50 to 250, real drag across x 150: strokes</text>
  <text class="cell" x="1216" y="507.5" text-anchor="end">0</text>
  <text class="cell" x="26" y="537.5">EraseByPoint, one line from x 50 to 250, real drag across x 150: strokes</text>
  <text class="cell" x="1216" y="537.5" text-anchor="end">2 (x 49 to 146 and x 154 to 251)</text>
  <text class="cell" x="26" y="567.5">Select, real click on the line: selected strokes; Copy can execute</text>
  <text class="cell" x="1216" y="567.5" text-anchor="end">1; True</text>
  <text class="cell" x="26" y="597.5">Ink mode, SelectAll can execute: no strokes; one stroke; executed: selected</text>
  <text class="cell" x="1216" y="597.5" text-anchor="end">False; False; 0</text>
  <text class="cell" x="26" y="627.5">Select mode, SelectAll can execute: no strokes; one stroke; executed: selected</text>
  <text class="cell" x="1216" y="627.5" text-anchor="end">False; True; 1</text>
  <text class="cell" x="26" y="657.5">  after SelectAll: Copy can execute; Undo can execute</text>
  <text class="cell" x="1216" y="657.5" text-anchor="end">True; False</text>
  <text class="cell" x="26" y="687.5">2 strokes saved as ISF and loaded: bytes; strokes</text>
  <text class="cell" x="1216" y="687.5" text-anchor="end">66; 2</text>
