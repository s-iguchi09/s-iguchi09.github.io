<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1171 530" width="1171" height="530" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1171" height="530" />
  <text class="title" x="12" y="24">ComboBox: selection, editing, drop-down and synchronization (the demo's DayOfWeek items)</text>
  <rect class="head" x="12" y="38" width="1147" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1145" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">defaults: IsEditable, IsReadOnly, StaysOpenOnEdit</text>
  <text class="cell" x="1145" y="87.5" text-anchor="end">False, False, False</text>
  <text class="cell" x="26" y="117.5">  ShouldPreserveUserEnteredPrefix, IsTextSearchEnabled</text>
  <text class="cell" x="1145" y="117.5" text-anchor="end">False, True</text>
  <text class="cell" x="26" y="147.5">MaxDropDownHeight (screen height / 3) / IsDropDownOpen two-way</text>
  <text class="cell" x="1145" y="147.5" text-anchor="end">480 (480) / True</text>
  <text class="cell" x="26" y="177.5">bound CheckBox opens it; Down, Down, Enter: selected / open / CheckBox</text>
  <text class="cell" x="1145" y="177.5" text-anchor="end">True; Monday / False / False</text>
  <text class="cell" x="26" y="207.5">  Text / SelectedValue / SelectedItem.ToString()</text>
  <text class="cell" x="1145" y="207.5" text-anchor="end">Monday / Monday / ScreenshotCapture.Scenes.ComboBoxDemoScene+EnumItem</text>
  <text class="cell" x="26" y="237.5">editable, "tue" typed, preserve prefix False: Text / SelectedValue</text>
  <text class="cell" x="1145" y="237.5" text-anchor="end">Tuesday / Tuesday</text>
  <text class="cell" x="26" y="267.5">  then "xyz" typed over it: Text / index / SelectedValue</text>
  <text class="cell" x="1145" y="267.5" text-anchor="end">xyz / -1 / null</text>
  <text class="cell" x="26" y="297.5">editable, "tue" typed, preserve prefix True: Text / SelectedValue</text>
  <text class="cell" x="1145" y="297.5" text-anchor="end">tuesday / Tuesday</text>
  <text class="cell" x="26" y="327.5">editable + IsReadOnly: "tue" typed: Text / index; then Down</text>
  <text class="cell" x="1145" y="327.5" text-anchor="end">(empty) / -1; Sunday / 0</text>
  <text class="cell" x="26" y="357.5">MaxDropDownHeight default: drop-down height</text>
  <text class="cell" x="1145" y="357.5" text-anchor="end">141.72</text>
  <text class="cell" x="26" y="387.5">MaxDropDownHeight 100 (demo start): drop-down height</text>
  <text class="cell" x="1145" y="387.5" text-anchor="end">100</text>
  <text class="cell" x="26" y="417.5">open, real click in edit box, StaysOpenOnEdit=False: still open</text>
  <text class="cell" x="1145" y="417.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="447.5">open, real click in edit box, StaysOpenOnEdit=True: still open</text>
  <text class="cell" x="1145" y="447.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="477.5">shared list, IsSynchronizedWithCurrentItem=True: start; first set to 3</text>
  <text class="cell" x="1145" y="477.5" text-anchor="end">0, 0; 3, 3</text>
  <text class="cell" x="26" y="507.5">shared list, IsSynchronizedWithCurrentItem=null: start; first set to 3</text>
  <text class="cell" x="1145" y="507.5" text-anchor="end">-1, -1; 3, -1</text>
