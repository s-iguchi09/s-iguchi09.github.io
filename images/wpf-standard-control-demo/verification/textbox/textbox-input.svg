<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975 440" width="975" height="440" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="975" height="440" />
  <text class="title" x="12" y="24">TextBox: typed input vs. text set from code or a binding</text>
  <rect class="head" x="12" y="38" width="951" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="949" y="57.5" text-anchor="end">Text after</text>
  <text class="cell" x="26" y="87.5">MaxLength=5, typed "ABCDEFGH"</text>
  <text class="cell" x="949" y="87.5" text-anchor="end">"ABCDE"</text>
  <text class="cell" x="26" y="117.5">MaxLength=5, Text = "ABCDEFGH" from code</text>
  <text class="cell" x="949" y="117.5" text-anchor="end">"ABCDEFGH"</text>
  <text class="cell" x="26" y="147.5">MaxLength=5, Text bound to a source set to "ABCDEFGH"</text>
  <text class="cell" x="949" y="147.5" text-anchor="end">"ABCDEFGH"</text>
  <text class="cell" x="26" y="177.5">CharacterCasing=Upper, typed "hello"</text>
  <text class="cell" x="949" y="177.5" text-anchor="end">"HELLO"</text>
  <text class="cell" x="26" y="207.5">CharacterCasing=Upper, Text = "hello" from code</text>
  <text class="cell" x="949" y="207.5" text-anchor="end">"hello"</text>
  <text class="cell" x="26" y="237.5">IsReadOnly=True, typed "xyz" after "abc"</text>
  <text class="cell" x="949" y="237.5" text-anchor="end">"abc"</text>
  <text class="cell" x="26" y="267.5">IsReadOnly=True, SelectAll(): SelectedText</text>
  <text class="cell" x="949" y="267.5" text-anchor="end">"abc"</text>
  <text class="cell" x="26" y="297.5">AcceptsReturn=False, Enter between "a" and "b"</text>
  <text class="cell" x="949" y="297.5" text-anchor="end">"ab"</text>
  <text class="cell" x="26" y="327.5">AcceptsReturn=True, Enter between "a" and "b"</text>
  <text class="cell" x="949" y="327.5" text-anchor="end">"a\r\nb"</text>
  <text class="cell" x="26" y="357.5">Default: "abc" typed: source writes while typing; after focus leaves</text>
  <text class="cell" x="949" y="357.5" text-anchor="end">0 ((empty)); 1 (abc)</text>
  <text class="cell" x="26" y="387.5">PropertyChanged: "abc" typed: source writes while typing; after focus leaves</text>
  <text class="cell" x="949" y="387.5" text-anchor="end">3 (abc); 3 (abc)</text>
  <text class="cell" x="26" y="417.5">IsReadOnly: text after typing "x"; all selected: Copy / Cut / Paste can execute</text>
  <text class="cell" x="949" y="417.5" text-anchor="end">error details; True / False / False</text>
  <line class="line" x1="12" y1="38" x2="963" y2="38" />
  <line class="line" x1="12" y1="68" x2="963" y2="68" />
  <line class="line" x1="12" y1="98" x2="963" y2="98" />
  <line class="line" x1="12" y1="128" x2="963" y2="128" />
  <line class="line" x1="12" y1="158" x2="963" y2="158" />
  <line class="line" x1="12" y1="188" x2="963" y2="188" />
  <line class="line" x1="12" y1="218" x2="963" y2="218" />
  <line class="line" x1="12" y1="248" x2="963" y2="248" />
  <line class="line" x1="12" y1="278" x2="963" y2="278" />
  <line class="line" x1="12" y1="308" x2="963" y2="308" />
  <line class="line" x1="12" y1="338" x2="963" y2="338" />
  <line class="line" x1="12" y1="368" x2="963" y2="368" />
  <line class="line" x1="12" y1="398" x2="963" y2="398" />
  <line class="line" x1="12" y1="428" x2="963" y2="428" />
  <line class="line" x1="12" y1="38" x2="12" y2="428" />
  <line class="line" x1="660" y1="38" x2="660" y2="428" />
  <line class="line" x1="963" y1="38" x2="963" y2="428" />
</svg>
