<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 692 260" width="692" height="260" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="692" height="260" />
  <text class="title" x="12" y="24">Grid: hit testing and ZIndex</text>
  <rect class="head" x="12" y="38" width="668" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="666" y="57.5" text-anchor="end">element hit</text>
  <text class="cell" x="26" y="87.5">front Grid Background=null, empty area</text>
  <text class="cell" x="666" y="87.5" text-anchor="end">Behind</text>
  <text class="cell" x="26" y="117.5">front Grid Background=Transparent, empty area</text>
  <text class="cell" x="666" y="117.5" text-anchor="end">Front</text>
  <text class="cell" x="26" y="147.5">same cell, no ZIndex (First added first)</text>
  <text class="cell" x="666" y="147.5" text-anchor="end">Second</text>
  <text class="cell" x="26" y="177.5">same cell, First ZIndex=1</text>
  <text class="cell" x="666" y="177.5" text-anchor="end">First</text>
  <text class="cell" x="26" y="207.5">Inner (ZIndex=100) in nested Grid (ZIndex=0) vs later sibling Outer</text>
  <text class="cell" x="666" y="207.5" text-anchor="end">Outer</text>
  <text class="cell" x="26" y="237.5">Inner (ZIndex=100) in nested Grid (ZIndex=1) vs later sibling Outer</text>
  <text class="cell" x="666" y="237.5" text-anchor="end">Inner</text>
  <line class="line" x1="12" y1="38" x2="680" y2="38" />
  <line class="line" x1="12" y1="68" x2="680" y2="68" />
