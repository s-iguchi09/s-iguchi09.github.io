  <line class="line" x1="12" y1="218" x2="680" y2="218" />
  <line class="line" x1="12" y1="248" x2="680" y2="248" />
  <line class="line" x1="12" y1="38" x2="12" y2="248" />
  <line class="line" x1="566" y1="38" x2="566" y2="248" />
