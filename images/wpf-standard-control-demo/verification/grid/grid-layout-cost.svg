<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 290" width="849" height="290" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="849" height="290" />
  <text class="title" x="12" y="24">Grid: measure calls, and first-layout time ratio (3 runs, each the median of 15 alternating trials)</text>
  <rect class="head" x="12" y="38" width="825" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="823" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">2x2 columns 100,100 / rows 50,50</text>
  <text class="cell" x="823" y="87.5" text-anchor="end">measure calls 1 / 1 / 1 / 1</text>
  <text class="cell" x="26" y="117.5">2x2 columns Auto,Auto / rows Auto,Auto</text>
  <text class="cell" x="823" y="117.5" text-anchor="end">measure calls 1 / 1 / 1 / 1</text>
  <text class="cell" x="26" y="147.5">2x2 columns 1*,1* / rows 1*,1*</text>
  <text class="cell" x="823" y="147.5" text-anchor="end">measure calls 1 / 1 / 1 / 1</text>
  <text class="cell" x="26" y="177.5">2x2 columns Auto,1* / rows 1*,Auto</text>
  <text class="cell" x="823" y="177.5" text-anchor="end">measure calls 2 / 1 / 1 / 1</text>
  <text class="cell" x="26" y="207.5">500 TextBlocks, vs flat Grid: each row in a nested Grid (+50 Grids)</text>
  <text class="cell" x="823" y="207.5" text-anchor="end">x1.05, x1.01, x1.00</text>
  <text class="cell" x="26" y="237.5">500 TextBlocks, vs flat Grid: each TextBlock in 3 nested Grids (+1,500)</text>
  <text class="cell" x="823" y="237.5" text-anchor="end">x1.25, x1.08, x1.18</text>
  <text class="cell" x="26" y="267.5">500 TextBlocks, vs flat Grid: Auto columns instead of 1*</text>
  <text class="cell" x="823" y="267.5" text-anchor="end">x1.00, x1.00, x0.97</text>
  <line class="line" x1="12" y1="38" x2="837" y2="38" />
  <line class="line" x1="12" y1="68" x2="837" y2="68" />
  <line class="line" x1="12" y1="98" x2="837" y2="98" />
