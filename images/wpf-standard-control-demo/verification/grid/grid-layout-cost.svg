  <line class="line" x1="12" y1="218" x2="837" y2="218" />
  <line class="line" x1="12" y1="248" x2="837" y2="248" />
  <line class="line" x1="12" y1="278" x2="837" y2="278" />
  <line class="line" x1="12" y1="38" x2="12" y2="278" />
  <line class="line" x1="597" y1="38" x2="597" y2="278" />
  <line class="line" x1="837" y1="38" x2="837" y2="278" />
</svg>
