  <rect class="bg" x="0" y="0" width="1140" height="440" />
  <text class="title" x="12" y="24">Image: type, clipping, DPI, sources from a path, file locks and decoding</text>
  <rect class="head" x="12" y="38" width="1116" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1114" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base class, Focusable; defaults Stretch, StretchDirection</text>
  <text class="cell" x="1114" y="87.5" text-anchor="end">FrameworkElement, False; Uniform, Both</text>
  <text class="cell" x="26" y="117.5">large image, UniformToFill / Both in 300 x 200: size; top-left; clip</text>
  <text class="cell" x="1114" y="117.5" text-anchor="end">400 x 200; 0, 0; 300 x 200</text>
  <text class="cell" x="26" y="147.5">large image, UniformToFill / Both, aligned Center in 300 x 200: size; top-left; clip</text>
  <text class="cell" x="1114" y="147.5" text-anchor="end">400 x 200; -50, 0; 300 x 200</text>
  <text class="cell" x="26" y="177.5">large image, None / UpOnly in 300 x 200: size; top-left; clip</text>
  <text class="cell" x="1114" y="177.5" text-anchor="end">600.08 x 300.04; 0, 0; 300 x 200</text>
  <text class="cell" x="26" y="207.5">100 x 50 pixels at 72 DPI, Stretch None: size</text>
  <text class="cell" x="1114" y="207.5" text-anchor="end">133.36 x 66.68</text>
  <text class="cell" x="26" y="237.5">path bound to Source, PNG file: Source type, size</text>
  <text class="cell" x="1114" y="237.5" text-anchor="end">BitmapFrameDecode, 100.01 x 50.01</text>
  <text class="cell" x="26" y="267.5">  delete the file: while shown; Source = null; then GC</text>
  <text class="cell" x="1114" y="267.5" text-anchor="end">locked (IOException); locked (IOException); deleted</text>
  <text class="cell" x="26" y="297.5">path bound to Source, missing file: Source type, size</text>
  <text class="cell" x="1114" y="297.5" text-anchor="end">null, 0 x 0</text>
