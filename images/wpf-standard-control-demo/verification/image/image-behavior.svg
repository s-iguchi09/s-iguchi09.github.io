  <text class="cell" x="1114" y="327.5" text-anchor="end">null, 0 x 0</text>
  <text class="cell" x="26" y="357.5">BitmapImage with CacheOption OnLoad, shown: delete the file</text>
  <text class="cell" x="1114" y="357.5" text-anchor="end">deleted</text>
  <text class="cell" x="26" y="387.5">600 x 300 with DecodePixelWidth 100: pixels; size in DIPs; Stretch None size</text>
  <text class="cell" x="1114" y="387.5" text-anchor="end">100 x 50; 100.01 x 50.01; 100.01 x 50.01</text>
