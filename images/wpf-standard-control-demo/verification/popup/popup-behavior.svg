<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1085 320" width="1085" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1085" height="320" />
  <text class="title" x="12" y="24">Popup: defaults, separate window, StaysOpen and transparency</text>
  <rect class="head" x="12" y="38" width="1061" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1059" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base class / IsOpen, StaysOpen, AllowsTransparency, Placement, PopupAnimation</text>
  <text class="cell" x="1059" y="87.5" text-anchor="end">FrameworkElement / False, True, False, Bottom, None</text>
  <text class="cell" x="26" y="117.5">Popup in the default template: ComboBox / top-level MenuItem</text>
  <text class="cell" x="1059" y="117.5" text-anchor="end">Popup PART_Popup / Popup PART_Popup</text>
  <text class="cell" x="26" y="147.5">open: child in a separate window handle / child's parent</text>
  <text class="cell" x="1059" y="147.5" text-anchor="end">True / NonLogicalAdornerDecorator</text>
  <text class="cell" x="26" y="177.5">StaysOpen=False, mouse click outside it: IsOpen / bound CheckBox</text>
  <text class="cell" x="1059" y="177.5" text-anchor="end">False / False</text>
  <text class="cell" x="26" y="207.5">StaysOpen=True, mouse click outside it: IsOpen / bound CheckBox</text>
  <text class="cell" x="1059" y="207.5" text-anchor="end">True / True</text>
  <text class="cell" x="26" y="237.5">open, window moved by (40, 40): child moved by</text>
  <text class="cell" x="1059" y="237.5" text-anchor="end">(0, 0)</text>
  <text class="cell" x="26" y="267.5">AllowsTransparency=False, Fade: layered window / opacity at 0, 50, 650 ms</text>
  <text class="cell" x="1059" y="267.5" text-anchor="end">False / 1, 1, 1</text>
  <text class="cell" x="26" y="297.5">AllowsTransparency=True, Fade: layered window / opacity at 0, 50, 650 ms</text>
  <text class="cell" x="1059" y="297.5" text-anchor="end">True / 1, 0.5, 1</text>
