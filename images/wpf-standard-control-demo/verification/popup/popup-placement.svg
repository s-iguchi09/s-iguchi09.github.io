<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 380" width="818" height="380" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="818" height="380" />
  <text class="title" x="12" y="24">Popup: where the child appears (target 150 x 30, child 120 x 40, DIP)</text>
  <rect class="head" x="12" y="38" width="794" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="792" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">Placement=Bottom: child from target / with offsets (20, 10)</text>
  <text class="cell" x="792" y="87.5" text-anchor="end">(0, 30) / (20, 40)</text>
  <text class="cell" x="26" y="117.5">Placement=Top: child from target / with offsets (20, 10)</text>
  <text class="cell" x="792" y="117.5" text-anchor="end">(0, -40) / (20, -30)</text>
  <text class="cell" x="26" y="147.5">Placement=Right: child from target / with offsets (20, 10)</text>
  <text class="cell" x="792" y="147.5" text-anchor="end">(150, 0) / (170, 10)</text>
  <text class="cell" x="26" y="177.5">Placement=Left: child from target / with offsets (20, 10)</text>
  <text class="cell" x="792" y="177.5" text-anchor="end">(-120, 0) / (-100, 10)</text>
  <text class="cell" x="26" y="207.5">Placement=Center: child from target / with offsets (20, 10)</text>
  <text class="cell" x="792" y="207.5" text-anchor="end">(15, -5) / (35, 5)</text>
  <text class="cell" x="26" y="237.5">Bottom, target 10 above the work area bottom: child / its bottom past it</text>
  <text class="cell" x="792" y="237.5" text-anchor="end">(0, 30) / 30</text>
  <text class="cell" x="26" y="267.5">Bottom, target 10 above the screen bottom: child / its bottom past it</text>
  <text class="cell" x="792" y="267.5" text-anchor="end">(0, -40) / -40</text>
  <text class="cell" x="26" y="297.5">Placement=Absolute, no PlacementRectangle: child on the screen</text>
  <text class="cell" x="792" y="297.5" text-anchor="end">(0, 0)</text>
  <text class="cell" x="26" y="327.5">no PlacementTarget, Bottom, Popup in a Grid 200 x 60: child from Grid</text>
  <text class="cell" x="792" y="327.5" text-anchor="end">(0, 60)</text>
  <text class="cell" x="26" y="357.5">  with PlacementRectangle (0, 0, 100, 50): child from Grid</text>
  <text class="cell" x="792" y="357.5" text-anchor="end">(0, 50)</text>
