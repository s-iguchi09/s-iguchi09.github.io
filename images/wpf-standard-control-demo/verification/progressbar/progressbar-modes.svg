<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1179 230" width="1179" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1179" height="230" />
  <text class="title" x="12" y="24">ProgressBar: indeterminate mode, threads and UI Automation</text>
  <rect class="head" x="12" y="38" width="1155" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1153" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">IsIndeterminate=True, Value 30: indicator width / visual state</text>
  <text class="cell" x="1153" y="87.5" text-anchor="end">200 / CommonStates: Indeterminate</text>
  <text class="cell" x="26" y="117.5">animation running (template changes in 300 ms): visible / Collapsed / determinate</text>
  <text class="cell" x="1153" y="117.5" text-anchor="end">True / False / False</text>
  <text class="cell" x="26" y="147.5">Value set from a worker thread</text>
  <text class="cell" x="1153" y="147.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="26" y="177.5">Progress&lt;double&gt; made on the UI thread, Report(40) from a worker: callback on the UI thread / Value</text>
  <text class="cell" x="1153" y="177.5" text-anchor="end">True / 40</text>
  <text class="cell" x="26" y="207.5">UI Automation RangeValue pattern: determinate / IsIndeterminate=True</text>
  <text class="cell" x="1153" y="207.5" text-anchor="end">value 30, IsReadOnly True / not supported</text>
