<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 967 410" width="967" height="410" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="967" height="410" />
  <text class="title" x="12" y="24">PasswordBox: type, properties and defaults</text>
  <rect class="head" x="12" y="38" width="943" height="30" />
  <text class="cell" x="26" y="57.5">item</text>
  <text class="cell" x="941" y="57.5" text-anchor="end">value</text>
  <text class="cell" x="26" y="87.5">base class</text>
  <text class="cell" x="941" y="87.5" text-anchor="end">Control</text>
  <text class="cell" x="26" y="117.5">has PasswordProperty / PasswordCharProperty</text>
  <text class="cell" x="941" y="117.5" text-anchor="end">False / True</text>
  <text class="cell" x="26" y="147.5">PasswordChar (metadata default)</text>
  <text class="cell" x="941" y="147.5" text-anchor="end">'*' (U+002A)</text>
  <text class="cell" x="26" y="177.5">MaxLength / SelectionOpacity / IsInactiveSelectionHighlightEnabled</text>
  <text class="cell" x="941" y="177.5" text-anchor="end">0 / 0.4 / False</text>
  <text class="cell" x="26" y="207.5">PasswordChar with the default style (value source)</text>
  <text class="cell" x="941" y="207.5" text-anchor="end">'●' (U+25CF, DefaultStyle)</text>
  <text class="cell" x="26" y="237.5">CaretBrush / SelectionBrush (value source)</text>
  <text class="cell" x="941" y="237.5" text-anchor="end">null (Default) / #FF0078D7 (Default)</text>
  <text class="cell" x="26" y="267.5">internal text container / its text fields</text>
  <text class="cell" x="941" y="267.5" text-anchor="end">PasswordTextContainer / _password: SecureString</text>
  <text class="cell" x="26" y="297.5">Password = "secret": Password</text>
  <text class="cell" x="941" y="297.5" text-anchor="end">String "secret"</text>
  <text class="cell" x="26" y="327.5">  SecurePassword</text>
  <text class="cell" x="941" y="327.5" text-anchor="end">SecureString, Length 6, read-only False</text>
  <text class="cell" x="26" y="357.5">  SecurePassword twice: same instance</text>
  <text class="cell" x="941" y="357.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="387.5">XAML Password="PASSWORD" (the demo app's markup)</text>
  <text class="cell" x="941" y="387.5" text-anchor="end">Password "PASSWORD"</text>
