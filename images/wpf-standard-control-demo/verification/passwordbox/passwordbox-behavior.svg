<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 350" width="747" height="350" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="747" height="350" />
  <text class="title" x="12" y="24">PasswordBox: input, events, commands and selection</text>
  <rect class="head" x="12" y="38" width="723" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="721" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">MaxLength=8, typed "1234567890"</text>
  <text class="cell" x="721" y="87.5" text-anchor="end">Password "12345678"</text>
  <text class="cell" x="26" y="117.5">MaxLength=8, Password = "1234567890" from code</text>
  <text class="cell" x="721" y="117.5" text-anchor="end">Password "1234567890"</text>
  <text class="cell" x="26" y="147.5">PasswordChanged count: typing "abc" / Password = "xyz" / Clear()</text>
  <text class="cell" x="721" y="147.5" text-anchor="end">1 / 1 / 1</text>
  <text class="cell" x="26" y="177.5">  Password after Clear()</text>
  <text class="cell" x="721" y="177.5" text-anchor="end">""</text>
  <text class="cell" x="26" y="207.5">all text selected: CanExecute of Copy / Cut / Paste</text>
  <text class="cell" x="721" y="207.5" text-anchor="end">False / False / True</text>
  <text class="cell" x="26" y="237.5">IsSelectionActive: before focusing</text>
  <text class="cell" x="721" y="237.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="267.5">  focused, nothing selected</text>
  <text class="cell" x="721" y="267.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="297.5">  focused, all text selected</text>
  <text class="cell" x="721" y="297.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="327.5">  focus moved to another control (selection kept)</text>
  <text class="cell" x="721" y="327.5" text-anchor="end">False</text>
  <line class="line" x1="12" y1="38" x2="735" y2="38" />
  <line class="line" x1="12" y1="68" x2="735" y2="68" />
  <line class="line" x1="12" y1="98" x2="735" y2="98" />
  <line class="line" x1="12" y1="128" x2="735" y2="128" />
  <line class="line" x1="12" y1="158" x2="735" y2="158" />
  <line class="line" x1="12" y1="188" x2="735" y2="188" />
  <line class="line" x1="12" y1="218" x2="735" y2="218" />
  <line class="line" x1="12" y1="248" x2="735" y2="248" />
  <line class="line" x1="12" y1="278" x2="735" y2="278" />
  <line class="line" x1="12" y1="308" x2="735" y2="308" />
  <line class="line" x1="12" y1="338" x2="735" y2="338" />
  <line class="line" x1="12" y1="38" x2="12" y2="338" />
  <line class="line" x1="542" y1="38" x2="542" y2="338" />
  <line class="line" x1="735" y1="38" x2="735" y2="338" />
</svg>
