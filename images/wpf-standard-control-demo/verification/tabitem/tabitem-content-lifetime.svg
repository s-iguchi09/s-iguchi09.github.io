<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 170" width="1128" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1128" height="170" />
  <text class="title" x="12" y="24">TabItem content: when it is loaded, and whether it is reused (three tabs, switching 1 -&gt; 2 -&gt; 1)</text>
  <rect class="head" x="12" y="38" width="1104" height="30" />
  <text class="cell" x="26" y="57.5">how the content is given</text>
  <text class="cell" x="808" y="57.5" text-anchor="end">Loaded count per tab</text>
  <text class="cell" x="1102" y="57.5" text-anchor="end">same instance after switching back</text>
  <text class="cell" x="26" y="87.5">elements as TabItem.Content</text>
  <text class="cell" x="808" y="87.5" text-anchor="end">at start 1 / 1 / 1; after 1 -&gt; 2 -&gt; 1: 2 / 2 / 1</text>
  <text class="cell" x="1102" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="117.5">  same, measure calls per tab at start</text>
  <text class="cell" x="808" y="117.5" text-anchor="end">1 / 0 / 0</text>
  <text class="cell" x="1102" y="117.5" text-anchor="end">-</text>
  <text class="cell" x="26" y="147.5">ItemsSource + ContentTemplate</text>
  <text class="cell" x="808" y="147.5" text-anchor="end">at start 1 created; after 1 -&gt; 2 -&gt; 1: 1 instances created</text>
  <text class="cell" x="1102" y="147.5" text-anchor="end">True</text>
  <line class="line" x1="12" y1="38" x2="1116" y2="38" />
  <line class="line" x1="12" y1="68" x2="1116" y2="68" />
  <line class="line" x1="12" y1="98" x2="1116" y2="98" />
  <line class="line" x1="12" y1="128" x2="1116" y2="128" />
  <line class="line" x1="12" y1="158" x2="1116" y2="158" />
  <line class="line" x1="12" y1="38" x2="12" y2="158" />
  <line class="line" x1="338" y1="38" x2="338" y2="158" />
  <line class="line" x1="822" y1="38" x2="822" y2="158" />
  <line class="line" x1="1116" y1="38" x2="1116" y2="158" />
</svg>
