  <rect class="bg" x="0" y="0" width="1030" height="470" />
  <text class="title" x="12" y="24">TabItem: type, metadata, selection and IsEnabled</text>
  <rect class="head" x="12" y="38" width="1006" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1004" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base class</text>
  <text class="cell" x="1004" y="87.5" text-anchor="end">HeaderedContentControl</text>
  <text class="cell" x="26" y="117.5">IsSelected: BindsTwoWayByDefault</text>
  <text class="cell" x="1004" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="147.5">TabStripPlacement on TabItem: read-only</text>
  <text class="cell" x="1004" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="177.5">TabControl.TabStripPlacement=Left: TabItem.TabStripPlacement of both tabs</text>
  <text class="cell" x="1004" y="177.5" text-anchor="end">Left / Left</text>
  <text class="cell" x="26" y="207.5">Tab3.IsSelected = true: SelectedIndex / IsSelected of Tab1..3</text>
  <text class="cell" x="1004" y="207.5" text-anchor="end">2 / False, False, True</text>
  <text class="cell" x="26" y="237.5">XAML: IsSelected="True" on Tab2 and Tab3: SelectedIndex / IsSelected of Tab1..3</text>
  <text class="cell" x="1004" y="237.5" text-anchor="end">1 / False, True, False</text>
  <text class="cell" x="26" y="267.5">code: Tab2 then Tab3 set to IsSelected=true: SelectedIndex</text>
  <text class="cell" x="1004" y="267.5" text-anchor="end">2</text>
  <text class="cell" x="26" y="297.5">IsSelected bound without Mode; SelectedIndex = 1: source values of Tab1 / Tab2</text>
  <text class="cell" x="1004" y="297.5" text-anchor="end">False / True</text>
  <text class="cell" x="26" y="327.5">  then Tab1's source set to True: SelectedIndex / source values of Tab1 / Tab2</text>
  <text class="cell" x="1004" y="327.5" text-anchor="end">0 / True / False</text>
  <text class="cell" x="26" y="357.5">  then Tab2's header clicked with the real mouse: SelectedIndex / sources of Tab1 / Tab2</text>
  <text class="cell" x="1004" y="357.5" text-anchor="end">1 / False / True</text>
  <text class="cell" x="26" y="387.5">Tab2 IsEnabled=False; SelectedIndex = 1 from code: SelectedIndex / content shown</text>
  <text class="cell" x="1004" y="387.5" text-anchor="end">1 / Item2</text>
  <text class="cell" x="26" y="417.5">Tab2 IsEnabled=False; UI Automation ISelectionItemProvider.Select(): result / SelectedIndex</text>
  <text class="cell" x="1004" y="417.5" text-anchor="end">ElementNotEnabledException / 0</text>
  <text class="cell" x="26" y="447.5">Tab2 IsEnabled=False; header clicked with the real mouse: SelectedIndex</text>
  <text class="cell" x="1004" y="447.5" text-anchor="end">0</text>
