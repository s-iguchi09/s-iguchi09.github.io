<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1187 530" width="1187" height="530" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1187" height="530" />
  <text class="title" x="12" y="24">ToggleButton: type, states, template, ClickMode, Command and Popup</text>
  <rect class="head" x="12" y="38" width="1163" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1161" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base class / derived: CheckBox, RadioButton</text>
  <text class="cell" x="1161" y="87.5" text-anchor="end">ButtonBase / ToggleButton, ToggleButton</text>
  <text class="cell" x="26" y="117.5">IsChecked: BindsTwoWayByDefault / GroupName property on ToggleButton</text>
  <text class="cell" x="1161" y="117.5" text-anchor="end">True / False</text>
  <text class="cell" x="26" y="147.5">IsThreeState=False, start null: 3 clicks</text>
  <text class="cell" x="1161" y="147.5" text-anchor="end">null -&gt; false -&gt; true -&gt; false</text>
  <text class="cell" x="26" y="177.5">IsThreeState=False, start false: 3 clicks</text>
  <text class="cell" x="1161" y="177.5" text-anchor="end">false -&gt; true -&gt; false -&gt; true</text>
  <text class="cell" x="26" y="207.5">IsThreeState=False, start true: 3 clicks</text>
  <text class="cell" x="1161" y="207.5" text-anchor="end">true -&gt; false -&gt; true -&gt; false</text>
  <text class="cell" x="26" y="237.5">IsThreeState=True, start false: 3 clicks</text>
  <text class="cell" x="1161" y="237.5" text-anchor="end">false -&gt; true -&gt; null -&gt; false</text>
  <text class="cell" x="26" y="267.5">default template: VisualStateGroups / triggers on IsChecked (values)</text>
  <text class="cell" x="1161" y="267.5" text-anchor="end">0 / true</text>
  <text class="cell" x="26" y="297.5">UI Automation ToggleState</text>
  <text class="cell" x="1161" y="297.5" text-anchor="end">false -&gt; Off, true -&gt; On, null -&gt; Indeterminate</text>
  <text class="cell" x="26" y="327.5">ClickMode=Press: IsChecked after button down / after button up (false before)</text>
  <text class="cell" x="1161" y="327.5" text-anchor="end">true / true</text>
  <text class="cell" x="26" y="357.5">Command, CommandParameter bound to its own IsChecked; clicked (OnClick) from false: in Execute</text>
  <text class="cell" x="1161" y="357.5" text-anchor="end">IsChecked true, parameter True</text>
  <text class="cell" x="26" y="387.5">  the same button toggled through UI Automation's Toggle: Command</text>
  <text class="cell" x="1161" y="387.5" text-anchor="end">not executed</text>
  <text class="cell" x="26" y="417.5">Popup.IsOpen bound to IsChecked (Mode not set): after click / after the popup closes</text>
  <text class="cell" x="1161" y="417.5" text-anchor="end">IsChecked true, IsOpen True / IsChecked false</text>
  <text class="cell" x="26" y="447.5">  Popup.IsOpen: BindsTwoWayByDefault</text>
  <text class="cell" x="1161" y="447.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="477.5">StaysOpen=False, real clicks (IsOpen, IsChecked): button / empty area</text>
  <text class="cell" x="1161" y="477.5" text-anchor="end">True, true / False, false</text>
  <text class="cell" x="26" y="507.5">  button again / button while open</text>
  <text class="cell" x="1161" y="507.5" text-anchor="end">True, true / True, true</text>
  <line class="line" x1="12" y1="38" x2="1175" y2="38" />
