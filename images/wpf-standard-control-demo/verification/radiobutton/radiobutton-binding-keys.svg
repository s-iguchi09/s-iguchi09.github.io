  <rect class="bg" x="0" y="0" width="1061" height="320" />
  <text class="title" x="12" y="24">RadioButton: bindings, keyboard and VerticalContentAlignment</text>
  <rect class="head" x="12" y="38" width="1037" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1035" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">IsChecked bound to bool A, B, C (Mode not set); B clicked: source / A still bound</text>
  <text class="cell" x="1035" y="87.5" text-anchor="end">A=False, B=True, C=False / True</text>
  <text class="cell" x="26" y="117.5">  then C set to true in the source: source / checked</text>
  <text class="cell" x="1035" y="117.5" text-anchor="end">A=False, B=False, C=True / C</text>
  <text class="cell" x="26" y="147.5">A checked and focused, Down arrow: focus / checked</text>
  <text class="cell" x="1035" y="147.5" text-anchor="end">B / A</text>
  <text class="cell" x="26" y="177.5">focus on A, Tab: focus</text>
  <text class="cell" x="1035" y="177.5" text-anchor="end">B</text>
  <text class="cell" x="26" y="207.5">VerticalContentAlignment (value source)</text>
  <text class="cell" x="1035" y="207.5" text-anchor="end">Top (Default)</text>
  <text class="cell" x="26" y="237.5">3-line label, VerticalContentAlignment=Top, RadioButton 200 high: glyph y / label y</text>
  <text class="cell" x="1035" y="237.5" text-anchor="end">1 (height 12) / -1 (height 47.88)</text>
  <text class="cell" x="26" y="267.5">3-line label, VerticalContentAlignment=Center, RadioButton 200 high: glyph y / label y</text>
  <text class="cell" x="1035" y="267.5" text-anchor="end">94 (height 12) / 75.56 (height 47.88)</text>
