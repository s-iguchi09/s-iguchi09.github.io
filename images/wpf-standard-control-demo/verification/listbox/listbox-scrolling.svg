<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1022 230" width="1022" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1022" height="230" />
  <text class="title" x="12" y="24">ListBox: scrolling and virtualization (1,000 items, 100 high)</text>
  <rect class="head" x="12" y="38" width="998" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="996" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">ListBoxItems created at start</text>
  <text class="cell" x="996" y="87.5" text-anchor="end">6</text>
  <text class="cell" x="26" y="117.5">SelectedIndex = 500 from code: VerticalOffset / container for item 500</text>
  <text class="cell" x="996" y="117.5" text-anchor="end">0 / not created</text>
  <text class="cell" x="26" y="147.5">  then ScrollIntoView(SelectedItem): VerticalOffset / container for item 500</text>
  <text class="cell" x="996" y="147.5" text-anchor="end">497 / created</text>
  <text class="cell" x="26" y="177.5">VerticalScrollBarVisibility=Auto: scrollable / bar; after 20 Down keys</text>
  <text class="cell" x="996" y="177.5" text-anchor="end">996 / Visible; SelectedIndex 20, offset 17</text>
  <text class="cell" x="26" y="207.5">VerticalScrollBarVisibility=Disabled: scrollable / bar; after 20 Down keys</text>
  <text class="cell" x="996" y="207.5" text-anchor="end">996 / Collapsed; SelectedIndex 20, offset 17</text>
  <line class="line" x1="12" y1="38" x2="1010" y2="38" />
  <line class="line" x1="12" y1="68" x2="1010" y2="68" />
  <line class="line" x1="12" y1="98" x2="1010" y2="98" />
  <line class="line" x1="12" y1="128" x2="1010" y2="128" />
  <line class="line" x1="12" y1="158" x2="1010" y2="158" />
  <line class="line" x1="12" y1="188" x2="1010" y2="188" />
  <line class="line" x1="12" y1="218" x2="1010" y2="218" />
  <line class="line" x1="12" y1="38" x2="12" y2="218" />
  <line class="line" x1="637" y1="38" x2="637" y2="218" />
  <line class="line" x1="1010" y1="38" x2="1010" y2="218" />
</svg>
