  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="941" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base class of ListBox / ListView / ComboBox</text>
  <text class="cell" x="941" y="87.5" text-anchor="end">Selector / ListBox / Selector</text>
  <text class="cell" x="26" y="117.5">ListBoxItem.IsSelected: BindsTwoWayByDefault</text>
  <text class="cell" x="941" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="147.5">SelectionMode (default)</text>
  <text class="cell" x="941" y="147.5" text-anchor="end">Single</text>
  <text class="cell" x="26" y="177.5">ScrollViewer.HorizontalScrollBarVisibility / VerticalScrollBarVisibility</text>
  <text class="cell" x="941" y="177.5" text-anchor="end">Auto (DefaultStyle) / Auto (DefaultStyle)</text>
  <text class="cell" x="26" y="207.5">items panel</text>
  <text class="cell" x="941" y="207.5" text-anchor="end">VirtualizingStackPanel</text>
  <text class="cell" x="26" y="237.5">SelectionMode=Single: click Item 1, Item 2, Item 1 (no modifier keys)</text>
  <text class="cell" x="941" y="237.5" text-anchor="end">Item 1  -&gt;  Item 2  -&gt;  Item 1</text>
  <text class="cell" x="26" y="267.5">SelectionMode=Multiple: click Item 1, Item 2, Item 1 (no modifier keys)</text>
  <text class="cell" x="941" y="267.5" text-anchor="end">Item 1  -&gt;  Item 1, Item 2  -&gt;  Item 2</text>
  <text class="cell" x="26" y="297.5">SelectionMode=Extended: click Item 1, Item 2, Item 1 (no modifier keys)</text>
  <text class="cell" x="941" y="297.5" text-anchor="end">Item 1  -&gt;  Item 2  -&gt;  Item 1</text>
  <text class="cell" x="26" y="327.5">SelectionMode=Single: SelectAll()</text>
  <text class="cell" x="941" y="327.5" text-anchor="end">NotSupportedException; 0 selected</text>
  <text class="cell" x="26" y="357.5">SelectionMode=Multiple: SelectAll()</text>
  <text class="cell" x="941" y="357.5" text-anchor="end">no exception; 4 selected</text>
  <text class="cell" x="26" y="387.5">SelectionMode=Extended: SelectAll()</text>
  <text class="cell" x="941" y="387.5" text-anchor="end">no exception; 4 selected</text>
