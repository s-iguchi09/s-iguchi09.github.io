<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 998 350" width="998" height="350" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="998" height="350" />
  <text class="title" x="12" y="24">RepeatButton: defaults, holding the real mouse button, keyboard</text>
  <rect class="head" x="12" y="38" width="974" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="972" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">default Delay / Interval (KeyboardDelay / KeyboardSpeed on this machine)</text>
  <text class="cell" x="972" y="87.5" text-anchor="end">500 / 33 (1 / 31)</text>
  <text class="cell" x="26" y="117.5">default ClickMode</text>
  <text class="cell" x="972" y="117.5" text-anchor="end">Press</text>
  <text class="cell" x="26" y="147.5">Delay=300, Interval=100, mouse held for about 1 s: clicks while held / after release</text>
  <text class="cell" x="972" y="147.5" text-anchor="end">8 / 0</text>
  <text class="cell" x="26" y="177.5">  first click after button down / second after the first</text>
  <text class="cell" x="972" y="177.5" text-anchor="end">23 ms / 320 ms</text>
  <text class="cell" x="26" y="207.5">  gaps after that: min / median / max</text>
  <text class="cell" x="972" y="207.5" text-anchor="end">108 ms / 110 ms / 111 ms</text>
  <text class="cell" x="26" y="237.5">  Command executions / Click events</text>
  <text class="cell" x="972" y="237.5" text-anchor="end">8 / 8</text>
  <text class="cell" x="26" y="267.5">held, moved off for 0.5 s, moved back for 0.5 s: clicks outside (IsPressed) / after returning</text>
  <text class="cell" x="972" y="267.5" text-anchor="end">0 (False) / 4</text>
  <text class="cell" x="26" y="297.5">Space held for 1 s, one key-down event (no OS key repeat): clicks while held / after release</text>
  <text class="cell" x="972" y="297.5" text-anchor="end">8 / 0</text>
  <text class="cell" x="26" y="327.5">UI Automation Invoke: clicks</text>
  <text class="cell" x="972" y="327.5" text-anchor="end">1</text>
