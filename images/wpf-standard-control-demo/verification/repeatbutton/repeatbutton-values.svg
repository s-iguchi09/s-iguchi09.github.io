<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 260" width="912" height="260" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="912" height="260" />
  <text class="title" x="12" y="24">RepeatButton: invalid values and where WPF uses it</text>
  <rect class="head" x="12" y="38" width="888" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="886" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">Delay = -1 / Delay = 0 set from code</text>
  <text class="cell" x="886" y="87.5" text-anchor="end">ArgumentException / no exception</text>
  <text class="cell" x="26" y="117.5">Interval = 0 / Interval = 1 set from code</text>
  <text class="cell" x="886" y="117.5" text-anchor="end">ArgumentException / no exception</text>
  <text class="cell" x="26" y="147.5">demo binding, Delay from TextBox.Text (in order)</text>
  <text class="cell" x="886" y="147.5" text-anchor="end">"200" -&gt; 200, "-1" -&gt; 500, "" -&gt; 500, "abc" -&gt; 500</text>
  <text class="cell" x="26" y="177.5">demo binding, Interval from TextBox.Text (in order)</text>
  <text class="cell" x="886" y="177.5" text-anchor="end">"50" -&gt; 50, "0" -&gt; 33</text>
  <text class="cell" x="26" y="207.5">RepeatButtons in the ScrollBar template (their commands)</text>
  <text class="cell" x="886" y="207.5" text-anchor="end">LineUp, PageUp, PageDown, LineDown</text>
  <text class="cell" x="26" y="237.5">RepeatButtons in the Slider template (their commands)</text>
  <text class="cell" x="886" y="237.5" text-anchor="end">DecreaseLarge, IncreaseLarge</text>
  <line class="line" x1="12" y1="38" x2="900" y2="38" />
  <line class="line" x1="12" y1="68" x2="900" y2="68" />
  <line class="line" x1="12" y1="98" x2="900" y2="98" />
  <line class="line" x1="12" y1="128" x2="900" y2="128" />
  <line class="line" x1="12" y1="158" x2="900" y2="158" />
  <line class="line" x1="12" y1="188" x2="900" y2="188" />
  <line class="line" x1="12" y1="218" x2="900" y2="218" />
  <line class="line" x1="12" y1="248" x2="900" y2="248" />
  <line class="line" x1="12" y1="38" x2="12" y2="248" />
  <line class="line" x1="480" y1="38" x2="480" y2="248" />
  <line class="line" x1="900" y1="38" x2="900" y2="248" />
</svg>
