<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1132 320" width="1132" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1132" height="320" />
  <text class="title" x="12" y="24">Expander: type, template, clicks and collapsed content</text>
  <rect class="head" x="12" y="38" width="1108" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1106" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base class / IsExpanded default, two-way by default / ExpandDirection</text>
  <text class="cell" x="1106" y="87.5" text-anchor="end">HeaderedContentControl / False, True / Down</text>
  <text class="cell" x="26" y="117.5">default template: header element / VisualStateGroups</text>
  <text class="cell" x="1106" y="117.5" text-anchor="end">ToggleButton named HeaderSite / 0</text>
  <text class="cell" x="26" y="147.5">  triggers</text>
  <text class="cell" x="1106" y="147.5" text-anchor="end">IsExpanded=True; ExpandDirection=Right, Up, Left; IsEnabled=False</text>
  <text class="cell" x="26" y="177.5">IsExpanded set to False: content Visibility at once / after 50 ms</text>
  <text class="cell" x="1106" y="177.5" text-anchor="end">Collapsed / Collapsed</text>
  <text class="cell" x="26" y="207.5">real mouse click on header: IsExpanded / bound CheckBox / events</text>
  <text class="cell" x="1106" y="207.5" text-anchor="end">True / True / Expanded</text>
  <text class="cell" x="26" y="237.5">  then the CheckBox cleared: IsExpanded / events</text>
  <text class="cell" x="1106" y="237.5" text-anchor="end">False / Collapsed</text>
  <text class="cell" x="26" y="267.5">collapsed: child Loaded / measured / items in a 1000-item ListBox</text>
  <text class="cell" x="1106" y="267.5" text-anchor="end">1 / 0 / 0</text>
  <text class="cell" x="26" y="297.5">  after expanding</text>
  <text class="cell" x="1106" y="297.5" text-anchor="end">2 / 1 / 11</text>
