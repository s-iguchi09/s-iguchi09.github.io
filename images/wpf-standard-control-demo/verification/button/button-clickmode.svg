<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1046 320" width="1046" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1046" height="320" />
  <text class="title" x="12" y="24">Button: ClickMode and IsPressed (real mouse, keyboard)</text>
  <rect class="head" x="12" y="38" width="1022" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1020" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">default ClickMode / IsPressed is read-only</text>
  <text class="cell" x="1020" y="87.5" text-anchor="end">Release / True</text>
  <text class="cell" x="26" y="117.5">Hover (mouse): pointer enters / pointer leaves</text>
  <text class="cell" x="1020" y="117.5" text-anchor="end">Hover, IsPressed True / (none), IsPressed False</text>
  <text class="cell" x="26" y="147.5">Press (mouse): button down / button up</text>
  <text class="cell" x="1020" y="147.5" text-anchor="end">Press, IsPressed True / (none), IsPressed False</text>
  <text class="cell" x="26" y="177.5">Release (mouse): button down / button up</text>
  <text class="cell" x="1020" y="177.5" text-anchor="end">(none), IsPressed True / Release, IsPressed False</text>
  <text class="cell" x="26" y="207.5">Release (mouse): down on the button, moved off, released outside</text>
  <text class="cell" x="1020" y="207.5" text-anchor="end">IsPressed False after moving off / (none)</text>
  <text class="cell" x="26" y="237.5">Release (keyboard): Space down / Space up / Enter down</text>
  <text class="cell" x="1020" y="237.5" text-anchor="end">(none), IsPressed True / Release, IsPressed False / Release</text>
  <text class="cell" x="26" y="267.5">Press (keyboard): Space down / Space up / Enter down</text>
  <text class="cell" x="1020" y="267.5" text-anchor="end">Press, IsPressed True / (none), IsPressed False / Press</text>
  <text class="cell" x="26" y="297.5">Hover (keyboard): Space down / Space up / Enter down</text>
  <text class="cell" x="1020" y="297.5" text-anchor="end">(none), IsPressed False / (none), IsPressed False / (none)</text>
  <line class="line" x1="12" y1="38" x2="1034" y2="38" />
