<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1046 290" width="1046" height="290" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1046" height="290" />
  <text class="title" x="12" y="24">Button: Command and CommandParameter</text>
  <rect class="head" x="12" y="38" width="1022" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1020" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">CanExecute false: IsEnabled / with IsEnabled="True" set</text>
  <text class="cell" x="1020" y="87.5" text-anchor="end">False / False</text>
  <text class="cell" x="26" y="117.5">CanExecute turns true: IsEnabled / after InvalidateRequerySuggested</text>
  <text class="cell" x="1020" y="117.5" text-anchor="end">False / True</text>
  <text class="cell" x="26" y="147.5">20 buttons, same command: CanExecute calls per focus change</text>
  <text class="cell" x="1020" y="147.5" text-anchor="end">20</text>
  <text class="cell" x="26" y="177.5">demo XAML: parameters passed to CanExecute while loading</text>
  <text class="cell" x="1020" y="177.5" text-anchor="end">ShowMessageText, ShowMessageText</text>
  <text class="cell" x="26" y="207.5">  TextBox.Text set to empty from code: CanExecute calls / IsEnabled</text>
  <text class="cell" x="1020" y="207.5" text-anchor="end">1 / False</text>
  <text class="cell" x="26" y="237.5">  TextBox.Text set to Hello, then clicked: parameter of Execute</text>
  <text class="cell" x="1020" y="237.5" text-anchor="end">Hello</text>
  <text class="cell" x="26" y="267.5">item template, CommandParameter="{Binding}": real click on the second row: Execute received</text>
  <text class="cell" x="1020" y="267.5" text-anchor="end">Row 2</text>
  <line class="line" x1="12" y1="38" x2="1034" y2="38" />
  <line class="line" x1="12" y1="68" x2="1034" y2="68" />
  <line class="line" x1="12" y1="98" x2="1034" y2="98" />
  <line class="line" x1="12" y1="128" x2="1034" y2="128" />
  <line class="line" x1="12" y1="158" x2="1034" y2="158" />
  <line class="line" x1="12" y1="188" x2="1034" y2="188" />
  <line class="line" x1="12" y1="218" x2="1034" y2="218" />
  <line class="line" x1="12" y1="248" x2="1034" y2="248" />
  <line class="line" x1="12" y1="278" x2="1034" y2="278" />
  <line class="line" x1="12" y1="38" x2="12" y2="278" />
  <line class="line" x1="754" y1="38" x2="754" y2="278" />
  <line class="line" x1="1034" y1="38" x2="1034" y2="278" />
</svg>
