<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 889 290" width="889" height="290" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="889" height="290" />
  <text class="title" x="12" y="24">Button: IsCancel and IsDefault (keys sent through the input pipeline)</text>
  <rect class="head" x="12" y="38" width="865" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="863" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">in a UserControl, focus in a TextBox: Esc -&gt; clicked / window still open</text>
  <text class="cell" x="863" y="87.5" text-anchor="end">IsCancel / True</text>
  <text class="cell" x="26" y="117.5">  Enter -&gt; clicked (IsDefaulted before the key)</text>
  <text class="cell" x="863" y="117.5" text-anchor="end">IsDefault (True)</text>
  <text class="cell" x="26" y="147.5">focus in a TextBox with AcceptsReturn: Enter -&gt; clicked / line breaks in the text</text>
  <text class="cell" x="863" y="147.5" text-anchor="end">(none) / 1</text>
  <text class="cell" x="26" y="177.5">focus on another Button: Enter -&gt; clicked (IsDefaulted of the IsDefault button)</text>
  <text class="cell" x="863" y="177.5" text-anchor="end">Other (False)</text>
  <text class="cell" x="26" y="207.5">two IsCancel buttons: Esc -&gt; clicked / keyboard focus</text>
  <text class="cell" x="863" y="207.5" text-anchor="end">(none) / Cancel 1</text>
  <text class="cell" x="26" y="237.5">  Esc again -&gt; clicked / keyboard focus</text>
  <text class="cell" x="863" y="237.5" text-anchor="end">(none) / Cancel 2</text>
  <text class="cell" x="26" y="267.5">IsCancel in a window shown with ShowDialog: Esc -&gt; window closed / ShowDialog returned</text>
  <text class="cell" x="863" y="267.5" text-anchor="end">True / False</text>
  <line class="line" x1="12" y1="38" x2="877" y2="38" />
  <line class="line" x1="12" y1="68" x2="877" y2="68" />
  <line class="line" x1="12" y1="98" x2="877" y2="98" />
  <line class="line" x1="12" y1="128" x2="877" y2="128" />
  <line class="line" x1="12" y1="158" x2="877" y2="158" />
  <line class="line" x1="12" y1="188" x2="877" y2="188" />
  <line class="line" x1="12" y1="218" x2="877" y2="218" />
  <line class="line" x1="12" y1="248" x2="877" y2="248" />
  <line class="line" x1="12" y1="278" x2="877" y2="278" />
  <line class="line" x1="12" y1="38" x2="12" y2="278" />
  <line class="line" x1="715" y1="38" x2="715" y2="278" />
  <line class="line" x1="877" y1="38" x2="877" y2="278" />
</svg>
