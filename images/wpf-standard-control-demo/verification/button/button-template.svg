  <rect class="bg" x="0" y="0" width="1140" height="290" />
  <text class="title" x="12" y="24">Button: type, default template and UI Automation name</text>
  <rect class="head" x="12" y="38" width="1116" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1114" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base classes</text>
  <text class="cell" x="1114" y="87.5" text-anchor="end">ButtonBase -&gt; ContentControl</text>
  <text class="cell" x="26" y="117.5">default template: VisualStateGroups / triggers</text>
  <text class="cell" x="1114" y="117.5" text-anchor="end">0 / IsDefaulted=True, IsMouseOver=True, IsPressed=True, IsChecked=True, IsEnabled=False</text>
  <text class="cell" x="26" y="147.5">  ContentPresenter.RecognizesAccessKey</text>
  <text class="cell" x="1114" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="177.5">UI Automation name: Content "Save"</text>
  <text class="cell" x="1114" y="177.5" text-anchor="end">Save</text>
  <text class="cell" x="26" y="207.5">  Content "_Save"</text>
  <text class="cell" x="1114" y="207.5" text-anchor="end">Save (access key S)</text>
  <text class="cell" x="26" y="237.5">  Content is an Image</text>
  <text class="cell" x="1114" y="237.5" text-anchor="end">(empty)</text>
  <text class="cell" x="26" y="267.5">  an Image with AutomationProperties.Name="Save"</text>
  <text class="cell" x="1114" y="267.5" text-anchor="end">Save</text>
