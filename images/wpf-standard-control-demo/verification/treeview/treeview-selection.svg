<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1108 410" width="1108" height="410" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1108" height="410" />
  <text class="title" x="12" y="24">TreeView: types, metadata, selection and focus</text>
  <rect class="head" x="12" y="38" width="1084" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1082" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">base class of TreeView / TreeViewItem</text>
  <text class="cell" x="1082" y="87.5" text-anchor="end">ItemsControl / HeaderedItemsControl</text>
  <text class="cell" x="26" y="117.5">SelectedItem / SelectedValue read-only</text>
  <text class="cell" x="1082" y="117.5" text-anchor="end">True / True</text>
  <text class="cell" x="26" y="147.5">IsExpanded / IsSelected: BindsTwoWayByDefault</text>
  <text class="cell" x="1082" y="147.5" text-anchor="end">False / True</text>
  <text class="cell" x="26" y="177.5">SetBinding(TreeView.SelectedItemProperty, ...)</text>
  <text class="cell" x="1082" y="177.5" text-anchor="end">ArgumentException</text>
  <text class="cell" x="26" y="207.5">XAML TreeViewItems, SelectedValuePath="Header"; select "Gaming PC": SelectedItem / SelectedValue</text>
  <text class="cell" x="1082" y="207.5" text-anchor="end">TreeViewItem / Gaming PC</text>
  <text class="cell" x="26" y="237.5">ItemsSource data; source Desktop.IsSelected = true: SelectedItem</text>
  <text class="cell" x="1082" y="237.5" text-anchor="end">ToString:Desktop</text>
  <text class="cell" x="26" y="267.5">  then source Mobile.IsSelected = true: SelectedItem / Desktop.IsSelected / Mobile.IsSelected</text>
  <text class="cell" x="1082" y="267.5" text-anchor="end">ToString:Mobile / False / True</text>
  <text class="cell" x="26" y="297.5">Node 2 IsSelectionActive: nothing selected, no focus</text>
  <text class="cell" x="1082" y="297.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="327.5">  Node 2 selected from code (IsSelected / IsSelectionActive)</text>
  <text class="cell" x="1082" y="327.5" text-anchor="end">True / False</text>
  <text class="cell" x="26" y="357.5">  Node 2 focused</text>
  <text class="cell" x="1082" y="357.5" text-anchor="end">True / True</text>
  <text class="cell" x="26" y="387.5">  focus moved to a TextBox</text>
  <text class="cell" x="1082" y="387.5" text-anchor="end">True / False</text>
