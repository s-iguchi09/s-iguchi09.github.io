<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1203 590" width="1203" height="590" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1203" height="590" />
  <text class="title" x="12" y="24">DataGrid: editing, sorting, alternation, virtualization, frozen columns (4 x 100 in 200)</text>
  <rect class="head" x="12" y="38" width="1179" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1177" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">Name cell, F2: IsEditing / editor</text>
  <text class="cell" x="1177" y="87.5" text-anchor="end">True / TextBox</text>
  <text class="cell" x="26" y="117.5">  typed "Changed", Esc: IsEditing / source</text>
  <text class="cell" x="1177" y="117.5" text-anchor="end">False / "Name 1"</text>
  <text class="cell" x="26" y="147.5">  F2, typed "Committed", Enter: source</text>
  <text class="cell" x="1177" y="147.5" text-anchor="end">"Committed"</text>
  <text class="cell" x="26" y="177.5">editor by column type</text>
  <text class="cell" x="1177" y="177.5" text-anchor="end">Text: TextBox, CheckBox: CheckBox, ComboBox: ComboBox</text>
  <text class="cell" x="26" y="207.5">Name header clicked 3 times: SortDirection</text>
  <text class="cell" x="1177" y="207.5" text-anchor="end">Ascending -&gt; Descending -&gt; Ascending</text>
  <text class="cell" x="26" y="237.5">editing a cell, Items.SortDescriptions.Add(...)</text>
  <text class="cell" x="1177" y="237.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="26" y="267.5">  after CommitEdit()</text>
  <text class="cell" x="1177" y="267.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="26" y="297.5">  after CancelEdit()</text>
  <text class="cell" x="1177" y="297.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="26" y="327.5">  after CommitEdit(DataGridEditingUnit.Row, true)</text>
  <text class="cell" x="1177" y="327.5" text-anchor="end">no exception</text>
  <text class="cell" x="26" y="357.5">  after CancelEdit(DataGridEditingUnit.Row)</text>
  <text class="cell" x="1177" y="357.5" text-anchor="end">no exception</text>
  <text class="cell" x="26" y="387.5">only AlternatingRowBackground set: AlternationCount / rows</text>
  <text class="cell" x="1177" y="387.5" text-anchor="end">2 / #FFFFFFFF, #FFD3D3D3, #FFFFFFFF, #FFD3D3D3</text>
  <text class="cell" x="26" y="417.5">1,000 rows: DataGridRows / GroupItems</text>
  <text class="cell" x="1177" y="417.5" text-anchor="end">11 / 0</text>
  <text class="cell" x="26" y="447.5">1,000 rows grouped, with GroupStyle: DataGridRows / GroupItems</text>
  <text class="cell" x="1177" y="447.5" text-anchor="end">1000 / 10</text>
  <text class="cell" x="26" y="477.5">1,000 rows grouped, no GroupStyle: DataGridRows / GroupItems</text>
  <text class="cell" x="1177" y="477.5" text-anchor="end">11 / 0</text>
  <text class="cell" x="26" y="507.5">1,000 rows grouped, GroupStyle, IsVirtualizingWhenGrouping=True: DataGridRows / GroupItems</text>
  <text class="cell" x="1177" y="507.5" text-anchor="end">18 / 1</text>
  <text class="cell" x="26" y="537.5">FrozenColumnCount=0, scrolled 60: x of columns 1, 2 before / after</text>
  <text class="cell" x="1177" y="537.5" text-anchor="end">7, 107 / -53, 47</text>
  <text class="cell" x="26" y="567.5">FrozenColumnCount=1, scrolled 60: x of columns 1, 2 before / after</text>
  <text class="cell" x="1177" y="567.5" text-anchor="end">7, 107 / 7, 47</text>
