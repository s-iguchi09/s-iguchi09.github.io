  <text class="cell" x="1192" y="327.5" text-anchor="end">shown / True</text>
  <text class="cell" x="26" y="357.5">new-item row / CanUserAddRows, ItemsSource Person[] (array)</text>
  <text class="cell" x="1192" y="357.5" text-anchor="end">not shown / False</text>
