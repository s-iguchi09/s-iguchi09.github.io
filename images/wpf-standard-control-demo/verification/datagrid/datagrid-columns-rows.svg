  <text class="cell" x="1192" y="207.5" text-anchor="end">True / True</text>
  <text class="cell" x="26" y="237.5">DataGrid IsReadOnly=True: CanUserAddRows</text>
  <text class="cell" x="1192" y="237.5" text-anchor="end">False (Default)</text>
  <text class="cell" x="26" y="267.5">  column IsReadOnly=False set: IsReadOnly / BeginEdit()</text>
  <text class="cell" x="1192" y="267.5" text-anchor="end">False / False</text>
  <text class="cell" x="26" y="297.5">new-item row / CanUserAddRows, ItemsSource List&lt;Person&gt;</text>
  <text class="cell" x="1192" y="297.5" text-anchor="end">shown / True</text>
