  <text class="cell" x="1192" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">auto columns, declared Zeta, Alpha (get-only), Mid</text>
  <text class="cell" x="1192" y="87.5" text-anchor="end">Zeta (editable), Alpha (read-only), Mid (editable)</text>
  <text class="cell" x="26" y="117.5">auto columns, demo SampleItem (IDataErrorInfo)</text>
  <text class="cell" x="1192" y="117.5" text-anchor="end">Name (editable), Value (editable), Error (read-only)</text>
  <text class="cell" x="26" y="147.5">2 columns, FrozenColumnCount = 3 (demo slider max)</text>
  <text class="cell" x="1192" y="147.5" text-anchor="end">no exception, shown; value 2</text>
