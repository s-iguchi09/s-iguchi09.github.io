<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 623 200" width="623" height="200" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="623" height="200" />
  <text class="title" x="12" y="24">can the text be selected, and how does it take focus?</text>
  <rect class="head" x="12" y="38" width="599" height="30" />
  <text class="cell" x="26" y="57.5">control</text>
  <text class="cell" x="399" y="57.5" text-anchor="end">SelectAll() selects</text>
  <text class="cell" x="498" y="57.5" text-anchor="end">Focusable</text>
  <text class="cell" x="597" y="57.5" text-anchor="end">IsTabStop</text>
  <text class="cell" x="26" y="87.5">TextBlock</text>
  <text class="cell" x="399" y="87.5" text-anchor="end">no selection API</text>
  <text class="cell" x="498" y="87.5" text-anchor="end">False</text>
  <text class="cell" x="597" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="117.5">TextBox IsReadOnly=True</text>
  <text class="cell" x="399" y="117.5" text-anchor="end">selectable text</text>
  <text class="cell" x="498" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="597" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="147.5">+ borderless, transparent</text>
  <text class="cell" x="399" y="147.5" text-anchor="end">selectable text</text>
  <text class="cell" x="498" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="597" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="177.5">+ IsTabStop=False</text>
  <text class="cell" x="399" y="177.5" text-anchor="end">selectable text</text>
  <text class="cell" x="498" y="177.5" text-anchor="end">True</text>
  <text class="cell" x="597" y="177.5" text-anchor="end">False</text>
  <line class="line" x1="12" y1="38" x2="611" y2="38" />
  <line class="line" x1="12" y1="68" x2="611" y2="68" />
