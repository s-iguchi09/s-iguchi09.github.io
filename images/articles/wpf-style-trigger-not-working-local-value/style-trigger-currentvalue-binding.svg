<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 865 290" width="865" height="290" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="865" height="290" />
  <text class="title" x="12" y="24">SetCurrentValue, assignment over a binding, and the theme style</text>
  <rect class="head" x="12" y="38" width="841" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="839" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">local Red: right after SetCurrentValue(White)</text>
  <text class="cell" x="839" y="87.5" text-anchor="end">#FFFFFFFF (Local)</text>
  <text class="cell" x="26" y="117.5">local Red: SetCurrentValue(White), then Tag = on</text>
  <text class="cell" x="839" y="117.5" text-anchor="end">#FFFFFFFF (Local)</text>
  <text class="cell" x="26" y="147.5">no local value: right after SetCurrentValue(White)</text>
  <text class="cell" x="839" y="147.5" text-anchor="end">#FFFFFFFF (Default)</text>
  <text class="cell" x="26" y="177.5">no local value: SetCurrentValue(White), then Tag = on</text>
  <text class="cell" x="839" y="177.5" text-anchor="end">#FF008000 (StyleTrigger)</text>
  <text class="cell" x="26" y="207.5">TextBox.Text bound OneWay, then Text = "typed" in code</text>
  <text class="cell" x="839" y="207.5" text-anchor="end">binding removed, source.Value = from source</text>
  <text class="cell" x="26" y="237.5">TextBox.Text bound TwoWay, then Text = "typed" in code</text>
  <text class="cell" x="839" y="237.5" text-anchor="end">binding kept, source.Value = from source</text>
  <text class="cell" x="26" y="267.5">Button with an explicit Style (Foreground only): Template</text>
  <text class="cell" x="839" y="267.5" text-anchor="end">set (DefaultStyle)</text>
  <line class="line" x1="12" y1="38" x2="853" y2="38" />
  <line class="line" x1="12" y1="68" x2="853" y2="68" />
  <line class="line" x1="12" y1="98" x2="853" y2="98" />
  <line class="line" x1="12" y1="128" x2="853" y2="128" />
