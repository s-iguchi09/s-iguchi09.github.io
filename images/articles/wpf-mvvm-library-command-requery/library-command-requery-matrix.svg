<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1483 320" width="1483" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1483" height="320" />
  <text class="title" x="12" y="24">Save button IsEnabled (CanExecute: Name is not empty)</text>
  <rect class="head" x="12" y="38" width="1459" height="30" />
  <text class="cell" x="26" y="57.5">command and view model</text>
  <text class="cell" x="808" y="57.5" text-anchor="end">before typing</text>
  <text class="cell" x="1008" y="57.5" text-anchor="end">after setting the name</text>
  <text class="cell" x="1288" y="57.5" text-anchor="end">after InvalidateRequerySuggested</text>
  <text class="cell" x="1457" y="57.5" text-anchor="end">after moving focus</text>
  <text class="cell" x="26" y="87.5">own RelayCommand, CanExecuteChanged =&gt; CommandManager.RequerySuggested (name typed)</text>
  <text class="cell" x="808" y="87.5" text-anchor="end">False</text>
  <text class="cell" x="1008" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="1288" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="1457" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="117.5">same command, name assigned to the view model in code</text>
  <text class="cell" x="808" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="1008" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="1288" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="1457" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="147.5">Toolkit RelayCommand, setter calls SetProperty only</text>
  <text class="cell" x="808" y="147.5" text-anchor="end">False</text>
  <text class="cell" x="1008" y="147.5" text-anchor="end">False</text>
  <text class="cell" x="1288" y="147.5" text-anchor="end">False</text>
  <text class="cell" x="1457" y="147.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="177.5">Toolkit RelayCommand, setter calls NotifyCanExecuteChanged</text>
  <text class="cell" x="808" y="177.5" text-anchor="end">False</text>
  <text class="cell" x="1008" y="177.5" text-anchor="end">True</text>
  <text class="cell" x="1288" y="177.5" text-anchor="end">True</text>
  <text class="cell" x="1457" y="177.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="207.5">Toolkit [ObservableProperty] + [NotifyCanExecuteChangedFor]</text>
  <text class="cell" x="808" y="207.5" text-anchor="end">False</text>
  <text class="cell" x="1008" y="207.5" text-anchor="end">True</text>
  <text class="cell" x="1288" y="207.5" text-anchor="end">True</text>
  <text class="cell" x="1457" y="207.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="237.5">Prism DelegateCommand, setter calls SetProperty only</text>
  <text class="cell" x="808" y="237.5" text-anchor="end">False</text>
  <text class="cell" x="1008" y="237.5" text-anchor="end">False</text>
  <text class="cell" x="1288" y="237.5" text-anchor="end">False</text>
  <text class="cell" x="1457" y="237.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="267.5">Prism DelegateCommand, setter calls RaiseCanExecuteChanged</text>
  <text class="cell" x="808" y="267.5" text-anchor="end">False</text>
  <text class="cell" x="1008" y="267.5" text-anchor="end">True</text>
  <text class="cell" x="1288" y="267.5" text-anchor="end">True</text>
  <text class="cell" x="1457" y="267.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="297.5">Prism DelegateCommand + ObservesProperty(() =&gt; Name)</text>
  <text class="cell" x="808" y="297.5" text-anchor="end">False</text>
  <text class="cell" x="1008" y="297.5" text-anchor="end">True</text>
  <text class="cell" x="1288" y="297.5" text-anchor="end">True</text>
  <text class="cell" x="1457" y="297.5" text-anchor="end">True</text>
