  <line class="line" x1="12" y1="188" x2="1231" y2="188" />
  <line class="line" x1="12" y1="218" x2="1231" y2="218" />
  <line class="line" x1="12" y1="38" x2="12" y2="218" />
  <line class="line" x1="637" y1="38" x2="637" y2="218" />
  <line class="line" x1="774" y1="38" x2="774" y2="218" />
  <line class="line" x1="1007" y1="38" x2="1007" y2="218" />
  <line class="line" x1="1231" y1="38" x2="1231" y2="218" />
