<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 170" width="1070" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1070" height="170" />
  <text class="title" x="12" y="24">DialogResult after ClosingGuard cancels once</text>
  <rect class="head" x="12" y="38" width="1046" height="30" />
  <text class="cell" x="26" y="57.5">condition</text>
  <text class="cell" x="619" y="57.5" text-anchor="end">Closing raised</text>
  <text class="cell" x="851" y="57.5" text-anchor="end">checks started / completed</text>
  <text class="cell" x="1044" y="57.5" text-anchor="end">ShowDialog() returned</text>
  <text class="cell" x="26" y="87.5">ShowDialog, DialogResult = true (no ClosingGuard)</text>
  <text class="cell" x="619" y="87.5" text-anchor="end">1</text>
  <text class="cell" x="851" y="87.5" text-anchor="end">0 / 0</text>
  <text class="cell" x="1044" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="117.5">ShowDialog, DialogResult = true, Cancel then Close() again</text>
  <text class="cell" x="619" y="117.5" text-anchor="end">2</text>
  <text class="cell" x="851" y="117.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1044" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="147.5">ShowDialog, DialogResult = true, ClosingGuard (true)</text>
  <text class="cell" x="619" y="147.5" text-anchor="end">2</text>
  <text class="cell" x="851" y="147.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1044" y="147.5" text-anchor="end">True</text>
  <line class="line" x1="12" y1="38" x2="1058" y2="38" />
  <line class="line" x1="12" y1="68" x2="1058" y2="68" />
  <line class="line" x1="12" y1="98" x2="1058" y2="98" />
  <line class="line" x1="12" y1="128" x2="1058" y2="128" />
  <line class="line" x1="12" y1="158" x2="1058" y2="158" />
  <line class="line" x1="12" y1="38" x2="12" y2="158" />
  <line class="line" x1="495" y1="38" x2="495" y2="158" />
  <line class="line" x1="633" y1="38" x2="633" y2="158" />
  <line class="line" x1="865" y1="38" x2="865" y2="158" />
  <line class="line" x1="1058" y1="38" x2="1058" y2="158" />
</svg>
