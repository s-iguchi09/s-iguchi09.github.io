<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1243 230" width="1243" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1243" height="230" />
  <text class="title" x="12" y="24">DialogResult after ClosingGuard cancels once</text>
  <rect class="head" x="12" y="38" width="1219" height="30" />
  <text class="cell" x="26" y="57.5">condition</text>
  <text class="cell" x="760" y="57.5" text-anchor="end">Closing raised</text>
  <text class="cell" x="993" y="57.5" text-anchor="end">checks started / completed</text>
  <text class="cell" x="1217" y="57.5" text-anchor="end">ShowDialog() result</text>
  <text class="cell" x="26" y="87.5">ShowDialog, DialogResult = true (no ClosingGuard)</text>
  <text class="cell" x="760" y="87.5" text-anchor="end">1</text>
  <text class="cell" x="993" y="87.5" text-anchor="end">0 / 0</text>
  <text class="cell" x="1217" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="117.5">ShowDialog, DialogResult = true, Cancel then Close() again</text>
  <text class="cell" x="760" y="117.5" text-anchor="end">2</text>
  <text class="cell" x="993" y="117.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1217" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="147.5">ShowDialog, DialogResult = true, ClosingGuard (true)</text>
  <text class="cell" x="760" y="147.5" text-anchor="end">2</text>
  <text class="cell" x="993" y="147.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1217" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="177.5">ShowDialog, DialogResult = true, ClosingGuard, Owner closed during the check</text>
  <text class="cell" x="760" y="177.5" text-anchor="end">1</text>
  <text class="cell" x="993" y="177.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1217" y="177.5" text-anchor="end">not returned within 1.5 s</text>
  <text class="cell" x="26" y="207.5">ShowDialog, no ClosingGuard, Owner closed (DialogResult not set)</text>
  <text class="cell" x="760" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="993" y="207.5" text-anchor="end">0 / 0</text>
  <text class="cell" x="1217" y="207.5" text-anchor="end">not returned within 1.5 s</text>
  <line class="line" x1="12" y1="38" x2="1231" y2="38" />
  <line class="line" x1="12" y1="68" x2="1231" y2="68" />
  <line class="line" x1="12" y1="98" x2="1231" y2="98" />
  <line class="line" x1="12" y1="128" x2="1231" y2="128" />
