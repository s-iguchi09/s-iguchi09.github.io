<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1432 230" width="1432" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1432" height="230" />
  <text class="title" x="12" y="24">Application.Shutdown ignores Cancel</text>
  <rect class="head" x="12" y="38" width="1408" height="30" />
  <text class="cell" x="26" y="57.5">condition</text>
  <text class="cell" x="572" y="57.5" text-anchor="end">Closing raised</text>
  <text class="cell" x="804" y="57.5" text-anchor="end">checks started / completed</text>
  <text class="cell" x="1036" y="57.5" text-anchor="end">Closed raised</text>
  <text class="cell" x="1213" y="57.5" text-anchor="end">unhandled exception</text>
  <text class="cell" x="1406" y="57.5" text-anchor="end">window after 1.5 s</text>
  <text class="cell" x="26" y="87.5">Application.Shutdown(), check returns false</text>
  <text class="cell" x="572" y="87.5" text-anchor="end">1</text>
  <text class="cell" x="804" y="87.5" text-anchor="end">1 / 0</text>
  <text class="cell" x="1036" y="87.5" text-anchor="end">before the check completes</text>
  <text class="cell" x="1213" y="87.5" text-anchor="end">none</text>
  <text class="cell" x="1406" y="87.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="117.5">OnMainWindowClose, another main window closed, false</text>
  <text class="cell" x="572" y="117.5" text-anchor="end">1</text>
  <text class="cell" x="804" y="117.5" text-anchor="end">1 / 0</text>
  <text class="cell" x="1036" y="117.5" text-anchor="end">before the check completes</text>
  <text class="cell" x="1213" y="117.5" text-anchor="end">none</text>
  <text class="cell" x="1406" y="117.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="147.5">Owner window closed, false</text>
  <text class="cell" x="572" y="147.5" text-anchor="end">0</text>
  <text class="cell" x="804" y="147.5" text-anchor="end">0 / 0</text>
  <text class="cell" x="1036" y="147.5" text-anchor="end">raised (no check started)</text>
  <text class="cell" x="1213" y="147.5" text-anchor="end">none</text>
  <text class="cell" x="1406" y="147.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="177.5">exit button (ApplicationCommands.Close), false</text>
  <text class="cell" x="572" y="177.5" text-anchor="end">1</text>
  <text class="cell" x="804" y="177.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1036" y="177.5" text-anchor="end">not raised</text>
  <text class="cell" x="1213" y="177.5" text-anchor="end">none</text>
  <text class="cell" x="1406" y="177.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="207.5">exit button (ApplicationCommands.Close), true</text>
  <text class="cell" x="572" y="207.5" text-anchor="end">2</text>
  <text class="cell" x="804" y="207.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1036" y="207.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1213" y="207.5" text-anchor="end">none</text>
  <text class="cell" x="1406" y="207.5" text-anchor="end">closed, process ended</text>
