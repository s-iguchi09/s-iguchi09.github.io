<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 290" width="1660" height="290" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1660" height="290" />
  <text class="title" x="12" y="24">Closing again after the check</text>
  <rect class="head" x="12" y="38" width="1636" height="30" />
  <text class="cell" x="26" y="57.5">condition</text>
  <text class="cell" x="572" y="57.5" text-anchor="end">Closing raised</text>
  <text class="cell" x="804" y="57.5" text-anchor="end">checks started / completed</text>
  <text class="cell" x="1217" y="57.5" text-anchor="end">Closed raised</text>
  <text class="cell" x="1441" y="57.5" text-anchor="end">unhandled exception</text>
  <text class="cell" x="1634" y="57.5" text-anchor="end">window after 1.5 s</text>
  <text class="cell" x="26" y="87.5">Cancel first, then Close() (no flag)</text>
  <text class="cell" x="572" y="87.5" text-anchor="end">5 (keeps repeating)</text>
  <text class="cell" x="804" y="87.5" text-anchor="end">5 / 4</text>
  <text class="cell" x="1217" y="87.5" text-anchor="end">not raised</text>
  <text class="cell" x="1441" y="87.5" text-anchor="end">none</text>
  <text class="cell" x="1634" y="87.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="117.5">+ approved flag, Close() directly (300 ms)</text>
  <text class="cell" x="572" y="117.5" text-anchor="end">2</text>
  <text class="cell" x="804" y="117.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1217" y="117.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1441" y="117.5" text-anchor="end">none</text>
  <text class="cell" x="1634" y="117.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="147.5">+ approved flag, Close() directly (synchronous)</text>
  <text class="cell" x="572" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="804" y="147.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1217" y="147.5" text-anchor="end">not raised</text>
  <text class="cell" x="1441" y="147.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="1634" y="147.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="177.5">ClosingGuard: InvokeAsync(Close) (synchronous)</text>
  <text class="cell" x="572" y="177.5" text-anchor="end">2</text>
  <text class="cell" x="804" y="177.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1217" y="177.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1441" y="177.5" text-anchor="end">none</text>
  <text class="cell" x="1634" y="177.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="207.5">× twice, no in-progress check</text>
  <text class="cell" x="572" y="207.5" text-anchor="end">3</text>
  <text class="cell" x="804" y="207.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1217" y="207.5" text-anchor="end">after check 1 completes, before check 2 completes</text>
  <text class="cell" x="1441" y="207.5" text-anchor="end">none</text>
  <text class="cell" x="1634" y="207.5" text-anchor="end">closed</text>
  <text class="cell" x="26" y="237.5">× twice, ClosingGuard</text>
  <text class="cell" x="572" y="237.5" text-anchor="end">3</text>
  <text class="cell" x="804" y="237.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1217" y="237.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1441" y="237.5" text-anchor="end">none</text>
  <text class="cell" x="1634" y="237.5" text-anchor="end">closed</text>
  <text class="cell" x="26" y="267.5">ClosingGuard: check throws, × again</text>
  <text class="cell" x="572" y="267.5" text-anchor="end">3</text>
  <text class="cell" x="804" y="267.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1217" y="267.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1441" y="267.5" text-anchor="end">IOException</text>
  <text class="cell" x="1634" y="267.5" text-anchor="end">closed, process ended</text>
  <line class="line" x1="12" y1="38" x2="1648" y2="38" />
  <line class="line" x1="12" y1="68" x2="1648" y2="68" />
  <line class="line" x1="12" y1="98" x2="1648" y2="98" />
  <line class="line" x1="12" y1="128" x2="1648" y2="128" />
  <line class="line" x1="12" y1="158" x2="1648" y2="158" />
  <line class="line" x1="12" y1="188" x2="1648" y2="188" />
  <line class="line" x1="12" y1="218" x2="1648" y2="218" />
  <line class="line" x1="12" y1="248" x2="1648" y2="248" />
  <line class="line" x1="12" y1="278" x2="1648" y2="278" />
  <line class="line" x1="12" y1="38" x2="12" y2="278" />
  <line class="line" x1="409" y1="38" x2="409" y2="278" />
  <line class="line" x1="586" y1="38" x2="586" y2="278" />
  <line class="line" x1="818" y1="38" x2="818" y2="278" />
  <line class="line" x1="1231" y1="38" x2="1231" y2="278" />
  <line class="line" x1="1455" y1="38" x2="1455" y2="278" />
  <line class="line" x1="1648" y1="38" x2="1648" y2="278" />
</svg>
