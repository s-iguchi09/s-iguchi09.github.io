<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1982 470" width="1982" height="470" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1982" height="470" />
  <text class="title" x="12" y="24">Closing again after the check</text>
  <rect class="head" x="12" y="38" width="1958" height="30" />
  <text class="cell" x="26" y="57.5">condition</text>
  <text class="cell" x="894" y="57.5" text-anchor="end">Closing raised</text>
  <text class="cell" x="1126" y="57.5" text-anchor="end">checks started / completed</text>
  <text class="cell" x="1539" y="57.5" text-anchor="end">Closed raised</text>
  <text class="cell" x="1763" y="57.5" text-anchor="end">unhandled exception</text>
  <text class="cell" x="1956" y="57.5" text-anchor="end">window after 1.5 s</text>
  <text class="cell" x="26" y="87.5">Cancel first, then Close() (no flag)</text>
  <text class="cell" x="894" y="87.5" text-anchor="end">5 (keeps repeating)</text>
  <text class="cell" x="1126" y="87.5" text-anchor="end">5 / 4</text>
  <text class="cell" x="1539" y="87.5" text-anchor="end">not raised</text>
  <text class="cell" x="1763" y="87.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="87.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="117.5">+ approved flag, Close() directly (300 ms)</text>
  <text class="cell" x="894" y="117.5" text-anchor="end">2</text>
  <text class="cell" x="1126" y="117.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1539" y="117.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1763" y="117.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="117.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="147.5">+ approved flag, Close() directly (synchronous)</text>
  <text class="cell" x="894" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="1126" y="147.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1539" y="147.5" text-anchor="end">not raised</text>
  <text class="cell" x="1763" y="147.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="1956" y="147.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="177.5">ClosingGuard: InvokeAsync(Close) (synchronous)</text>
  <text class="cell" x="894" y="177.5" text-anchor="end">2</text>
  <text class="cell" x="1126" y="177.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1539" y="177.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1763" y="177.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="177.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="207.5">× twice, no in-progress check</text>
  <text class="cell" x="894" y="207.5" text-anchor="end">3</text>
  <text class="cell" x="1126" y="207.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1539" y="207.5" text-anchor="end">after check 1 completes, before check 2 completes</text>
  <text class="cell" x="1763" y="207.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="207.5" text-anchor="end">closed</text>
  <text class="cell" x="26" y="237.5">× twice, ClosingGuard</text>
  <text class="cell" x="894" y="237.5" text-anchor="end">3</text>
  <text class="cell" x="1126" y="237.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1539" y="237.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1763" y="237.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="237.5" text-anchor="end">closed</text>
  <text class="cell" x="26" y="267.5">ClosingGuard: check throws, × again</text>
  <text class="cell" x="894" y="267.5" text-anchor="end">3</text>
  <text class="cell" x="1126" y="267.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1539" y="267.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1763" y="267.5" text-anchor="end">IOException</text>
  <text class="cell" x="1956" y="267.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="297.5">ClosingGuard: DataContext replaced during the check (true)</text>
  <text class="cell" x="894" y="297.5" text-anchor="end">1</text>
  <text class="cell" x="1126" y="297.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1539" y="297.5" text-anchor="end">not raised</text>
  <text class="cell" x="1763" y="297.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="297.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="327.5">DataContext replaced during the check, no identity check (true)</text>
  <text class="cell" x="894" y="327.5" text-anchor="end">2</text>
  <text class="cell" x="1126" y="327.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1539" y="327.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1763" y="327.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="327.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="357.5">ClosingGuard: DataContext set to null during the check, × again (true)</text>
  <text class="cell" x="894" y="357.5" text-anchor="end">2</text>
  <text class="cell" x="1126" y="357.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1539" y="357.5" text-anchor="end">not raised</text>
  <text class="cell" x="1763" y="357.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="357.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="387.5">ClosingGuard: DataContext replaced and Close() called before closing again (synchronous)</text>
  <text class="cell" x="894" y="387.5" text-anchor="end">2</text>
  <text class="cell" x="1126" y="387.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1539" y="387.5" text-anchor="end">not raised</text>
  <text class="cell" x="1763" y="387.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="387.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="417.5">ClosingGuard: another handler cancels closing again, × again</text>
  <text class="cell" x="894" y="417.5" text-anchor="end">4</text>
  <text class="cell" x="1126" y="417.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1539" y="417.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1763" y="417.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="417.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="447.5">ClosingGuard: a later Closing handler runs a nested message loop, × again (synchronous)</text>
  <text class="cell" x="894" y="447.5" text-anchor="end">3</text>
  <text class="cell" x="1126" y="447.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1539" y="447.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1763" y="447.5" text-anchor="end">none</text>
  <text class="cell" x="1956" y="447.5" text-anchor="end">closed, process ended</text>
