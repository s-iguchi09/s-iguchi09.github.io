<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1786 350" width="1786" height="350" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1786" height="350" />
  <text class="title" x="12" y="24">Closing again after the check</text>
  <rect class="head" x="12" y="38" width="1762" height="30" />
  <text class="cell" x="26" y="57.5">condition</text>
  <text class="cell" x="698" y="57.5" text-anchor="end">Closing raised</text>
  <text class="cell" x="930" y="57.5" text-anchor="end">checks started / completed</text>
  <text class="cell" x="1342" y="57.5" text-anchor="end">Closed raised</text>
  <text class="cell" x="1567" y="57.5" text-anchor="end">unhandled exception</text>
  <text class="cell" x="1760" y="57.5" text-anchor="end">window after 1.5 s</text>
  <text class="cell" x="26" y="87.5">Cancel first, then Close() (no flag)</text>
  <text class="cell" x="698" y="87.5" text-anchor="end">5 (keeps repeating)</text>
  <text class="cell" x="930" y="87.5" text-anchor="end">5 / 4</text>
  <text class="cell" x="1342" y="87.5" text-anchor="end">not raised</text>
  <text class="cell" x="1567" y="87.5" text-anchor="end">none</text>
  <text class="cell" x="1760" y="87.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="117.5">+ approved flag, Close() directly (300 ms)</text>
  <text class="cell" x="698" y="117.5" text-anchor="end">2</text>
  <text class="cell" x="930" y="117.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1342" y="117.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1567" y="117.5" text-anchor="end">none</text>
  <text class="cell" x="1760" y="117.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="147.5">+ approved flag, Close() directly (synchronous)</text>
  <text class="cell" x="698" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="930" y="147.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1342" y="147.5" text-anchor="end">not raised</text>
  <text class="cell" x="1567" y="147.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="1760" y="147.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="177.5">ClosingGuard: InvokeAsync(Close) (synchronous)</text>
  <text class="cell" x="698" y="177.5" text-anchor="end">2</text>
  <text class="cell" x="930" y="177.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1342" y="177.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1567" y="177.5" text-anchor="end">none</text>
  <text class="cell" x="1760" y="177.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="207.5">× twice, no in-progress check</text>
  <text class="cell" x="698" y="207.5" text-anchor="end">3</text>
  <text class="cell" x="930" y="207.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1342" y="207.5" text-anchor="end">after check 1 completes, before check 2 completes</text>
  <text class="cell" x="1567" y="207.5" text-anchor="end">none</text>
  <text class="cell" x="1760" y="207.5" text-anchor="end">closed</text>
  <text class="cell" x="26" y="237.5">× twice, ClosingGuard</text>
  <text class="cell" x="698" y="237.5" text-anchor="end">3</text>
  <text class="cell" x="930" y="237.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1342" y="237.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1567" y="237.5" text-anchor="end">none</text>
  <text class="cell" x="1760" y="237.5" text-anchor="end">closed</text>
  <text class="cell" x="26" y="267.5">ClosingGuard: check throws, × again</text>
  <text class="cell" x="698" y="267.5" text-anchor="end">3</text>
  <text class="cell" x="930" y="267.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1342" y="267.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1567" y="267.5" text-anchor="end">IOException</text>
  <text class="cell" x="1760" y="267.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="297.5">ClosingGuard: DataContext replaced during the check (true)</text>
  <text class="cell" x="698" y="297.5" text-anchor="end">1</text>
  <text class="cell" x="930" y="297.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1342" y="297.5" text-anchor="end">not raised</text>
  <text class="cell" x="1567" y="297.5" text-anchor="end">none</text>
  <text class="cell" x="1760" y="297.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="327.5">DataContext replaced during the check, no identity check (true)</text>
  <text class="cell" x="698" y="327.5" text-anchor="end">2</text>
  <text class="cell" x="930" y="327.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1342" y="327.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1567" y="327.5" text-anchor="end">none</text>
  <text class="cell" x="1760" y="327.5" text-anchor="end">closed, process ended</text>
  <line class="line" x1="12" y1="38" x2="1774" y2="38" />
  <line class="line" x1="12" y1="68" x2="1774" y2="68" />
  <line class="line" x1="12" y1="98" x2="1774" y2="98" />
  <line class="line" x1="12" y1="128" x2="1774" y2="128" />
  <line class="line" x1="12" y1="158" x2="1774" y2="158" />
  <line class="line" x1="12" y1="188" x2="1774" y2="188" />
  <line class="line" x1="12" y1="218" x2="1774" y2="218" />
  <line class="line" x1="12" y1="248" x2="1774" y2="248" />
  <line class="line" x1="12" y1="278" x2="1774" y2="278" />
  <line class="line" x1="12" y1="308" x2="1774" y2="308" />
  <line class="line" x1="12" y1="338" x2="1774" y2="338" />
  <line class="line" x1="12" y1="38" x2="12" y2="338" />
  <line class="line" x1="535" y1="38" x2="535" y2="338" />
  <line class="line" x1="712" y1="38" x2="712" y2="338" />
  <line class="line" x1="944" y1="38" x2="944" y2="338" />
  <line class="line" x1="1356" y1="38" x2="1356" y2="338" />
  <line class="line" x1="1581" y1="38" x2="1581" y2="338" />
  <line class="line" x1="1774" y1="38" x2="1774" y2="338" />
</svg>
