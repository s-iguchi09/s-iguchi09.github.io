<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2068 650" width="2068" height="650" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="2068" height="650" />
  <text class="title" x="12" y="24">Closing again after the check</text>
  <rect class="head" x="12" y="38" width="2044" height="30" />
  <text class="cell" x="26" y="57.5">condition</text>
  <text class="cell" x="980" y="57.5" text-anchor="end">Closing raised</text>
  <text class="cell" x="1212" y="57.5" text-anchor="end">checks started / completed</text>
  <text class="cell" x="1625" y="57.5" text-anchor="end">Closed raised</text>
  <text class="cell" x="1849" y="57.5" text-anchor="end">unhandled exception</text>
  <text class="cell" x="2042" y="57.5" text-anchor="end">window after 1.5 s</text>
  <text class="cell" x="26" y="87.5">Cancel first, then Close() (no flag)</text>
  <text class="cell" x="980" y="87.5" text-anchor="end">5 (keeps repeating)</text>
  <text class="cell" x="1212" y="87.5" text-anchor="end">5 / 4</text>
  <text class="cell" x="1625" y="87.5" text-anchor="end">not raised</text>
  <text class="cell" x="1849" y="87.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="87.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="117.5">+ approved flag, Close() directly (300 ms)</text>
  <text class="cell" x="980" y="117.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="117.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="117.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="117.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="117.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="147.5">+ approved flag, Close() directly (synchronous)</text>
  <text class="cell" x="980" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="1212" y="147.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="147.5" text-anchor="end">not raised</text>
  <text class="cell" x="1849" y="147.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="2042" y="147.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="177.5">ClosingGuard: BeginInvoke(Close) (synchronous)</text>
  <text class="cell" x="980" y="177.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="177.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="177.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="177.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="177.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="207.5">× twice, no in-progress check</text>
  <text class="cell" x="980" y="207.5" text-anchor="end">3</text>
  <text class="cell" x="1212" y="207.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1625" y="207.5" text-anchor="end">after check 1 completes, before check 2 completes</text>
  <text class="cell" x="1849" y="207.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="207.5" text-anchor="end">closed</text>
  <text class="cell" x="26" y="237.5">× twice, ClosingGuard</text>
  <text class="cell" x="980" y="237.5" text-anchor="end">3</text>
  <text class="cell" x="1212" y="237.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="237.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="237.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="237.5" text-anchor="end">closed</text>
  <text class="cell" x="26" y="267.5">ClosingGuard: check throws, × again</text>
  <text class="cell" x="980" y="267.5" text-anchor="end">3</text>
  <text class="cell" x="1212" y="267.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1625" y="267.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="267.5" text-anchor="end">IOException</text>
  <text class="cell" x="2042" y="267.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="297.5">ClosingGuard: DataContext replaced during the check (true)</text>
  <text class="cell" x="980" y="297.5" text-anchor="end">1</text>
  <text class="cell" x="1212" y="297.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="297.5" text-anchor="end">not raised</text>
  <text class="cell" x="1849" y="297.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="297.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="327.5">DataContext replaced during the check, no identity check (true)</text>
  <text class="cell" x="980" y="327.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="327.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="327.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="327.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="327.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="357.5">ClosingGuard: DataContext set to null during the check, × again (true)</text>
  <text class="cell" x="980" y="357.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="357.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="357.5" text-anchor="end">not raised</text>
  <text class="cell" x="1849" y="357.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="357.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="387.5">ClosingGuard: DataContext replaced and Close() called before closing again (synchronous)</text>
  <text class="cell" x="980" y="387.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="387.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="387.5" text-anchor="end">not raised</text>
  <text class="cell" x="1849" y="387.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="387.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="417.5">ClosingGuard: another handler cancels closing again, × again</text>
  <text class="cell" x="980" y="417.5" text-anchor="end">4</text>
  <text class="cell" x="1212" y="417.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1625" y="417.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="417.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="417.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="447.5">ClosingGuard: a later Closing handler runs a nested message loop, × again (synchronous)</text>
  <text class="cell" x="980" y="447.5" text-anchor="end">3</text>
  <text class="cell" x="1212" y="447.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1625" y="447.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="447.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="447.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="477.5">ClosingGuard: nested loop (500 ms) longer than the check (300 ms), × again</text>
  <text class="cell" x="980" y="477.5" text-anchor="end">3</text>
  <text class="cell" x="1212" y="477.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1625" y="477.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="477.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="477.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="507.5">ClosingGuard: an earlier Closing handler replaces DataContext while closing again (new check false)</text>
  <text class="cell" x="980" y="507.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="507.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1625" y="507.5" text-anchor="end">not raised</text>
  <text class="cell" x="1849" y="507.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="507.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="537.5">ClosingGuard: a later Closing handler replaces DataContext while closing again (new check false)</text>
  <text class="cell" x="980" y="537.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="537.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1625" y="537.5" text-anchor="end">not raised</text>
  <text class="cell" x="1849" y="537.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="537.5" text-anchor="end">open</text>
  <text class="cell" x="26" y="567.5">same as above, without re-subscribing before closing again</text>
  <text class="cell" x="980" y="567.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="567.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="567.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="567.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="567.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="597.5">ClosingGuard: Close() before Show, closing again cancelled, then shown and × (true)</text>
  <text class="cell" x="980" y="597.5" text-anchor="end">4</text>
  <text class="cell" x="1212" y="597.5" text-anchor="end">2 / 2</text>
  <text class="cell" x="1625" y="597.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="597.5" text-anchor="end">none</text>
  <text class="cell" x="2042" y="597.5" text-anchor="end">closed, process ended</text>
  <text class="cell" x="26" y="627.5">ClosingGuard: a Closed handler registered before it throws when closing again</text>
  <text class="cell" x="980" y="627.5" text-anchor="end">2</text>
  <text class="cell" x="1212" y="627.5" text-anchor="end">1 / 1</text>
  <text class="cell" x="1625" y="627.5" text-anchor="end">after the check completes</text>
  <text class="cell" x="1849" y="627.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="2042" y="627.5" text-anchor="end">closed, process ended</text>
