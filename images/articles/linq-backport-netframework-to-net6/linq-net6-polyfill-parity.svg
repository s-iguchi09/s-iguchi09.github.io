<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 380" width="905" height="380" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="905" height="380" />
  <text class="title" x="12" y="24">polyfill on net48 vs built-in on net10.0 — same source, same driver</text>
  <rect class="head" x="12" y="38" width="881" height="30" />
  <text class="cell" x="26" y="57.5">expression</text>
  <text class="cell" x="525" y="57.5" text-anchor="end">net10.0 (built-in)</text>
  <text class="cell" x="820" y="57.5" text-anchor="end">net48 (polyfill)</text>
  <text class="cell" x="879" y="57.5" text-anchor="end"></text>
  <text class="cell" x="26" y="87.5">Numbers.Chunk(2)</text>
  <text class="cell" x="525" y="87.5" text-anchor="end">[[1, 2], [3, 4], [5]]</text>
  <text class="cell" x="820" y="87.5" text-anchor="end">[[1, 2], [3, 4], [5]]</text>
  <text class="cell" x="879" y="87.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="117.5">Numbers.Chunk(5)</text>
  <text class="cell" x="525" y="117.5" text-anchor="end">[[1, 2, 3, 4, 5]]</text>
  <text class="cell" x="820" y="117.5" text-anchor="end">[[1, 2, 3, 4, 5]]</text>
  <text class="cell" x="879" y="117.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="147.5">Numbers.Chunk(10)</text>
  <text class="cell" x="525" y="147.5" text-anchor="end">[[1, 2, 3, 4, 5]]</text>
  <text class="cell" x="820" y="147.5" text-anchor="end">[[1, 2, 3, 4, 5]]</text>
  <text class="cell" x="879" y="147.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="177.5">Numbers.Chunk(0)</text>
  <text class="cell" x="525" y="177.5" text-anchor="end">throws ArgumentOutOfRangeException</text>
  <text class="cell" x="820" y="177.5" text-anchor="end">throws ArgumentOutOfRangeException</text>
  <text class="cell" x="879" y="177.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="207.5">Items.MaxBy(Price)</text>
  <text class="cell" x="525" y="207.5" text-anchor="end">mug</text>
  <text class="cell" x="820" y="207.5" text-anchor="end">mug</text>
  <text class="cell" x="879" y="207.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="237.5">Items.MinBy(Price)</text>
  <text class="cell" x="525" y="237.5" text-anchor="end">pen</text>
  <text class="cell" x="820" y="237.5" text-anchor="end">pen</text>
  <text class="cell" x="879" y="237.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="267.5">empty int[].MaxBy</text>
  <text class="cell" x="525" y="267.5" text-anchor="end">throws InvalidOperationException</text>
  <text class="cell" x="820" y="267.5" text-anchor="end">throws InvalidOperationException</text>
  <text class="cell" x="879" y="267.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="297.5">empty Item[].MaxBy</text>
  <text class="cell" x="525" y="297.5" text-anchor="end">null</text>
  <text class="cell" x="820" y="297.5" text-anchor="end">null</text>
  <text class="cell" x="879" y="297.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="327.5">Items.DistinctBy(Category)</text>
  <text class="cell" x="525" y="327.5" text-anchor="end">[pen, mug]</text>
  <text class="cell" x="820" y="327.5" text-anchor="end">[pen, mug]</text>
  <text class="cell" x="879" y="327.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="357.5">Words.DistinctBy(Length)</text>
  <text class="cell" x="525" y="357.5" text-anchor="end">[pear, apple, fig]</text>
  <text class="cell" x="820" y="357.5" text-anchor="end">[pear, apple, fig]</text>
  <text class="cell" x="879" y="357.5" text-anchor="end">same</text>
  <line class="line" x1="12" y1="38" x2="893" y2="38" />
  <line class="line" x1="12" y1="68" x2="893" y2="68" />
  <line class="line" x1="12" y1="98" x2="893" y2="98" />
  <line class="line" x1="12" y1="128" x2="893" y2="128" />
  <line class="line" x1="12" y1="158" x2="893" y2="158" />
  <line class="line" x1="12" y1="188" x2="893" y2="188" />
  <line class="line" x1="12" y1="218" x2="893" y2="218" />
  <line class="line" x1="12" y1="248" x2="893" y2="248" />
  <line class="line" x1="12" y1="278" x2="893" y2="278" />
  <line class="line" x1="12" y1="308" x2="893" y2="308" />
  <line class="line" x1="12" y1="338" x2="893" y2="338" />
  <line class="line" x1="12" y1="368" x2="893" y2="368" />
  <line class="line" x1="12" y1="38" x2="12" y2="368" />
  <line class="line" x1="244" y1="38" x2="244" y2="368" />
  <line class="line" x1="539" y1="38" x2="539" y2="368" />
  <line class="line" x1="834" y1="38" x2="834" y2="368" />
  <line class="line" x1="893" y1="38" x2="893" y2="368" />
</svg>
