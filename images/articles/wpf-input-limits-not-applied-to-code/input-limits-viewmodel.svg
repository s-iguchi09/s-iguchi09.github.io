<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 230" width="1254" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1254" height="230" />
  <text class="title" x="12" y="24">checking in the view model: both paths</text>
  <rect class="head" x="12" y="38" width="1230" height="30" />
  <text class="cell" x="26" y="57.5">view model</text>
  <text class="cell" x="800" y="57.5" text-anchor="end">value from code</text>
  <text class="cell" x="1228" y="57.5" text-anchor="end">user input</text>
  <text class="cell" x="26" y="87.5">INotifyDataErrorInfo, at most 5</text>
  <text class="cell" x="800" y="87.5" text-anchor="end">"abcdefgh": HasErrors True, Validation.HasError True</text>
  <text class="cell" x="1228" y="87.5" text-anchor="end">typed "abcdefgh": "abcde", HasErrors False</text>
  <text class="cell" x="26" y="117.5">INotifyDataErrorInfo, loaded over the limit</text>
  <text class="cell" x="800" y="117.5" text-anchor="end">"abcdefgh" loaded: HasErrors True</text>
  <text class="cell" x="1228" y="117.5" text-anchor="end">x at the end: "abcdefgh"; Backspace: HasErrors True</text>
  <text class="cell" x="26" y="147.5">Save button, IsEnabled bound to !HasErrors</text>
  <text class="cell" x="800" y="147.5" text-anchor="end">"abcdefgh": False; "abcde": True</text>
  <text class="cell" x="1228" y="147.5" text-anchor="end">loaded: False; 3 Backspaces to "abcde": True</text>
  <text class="cell" x="26" y="177.5">setter clamps to 0-100</text>
  <text class="cell" x="800" y="177.5" text-anchor="end">150: source 100, Slider 100</text>
  <text class="cell" x="1228" y="177.5" text-anchor="end">End key: sent 200, source 100, Slider 100</text>
  <text class="cell" x="26" y="207.5">setter rounds to 10</text>
  <text class="cell" x="800" y="207.5" text-anchor="end">23.4: source 20, Slider 20</text>
  <text class="cell" x="1228" y="207.5" text-anchor="end">50, Right arrow: sent 55, source 60, Slider 60</text>
  <line class="line" x1="12" y1="38" x2="1242" y2="38" />
  <line class="line" x1="12" y1="68" x2="1242" y2="68" />
  <line class="line" x1="12" y1="98" x2="1242" y2="98" />
  <line class="line" x1="12" y1="128" x2="1242" y2="128" />
  <line class="line" x1="12" y1="158" x2="1242" y2="158" />
  <line class="line" x1="12" y1="188" x2="1242" y2="188" />
  <line class="line" x1="12" y1="218" x2="1242" y2="218" />
  <line class="line" x1="12" y1="38" x2="12" y2="218" />
  <line class="line" x1="378" y1="38" x2="378" y2="218" />
  <line class="line" x1="814" y1="38" x2="814" y2="218" />
  <line class="line" x1="1242" y1="38" x2="1242" y2="218" />
</svg>
