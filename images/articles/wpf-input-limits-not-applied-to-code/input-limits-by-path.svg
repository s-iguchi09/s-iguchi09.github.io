<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1266 320" width="1266" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1266" height="320" />
  <text class="title" x="12" y="24">input restrictions: which path they apply to</text>
  <rect class="head" x="12" y="38" width="1242" height="30" />
  <text class="cell" x="26" y="57.5">restriction</text>
  <text class="cell" x="745" y="57.5" text-anchor="end">user input</text>
  <text class="cell" x="1000" y="57.5" text-anchor="end">value from code</text>
  <text class="cell" x="1240" y="57.5" text-anchor="end">value from a binding</text>
  <text class="cell" x="26" y="87.5">TextBox MaxLength=5, "abcdefgh"</text>
  <text class="cell" x="745" y="87.5" text-anchor="end">"abcde"</text>
  <text class="cell" x="1000" y="87.5" text-anchor="end">"abcdefgh"</text>
  <text class="cell" x="1240" y="87.5" text-anchor="end">"abcdefgh"</text>
  <text class="cell" x="26" y="117.5">TextBox CharacterCasing=Upper, "hello"</text>
  <text class="cell" x="745" y="117.5" text-anchor="end">"HELLO"</text>
  <text class="cell" x="1000" y="117.5" text-anchor="end">"hello"</text>
  <text class="cell" x="1240" y="117.5" text-anchor="end">"hello"</text>
  <text class="cell" x="26" y="147.5">PasswordBox MaxLength=8, 10 letters</text>
  <text class="cell" x="745" y="147.5" text-anchor="end">8 characters</text>
  <text class="cell" x="1000" y="147.5" text-anchor="end">10 characters</text>
  <text class="cell" x="1240" y="147.5" text-anchor="end">no PasswordProperty to bind</text>
  <text class="cell" x="26" y="177.5">DatePicker 04-10 to 04-20, 04-05</text>
  <text class="cell" x="745" y="177.5" text-anchor="end">calendar: day disabled, typed: 2026-04-05</text>
  <text class="cell" x="1000" y="177.5" text-anchor="end">2026-04-05</text>
  <text class="cell" x="1240" y="177.5" text-anchor="end">2026-04-05</text>
  <text class="cell" x="26" y="207.5">DatePicker, DisplayDateStart afterwards</text>
  <text class="cell" x="745" y="207.5" text-anchor="end">after typing: 2026-04-05</text>
  <text class="cell" x="1000" y="207.5" text-anchor="end">2026-04-05, 04-07 day enabled</text>
  <text class="cell" x="1240" y="207.5" text-anchor="end">2026-04-05</text>
  <text class="cell" x="26" y="237.5">Slider snap to ticks of 10</text>
  <text class="cell" x="745" y="237.5" text-anchor="end">50, Right arrow: 60</text>
  <text class="cell" x="1000" y="237.5" text-anchor="end">23.4: 23.4</text>
  <text class="cell" x="1240" y="237.5" text-anchor="end">23.4: 23.4</text>
  <text class="cell" x="26" y="267.5">Slider Maximum=100</text>
  <text class="cell" x="745" y="267.5" text-anchor="end">End key: 100</text>
  <text class="cell" x="1000" y="267.5" text-anchor="end">150: 100, Maximum 200: 150</text>
  <text class="cell" x="1240" y="267.5" text-anchor="end">150: Slider 100, source 150</text>
  <text class="cell" x="26" y="297.5">2nd TabItem IsEnabled=False</text>
  <text class="cell" x="745" y="297.5" text-anchor="end">UIA Select(): ElementNotEnabledException, index 0</text>
  <text class="cell" x="1000" y="297.5" text-anchor="end">index 1, "Page 2"</text>
  <text class="cell" x="1240" y="297.5" text-anchor="end">index 1, "Page 2"</text>
  <line class="line" x1="12" y1="38" x2="1254" y2="38" />
  <line class="line" x1="12" y1="68" x2="1254" y2="68" />
  <line class="line" x1="12" y1="98" x2="1254" y2="98" />
  <line class="line" x1="12" y1="128" x2="1254" y2="128" />
