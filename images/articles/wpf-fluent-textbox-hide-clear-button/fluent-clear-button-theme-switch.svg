<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" width="850" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="850" height="170" />
  <text class="title" x="12" y="24">approach 1 (local Collapsed on the part) across a ThemeMode switch</text>
