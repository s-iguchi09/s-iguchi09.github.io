<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1022 170" width="1022" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1022" height="170" />
  <text class="title" x="12" y="24">confirming without moving focus, and the thread that raises ErrorsChanged</text>
  <rect class="head" x="12" y="38" width="998" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="996" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">default binding, type "sato", then Enter on an IsDefault button</text>
  <text class="cell" x="996" y="87.5" text-anchor="end">in Click: UserName = suzuki, TextBox focused True</text>
  <text class="cell" x="26" y="117.5">ErrorsChanged raised on the UI thread</text>
  <text class="cell" x="996" y="117.5" text-anchor="end">Validation.HasError True (raised on thread UI)</text>
  <text class="cell" x="26" y="147.5">ErrorsChanged raised on a background thread</text>
  <text class="cell" x="996" y="147.5" text-anchor="end">Validation.HasError True (raised on thread other than UI)</text>
  <line class="line" x1="12" y1="38" x2="1010" y2="38" />
  <line class="line" x1="12" y1="68" x2="1010" y2="68" />
  <line class="line" x1="12" y1="98" x2="1010" y2="98" />
  <line class="line" x1="12" y1="128" x2="1010" y2="128" />
  <line class="line" x1="12" y1="158" x2="1010" y2="158" />
  <line class="line" x1="12" y1="38" x2="12" y2="158" />
  <line class="line" x1="535" y1="38" x2="535" y2="158" />
  <line class="line" x1="1010" y1="38" x2="1010" y2="158" />
</svg>
