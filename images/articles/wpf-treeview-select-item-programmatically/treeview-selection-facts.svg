  </defs>
  <rect class="bg" x="0" y="0" width="767" height="260" />
  <text class="title" x="12" y="24">TreeView selection and container generation</text>
  <rect class="head" x="12" y="38" width="743" height="30" />
  <text class="cell" x="26" y="57.5">what was measured</text>
  <text class="cell" x="706" y="57.5" text-anchor="end">result</text>
  <text class="cell" x="741" y="57.5" text-anchor="end"></text>
  <text class="cell" x="26" y="87.5">TreeView.SelectedItemProperty.ReadOnly</text>
  <text class="cell" x="706" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="741" y="87.5" text-anchor="end">-</text>
  <text class="cell" x="26" y="117.5">SetValue(SelectedItemProperty) from outside</text>
  <text class="cell" x="706" y="117.5" text-anchor="end">throws InvalidOperationException</text>
  <text class="cell" x="741" y="117.5" text-anchor="end">-</text>
  <text class="cell" x="26" y="147.5">child container before expanding</text>
  <text class="cell" x="706" y="147.5" text-anchor="end">null</text>
  <text class="cell" x="741" y="147.5" text-anchor="end">-</text>
