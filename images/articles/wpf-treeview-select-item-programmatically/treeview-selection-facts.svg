  <text class="cell" x="706" y="177.5" text-anchor="end">null</text>
  <text class="cell" x="741" y="177.5" text-anchor="end">-</text>
  <text class="cell" x="26" y="207.5">after IsExpanded = true and UpdateLayout()</text>
  <text class="cell" x="706" y="207.5" text-anchor="end">TreeViewItem</text>
  <text class="cell" x="741" y="207.5" text-anchor="end">-</text>
