<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1053 320" width="1053" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1053" height="320" />
  <text class="title" x="12" y="24">the article's XAML: exclusivity, value source, and selection color</text>
  <rect class="head" x="12" y="38" width="1029" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1027" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">select 'Program Files', then 'Users' (both generated)</text>
  <text class="cell" x="1027" y="87.5" text-anchor="end">ViewModel: Program Files False, Users True</text>
  <text class="cell" x="26" y="117.5">select 'C:', then 'drivers' (no container yet)</text>
  <text class="cell" x="1027" y="117.5" text-anchor="end">ViewModel: C: True, drivers True; SelectedItem C:</text>
  <text class="cell" x="26" y="147.5">TwoWay: assign container.IsSelected, then ViewModel false</text>
  <text class="cell" x="1027" y="147.5" text-anchor="end">source Style; container.IsSelected False</text>
  <text class="cell" x="26" y="177.5">OneWay: assign container.IsSelected, then ViewModel false</text>
  <text class="cell" x="1027" y="177.5" text-anchor="end">source Local; container.IsSelected True</text>
  <text class="cell" x="26" y="207.5">selected background, item focused</text>
  <text class="cell" x="1027" y="207.5" text-anchor="end">#FF0078D7 = SystemColors.HighlightColor</text>
  <text class="cell" x="26" y="237.5">selected background, focus elsewhere</text>
  <text class="cell" x="1027" y="237.5" text-anchor="end">#FFF0F0F0 = SystemColors.InactiveSelectionHighlightBrush</text>
  <text class="cell" x="26" y="267.5">last of 200 nodes: IsSelected, then BringIntoView</text>
  <text class="cell" x="1027" y="267.5" text-anchor="end">selected Folder 200, offset 0 -&gt; 3051.05</text>
  <text class="cell" x="26" y="297.5">IsVirtualizing: last of 200 selected in ViewModel</text>
  <text class="cell" x="1027" y="297.5" text-anchor="end">SelectedItem: no container, null -&gt; scrolled: container, Folder 200</text>
