<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img">
  <defs>
    <style>
      .card { fill: #ffffff; stroke: #e1e7f0; stroke-width: 1; }
      .axis { stroke: #c3ccdb; stroke-width: 2; }
      .tick { stroke: #c3ccdb; stroke-width: 1.5; }
      .ver { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; fill: #2563eb; }
      .chip-lang { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.2; }
      .chip-bcl { fill: #fdf7ee; stroke: #e2c79a; stroke-width: 1.2; }
      .op { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #1f2933; }
      .legend { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>

  <rect class="card" x="8" y="8" width="884" height="284" rx="10" />

  <!-- 軸 -->
  <line class="axis" x1="46" y1="214" x2="856" y2="214" />

  <!-- 目盛りとバージョン -->
  <g>
    <line class="tick" x1="78" y1="206" x2="78" y2="222" />
    <text class="ver" x="78" y="242" text-anchor="middle">1.0</text>
    <line class="tick" x1="176" y1="206" x2="176" y2="222" />
    <text class="ver" x="176" y="242" text-anchor="middle">2.0</text>
    <line class="tick" x1="274" y1="206" x2="274" y2="222" />
    <text class="ver" x="274" y="242" text-anchor="middle">3.0</text>
    <line class="tick" x1="372" y1="206" x2="372" y2="222" />
    <text class="ver" x="372" y="242" text-anchor="middle">6.0</text>
    <line class="tick" x1="470" y1="206" x2="470" y2="222" />
    <text class="ver" x="470" y="242" text-anchor="middle">7.0</text>
    <line class="tick" x1="568" y1="206" x2="568" y2="222" />
    <text class="ver" x="568" y="242" text-anchor="middle">8.0</text>
    <line class="tick" x1="666" y1="206" x2="666" y2="222" />
    <text class="ver" x="666" y="242" text-anchor="middle">9.0</text>
    <line class="tick" x1="764" y1="206" x2="764" y2="222" />
    <text class="ver" x="764" y="242" text-anchor="middle">11.0</text>
    <line class="tick" x1="836" y1="206" x2="836" y2="222" />
    <text class="ver" x="836" y="242" text-anchor="middle">12.0</text>
  </g>
  <text class="legend" x="46" y="262">C#</text>

  <!-- C# 1.0 -->
  <rect class="chip-lang" x="42" y="170" width="72" height="24" rx="4" />
  <text class="op" x="78" y="187" text-anchor="middle">as / is</text>

  <!-- C# 2.0 -->
  <rect class="chip-lang" x="146" y="170" width="60" height="24" rx="4" />
  <text class="op" x="176" y="187" text-anchor="middle">??</text>

  <!-- C# 3.0 -->
  <rect class="chip-lang" x="238" y="170" width="72" height="24" rx="4" />
  <text class="op" x="274" y="187" text-anchor="middle">=&gt; lambda</text>

  <!-- C# 6.0 -->
  <rect class="chip-lang" x="330" y="170" width="84" height="24" rx="4" />
  <text class="op" x="372" y="187" text-anchor="middle">?. ?[]</text>
  <rect class="chip-lang" x="330" y="140" width="84" height="24" rx="4" />
  <text class="op" x="372" y="157" text-anchor="middle">nameof</text>
  <rect class="chip-lang" x="330" y="110" width="84" height="24" rx="4" />
  <text class="op" x="372" y="127" text-anchor="middle">=&gt; member</text>

  <!-- C# 7.0 -->
  <rect class="chip-lang" x="424" y="170" width="92" height="24" rx="4" />
  <text class="op" x="470" y="187" text-anchor="middle">is pattern</text>

  <!-- C# 8.0 -->
  <rect class="chip-lang" x="530" y="170" width="76" height="24" rx="4" />
  <text class="op" x="568" y="187" text-anchor="middle">??=</text>
  <rect class="chip-lang" x="530" y="140" width="76" height="24" rx="4" />
  <text class="op" x="568" y="157" text-anchor="middle">!</text>
  <rect class="chip-bcl" x="530" y="110" width="76" height="24" rx="4" />
  <text class="op" x="568" y="127" text-anchor="middle">^  ..</text>

  <!-- C# 9.0 -->
  <rect class="chip-lang" x="622" y="170" width="88" height="24" rx="4" />
  <text class="op" x="666" y="187" text-anchor="middle">with</text>
  <rect class="chip-lang" x="622" y="140" width="88" height="24" rx="4" />
  <text class="op" x="666" y="157" text-anchor="middle">new()</text>

  <!-- C# 11.0 -->
  <rect class="chip-bcl" x="722" y="170" width="84" height="24" rx="4" />
  <text class="op" x="764" y="187" text-anchor="middle">required</text>

  <!-- C# 12.0 -->
  <rect class="chip-lang" x="800" y="170" width="72" height="24" rx="4" />
  <text class="op" x="836" y="187" text-anchor="middle">[ ... ]</text>
  <rect class="chip-lang" x="800" y="140" width="72" height="24" rx="4" />
  <text class="op" x="836" y="157" text-anchor="middle">C(int x)</text>

  <!-- 凡例 -->
  <rect class="chip-lang" x="46" y="34" width="18" height="16" rx="3" />
  <text class="legend" x="72" y="47">LangVersion only</text>
  <rect class="chip-bcl" x="212" y="34" width="18" height="16" rx="3" />
  <text class="legend" x="238" y="47">needs BCL type / attribute</text>
</svg>
