<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 697 140" width="697" height="140" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="697" height="140" />
  <text class="title" x="12" y="24">does the color follow when the system brush is replaced</text>
  <rect class="head" x="12" y="38" width="673" height="30" />
  <text class="cell" x="26" y="57.5">how the color is referenced</text>
  <text class="cell" x="478" y="57.5" text-anchor="end">before</text>
  <text class="cell" x="671" y="57.5" text-anchor="end">after the replacement</text>
  <text class="cell" x="26" y="87.5">new SolidColorBrush(SystemColors.WindowColor)</text>
  <text class="cell" x="478" y="87.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="671" y="87.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="26" y="117.5">DynamicResource SystemColors.WindowBrushKey</text>
  <text class="cell" x="478" y="117.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="671" y="117.5" text-anchor="end">#FF102030</text>
  <line class="line" x1="12" y1="38" x2="685" y2="38" />
  <line class="line" x1="12" y1="68" x2="685" y2="68" />
  <line class="line" x1="12" y1="98" x2="685" y2="98" />
  <line class="line" x1="12" y1="128" x2="685" y2="128" />
  <line class="line" x1="12" y1="38" x2="12" y2="128" />
  <line class="line" x1="393" y1="38" x2="393" y2="128" />
  <line class="line" x1="492" y1="38" x2="492" y2="128" />
  <line class="line" x1="685" y1="38" x2="685" y2="128" />
</svg>
