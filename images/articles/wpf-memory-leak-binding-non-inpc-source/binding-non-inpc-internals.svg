<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3565 350" width="3565" height="350" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="3565" height="350" />
  <text class="title" x="12" y="24">Internal field types and defaults (.NET 10.0.13)</text>
  <rect class="head" x="12" y="38" width="3541" height="30" />
  <text class="cell" x="26" y="57.5">Item</text>
  <text class="cell" x="3539" y="57.5" text-anchor="end">Value</text>
  <text class="cell" x="26" y="87.5">Declared type of PropertyDescriptor._valueChangedHandlers</text>
  <text class="cell" x="3539" y="87.5" text-anchor="end">System.Collections.Concurrent.ConcurrentDictionary&lt;System.Object, System.EventHandler&gt;</text>
  <text class="cell" x="26" y="117.5">Actual type of _valueChangedHandlers while registered</text>
  <text class="cell" x="3539" y="117.5" text-anchor="end">System.Collections.Concurrent.ConcurrentDictionary&lt;System.Object, System.EventHandler&gt;</text>
  <text class="cell" x="26" y="147.5">Declared type of ValueChangedRecord._source</text>
  <text class="cell" x="3539" y="147.5" text-anchor="end">System.Object</text>
  <text class="cell" x="26" y="177.5">Concrete type of the PropertyDescriptor for TimelineViewModel.Title</text>
  <text class="cell" x="3539" y="177.5" text-anchor="end">System.ComponentModel.ReflectPropertyDescriptor</text>
  <text class="cell" x="26" y="207.5">Same PropertyDescriptor returned after keeping only a weak reference and running the GC (registration still present)</text>
  <text class="cell" x="3539" y="207.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="237.5">Same as above for UnboundViewModel.Title, which was never bound</text>
  <text class="cell" x="3539" y="237.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="267.5">Instance fields of ValueChangedRecord</text>
  <text class="cell" x="3539" y="267.5" text-anchor="end">&lt;HasIgnorableListeners&gt;k__BackingField: System.Boolean, _eventArgs: MS.Internal.Data.ValueChangedEventArgs, _listeners: System.Windows.WeakEventManager+ListenerList&lt;MS.Internal.Data.ValueChangedEventArgs&gt;, _manager: MS.Internal.Data.ValueChangedEventManager, _pd: System.ComponentModel.PropertyDescriptor, _source: System.Object</text>
  <text class="cell" x="26" y="297.5">OtherViewModel.Name and TimelineViewModel.Title share one PropertyDescriptor</text>
  <text class="cell" x="3539" y="297.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="327.5">TextBox.Text BindsTwoWayByDefault</text>
  <text class="cell" x="3539" y="327.5" text-anchor="end">True</text>
