<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1438 290" width="1438" height="290" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1438" height="290" />
  <text class="title" x="12" y="24">Internal field types and defaults (.NET 10.0.13)</text>
  <rect class="head" x="12" y="38" width="1414" height="30" />
  <text class="cell" x="26" y="57.5">Item</text>
  <text class="cell" x="1412" y="57.5" text-anchor="end">Value</text>
  <text class="cell" x="26" y="87.5">Declared type of PropertyDescriptor._valueChangedHandlers</text>
  <text class="cell" x="1412" y="87.5" text-anchor="end">System.Collections.Concurrent.ConcurrentDictionary&lt;System.Object, System.EventHandler&gt;</text>
  <text class="cell" x="26" y="117.5">Actual type of _valueChangedHandlers while registered</text>
  <text class="cell" x="1412" y="117.5" text-anchor="end">System.Collections.Concurrent.ConcurrentDictionary&lt;System.Object, System.EventHandler&gt;</text>
  <text class="cell" x="26" y="147.5">Declared type of ValueChangedRecord._source</text>
  <text class="cell" x="1412" y="147.5" text-anchor="end">System.Object</text>
  <text class="cell" x="26" y="177.5">Concrete type of the PropertyDescriptor for TimelineViewModel.Title</text>
  <text class="cell" x="1412" y="177.5" text-anchor="end">System.ComponentModel.ReflectPropertyDescriptor</text>
  <text class="cell" x="26" y="207.5">Same PropertyDescriptor returned after keeping only a weak reference and running the GC</text>
  <text class="cell" x="1412" y="207.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="237.5">OtherViewModel.Name and TimelineViewModel.Title share one PropertyDescriptor</text>
  <text class="cell" x="1412" y="237.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="267.5">TextBox.Text BindsTwoWayByDefault</text>
  <text class="cell" x="1412" y="267.5" text-anchor="end">True</text>
