  <text class="cell" x="2632" y="297.5" text-anchor="end">0</text>
  <text class="cell" x="2840" y="297.5" text-anchor="end">0</text>
  <text class="cell" x="26" y="327.5">No INPC, one long-lived source shared by all windows</text>
