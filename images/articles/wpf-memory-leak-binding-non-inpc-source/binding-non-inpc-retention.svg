  <text class="cell" x="1488" y="237.5" text-anchor="end">11</text>
  <text class="cell" x="1595" y="237.5" text-anchor="end">7</text>
  <text class="cell" x="1890" y="237.5" text-anchor="end">0</text>
  <text class="cell" x="2098" y="237.5" text-anchor="end">0</text>
