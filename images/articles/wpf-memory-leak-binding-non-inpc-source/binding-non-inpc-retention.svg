  <text class="cell" x="847" y="297.5" text-anchor="end">{Binding Rows.Count}</text>
  <text class="cell" x="1181" y="297.5" text-anchor="end">No</text>
  <text class="cell" x="1382" y="297.5" text-anchor="end">0</text>
  <text class="cell" x="1488" y="297.5" text-anchor="end">0</text>
  <text class="cell" x="1595" y="297.5" text-anchor="end">0</text>
  <text class="cell" x="1890" y="297.5" text-anchor="end">0</text>
  <text class="cell" x="2098" y="297.5" text-anchor="end">0</text>
  <text class="cell" x="26" y="327.5">No INPC, one long-lived source shared by all windows</text>
  <text class="cell" x="847" y="327.5" text-anchor="end">{Binding Title}</text>
  <text class="cell" x="1181" y="327.5" text-anchor="end">Yes</text>
  <text class="cell" x="1382" y="327.5" text-anchor="end">- (shared)</text>
