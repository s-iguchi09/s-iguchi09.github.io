  <text class="cell" x="1890" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="2098" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="26" y="117.5">No INPC, settable property, TextBox (TwoWay by default)</text>
  <text class="cell" x="847" y="117.5" text-anchor="end">{Binding Title}</text>
  <text class="cell" x="1181" y="117.5" text-anchor="end">Yes</text>
  <text class="cell" x="1382" y="117.5" text-anchor="end">10</text>
