  <text class="cell" x="1595" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="1890" y="147.5" text-anchor="end">0</text>
  <text class="cell" x="2098" y="147.5" text-anchor="end">0</text>
  <text class="cell" x="26" y="177.5">No INPC, Mode=OneTime</text>
  <text class="cell" x="847" y="177.5" text-anchor="end">{Binding Title, Mode=OneTime}</text>
  <text class="cell" x="1181" y="177.5" text-anchor="end">No</text>
  <text class="cell" x="1382" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="1488" y="177.5" text-anchor="end">0</text>
