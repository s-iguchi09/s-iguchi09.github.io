<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2124 350" width="2124" height="350" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="2124" height="350" />
  <text class="title" x="12" y="24">Objects still alive after opening and closing a window 100 times (.NET 10.0.13)</text>
  <rect class="head" x="12" y="38" width="2100" height="30" />
  <text class="cell" x="26" y="57.5">Source and target element</text>
  <text class="cell" x="847" y="57.5" text-anchor="end">Binding</text>
  <text class="cell" x="1181" y="57.5" text-anchor="end">Key in _valueChangedHandlers while open</text>
  <text class="cell" x="1382" y="57.5" text-anchor="end">Sources alive after 10</text>
  <text class="cell" x="1488" y="57.5" text-anchor="end">after 50</text>
  <text class="cell" x="1595" y="57.5" text-anchor="end">after 100</text>
  <text class="cell" x="1890" y="57.5" text-anchor="end">BindingExpressions alive after 100</text>
  <text class="cell" x="2098" y="57.5" text-anchor="end">Windows alive after 100</text>
  <text class="cell" x="26" y="87.5">No INPC, settable property, TextBlock</text>
  <text class="cell" x="847" y="87.5" text-anchor="end">{Binding Title}</text>
  <text class="cell" x="1181" y="87.5" text-anchor="end">Yes</text>
  <text class="cell" x="1382" y="87.5" text-anchor="end">7</text>
  <text class="cell" x="1488" y="87.5" text-anchor="end">9</text>
