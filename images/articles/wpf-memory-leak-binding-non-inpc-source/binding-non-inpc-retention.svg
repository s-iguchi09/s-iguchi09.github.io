  <rect class="bg" x="0" y="0" width="2866" height="350" />
  <text class="title" x="12" y="24">Objects still alive after opening and closing a window 100 times (.NET 10.0.13)</text>
  <rect class="head" x="12" y="38" width="2842" height="30" />
  <text class="cell" x="26" y="57.5">Source and target element</text>
  <text class="cell" x="847" y="57.5" text-anchor="end">Binding</text>
  <text class="cell" x="1377" y="57.5" text-anchor="end">Rounds in which it was a key in _valueChangedHandlers while open</text>
  <text class="cell" x="1923" y="57.5" text-anchor="end">Windows opened before the previous BindingExpression was collected</text>
  <text class="cell" x="2124" y="57.5" text-anchor="end">Sources alive after 10</text>
  <text class="cell" x="2231" y="57.5" text-anchor="end">after 50</text>
  <text class="cell" x="2337" y="57.5" text-anchor="end">after 100</text>
  <text class="cell" x="2632" y="57.5" text-anchor="end">BindingExpressions alive after 100</text>
  <text class="cell" x="2840" y="57.5" text-anchor="end">Windows alive after 100</text>
  <text class="cell" x="26" y="87.5">No INPC, settable property, TextBlock</text>
  <text class="cell" x="847" y="87.5" text-anchor="end">{Binding Title}</text>
  <text class="cell" x="1377" y="87.5" text-anchor="end">100 / 100</text>
  <text class="cell" x="1923" y="87.5" text-anchor="end">97 / 99</text>
