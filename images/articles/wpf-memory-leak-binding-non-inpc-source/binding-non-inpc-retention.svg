  <text class="cell" x="1890" y="117.5" text-anchor="end">0</text>
  <text class="cell" x="2098" y="117.5" text-anchor="end">0</text>
  <text class="cell" x="26" y="147.5">No INPC, get-only property</text>
  <text class="cell" x="847" y="147.5" text-anchor="end">{Binding Title}</text>
  <text class="cell" x="1181" y="147.5" text-anchor="end">Yes</text>
