  <text class="cell" x="2337" y="87.5" text-anchor="end">3</text>
  <text class="cell" x="2632" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="2840" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="26" y="117.5">No INPC, settable property, TextBox (TwoWay by default)</text>
