  <text class="cell" x="847" y="207.5" text-anchor="end">{Binding Title}</text>
  <text class="cell" x="1181" y="207.5" text-anchor="end">No</text>
  <text class="cell" x="1382" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="1488" y="207.5" text-anchor="end">0</text>
