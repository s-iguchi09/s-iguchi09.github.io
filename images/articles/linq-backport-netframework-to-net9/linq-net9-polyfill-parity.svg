<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 320" width="1062" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1062" height="320" />
  <text class="title" x="12" y="24">polyfill on net48 vs built-in on net10.0 — same source, same driver</text>
  <rect class="head" x="12" y="38" width="1038" height="30" />
  <text class="cell" x="26" y="57.5">expression</text>
  <text class="cell" x="611" y="57.5" text-anchor="end">net10.0 (built-in)</text>
  <text class="cell" x="977" y="57.5" text-anchor="end">net48 (polyfill)</text>
  <text class="cell" x="1036" y="57.5" text-anchor="end"></text>
  <text class="cell" x="26" y="87.5">CountBy(w =&gt; w)</text>
  <text class="cell" x="611" y="87.5" text-anchor="end">[[pear, 2], [fig, 1], [PEAR, 1]]</text>
  <text class="cell" x="977" y="87.5" text-anchor="end">[[pear, 2], [fig, 1], [PEAR, 1]]</text>
  <text class="cell" x="1036" y="87.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="117.5">CountBy(w =&gt; w.Length)</text>
  <text class="cell" x="611" y="117.5" text-anchor="end">[[4, 3], [3, 1]]</text>
  <text class="cell" x="977" y="117.5" text-anchor="end">[[4, 3], [3, 1]]</text>
  <text class="cell" x="1036" y="117.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="147.5">CountBy(w =&gt; w, ignore case)</text>
  <text class="cell" x="611" y="147.5" text-anchor="end">[[pear, 3], [fig, 1]]</text>
  <text class="cell" x="977" y="147.5" text-anchor="end">[[pear, 3], [fig, 1]]</text>
  <text class="cell" x="1036" y="147.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="177.5">AggregateBy(len, 0, +1)</text>
  <text class="cell" x="611" y="177.5" text-anchor="end">[[4, 3], [3, 1]]</text>
  <text class="cell" x="977" y="177.5" text-anchor="end">[[4, 3], [3, 1]]</text>
  <text class="cell" x="1036" y="177.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="207.5">AggregateBy(w, "", concat)</text>
  <text class="cell" x="611" y="207.5" text-anchor="end">[[4, ppP], [3, f]]</text>
  <text class="cell" x="977" y="207.5" text-anchor="end">[[4, ppP], [3, f]]</text>
  <text class="cell" x="1036" y="207.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="237.5">Index()</text>
  <text class="cell" x="611" y="237.5" text-anchor="end">[(0, pear), (1, fig), (2, pear), (3, PEAR)]</text>
  <text class="cell" x="977" y="237.5" text-anchor="end">[(0, pear), (1, fig), (2, pear), (3, PEAR)]</text>
  <text class="cell" x="1036" y="237.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="267.5">empty.Index()</text>
  <text class="cell" x="611" y="267.5" text-anchor="end">[]</text>
  <text class="cell" x="977" y="267.5" text-anchor="end">[]</text>
  <text class="cell" x="1036" y="267.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="297.5">empty.CountBy()</text>
  <text class="cell" x="611" y="297.5" text-anchor="end">[]</text>
  <text class="cell" x="977" y="297.5" text-anchor="end">[]</text>
  <text class="cell" x="1036" y="297.5" text-anchor="end">same</text>
  <line class="line" x1="12" y1="38" x2="1050" y2="38" />
  <line class="line" x1="12" y1="68" x2="1050" y2="68" />
  <line class="line" x1="12" y1="98" x2="1050" y2="98" />
  <line class="line" x1="12" y1="128" x2="1050" y2="128" />
  <line class="line" x1="12" y1="158" x2="1050" y2="158" />
  <line class="line" x1="12" y1="188" x2="1050" y2="188" />
  <line class="line" x1="12" y1="218" x2="1050" y2="218" />
  <line class="line" x1="12" y1="248" x2="1050" y2="248" />
  <line class="line" x1="12" y1="278" x2="1050" y2="278" />
  <line class="line" x1="12" y1="308" x2="1050" y2="308" />
  <line class="line" x1="12" y1="38" x2="12" y2="308" />
  <line class="line" x1="260" y1="38" x2="260" y2="308" />
  <line class="line" x1="625" y1="38" x2="625" y2="308" />
  <line class="line" x1="991" y1="38" x2="991" y2="308" />
  <line class="line" x1="1050" y1="38" x2="1050" y2="308" />
</svg>
