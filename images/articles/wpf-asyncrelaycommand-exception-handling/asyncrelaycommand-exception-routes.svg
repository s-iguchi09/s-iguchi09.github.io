<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2870 230" width="2870" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="2870" height="230" />
  <text class="title" x="12" y="24">Where an exception thrown by the import command goes (DispatcherUnhandledException is marked Handled)</text>
  <rect class="head" x="12" y="38" width="2846" height="30" />
  <text class="cell" x="26" y="57.5">how the command is written</text>
  <text class="cell" x="972" y="57.5" text-anchor="end">DispatcherUnhandledException (calls)</text>
  <text class="cell" x="1307" y="57.5" text-anchor="end">UnobservedTaskException, 1 s without GC</text>
  <text class="cell" x="1586" y="57.5" text-anchor="end">UnobservedTaskException after GC</text>
  <text class="cell" x="1991" y="57.5" text-anchor="end">UnobservedTaskException after a 2nd click and GC</text>
  <text class="cell" x="2286" y="57.5" text-anchor="end">ImportCommand.ExecutionTask.Status</text>
  <text class="cell" x="2549" y="57.5" text-anchor="end">message on screen</text>
  <text class="cell" x="2844" y="57.5" text-anchor="end">button IsEnabled after the failure</text>
  <text class="cell" x="26" y="87.5">Toolkit [RelayCommand] on async Task (default)</text>
  <text class="cell" x="972" y="87.5" text-anchor="end">1</text>
  <text class="cell" x="1307" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="1586" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="1991" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="2286" y="87.5" text-anchor="end">Faulted</text>
  <text class="cell" x="2549" y="87.5" text-anchor="end">(none)</text>
  <text class="cell" x="2844" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="117.5">Toolkit [RelayCommand(FlowExceptionsToTaskScheduler = true)]</text>
  <text class="cell" x="972" y="117.5" text-anchor="end">0</text>
  <text class="cell" x="1307" y="117.5" text-anchor="end">0</text>
  <text class="cell" x="1586" y="117.5" text-anchor="end">0</text>
  <text class="cell" x="1991" y="117.5" text-anchor="end">1</text>
  <text class="cell" x="2286" y="117.5" text-anchor="end">Faulted</text>
  <text class="cell" x="2549" y="117.5" text-anchor="end">(none)</text>
  <text class="cell" x="2844" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="147.5">Prism DelegateCommand with an async lambda</text>
  <text class="cell" x="972" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="1307" y="147.5" text-anchor="end">0</text>
  <text class="cell" x="1586" y="147.5" text-anchor="end">0</text>
  <text class="cell" x="1991" y="147.5" text-anchor="end">0</text>
  <text class="cell" x="2286" y="147.5" text-anchor="end">- (no such property)</text>
  <text class="cell" x="2549" y="147.5" text-anchor="end">(none)</text>
  <text class="cell" x="2844" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="177.5">Toolkit default, try / catch around the await in ImportAsync</text>
  <text class="cell" x="972" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="1307" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="1586" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="1991" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="2286" y="177.5" text-anchor="end">RanToCompletion</text>
  <text class="cell" x="2549" y="177.5" text-anchor="end">The import file was not found.</text>
  <text class="cell" x="2844" y="177.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="207.5">Toolkit default, another command awaits ImportCommand.ExecuteAsync in try / catch</text>
  <text class="cell" x="972" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="1307" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="1586" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="1991" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="2286" y="207.5" text-anchor="end">Faulted</text>
  <text class="cell" x="2549" y="207.5" text-anchor="end">The import file was not found.</text>
  <text class="cell" x="2844" y="207.5" text-anchor="end">True</text>
