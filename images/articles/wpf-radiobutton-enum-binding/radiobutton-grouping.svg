<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1218 770" width="1218" height="770" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1218" height="770" />
  <text class="title" x="12" y="24">the article's XAML, measured on net48 and net10.0-windows (one value = same on both)</text>
  <rect class="head" x="12" y="38" width="1194" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1192" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">runtime</text>
  <text class="cell" x="1192" y="87.5" text-anchor="end">net48: .NET Framework 4.8.9345.0 / net10.0-windows: .NET 10.0.10</text>
  <text class="cell" x="26" y="117.5">GroupName default</text>
  <text class="cell" x="1192" y="117.5" text-anchor="end">(empty)</text>
  <text class="cell" x="26" y="147.5">no GroupName: checked</text>
  <text class="cell" x="1192" y="147.5" text-anchor="end">Single</text>
  <text class="cell" x="26" y="177.5">no GroupName: ConvertBack(false)</text>
  <text class="cell" x="1192" y="177.5" text-anchor="end">1 (Standard)</text>
  <text class="cell" x="26" y="207.5">no GroupName: ViewModel</text>
  <text class="cell" x="1192" y="207.5" text-anchor="end">Standard / Single</text>
  <text class="cell" x="26" y="237.5">GroupName set: checked</text>
  <text class="cell" x="1192" y="237.5" text-anchor="end">Standard + Single</text>
  <text class="cell" x="26" y="267.5">GroupName set: ConvertBack(false)</text>
  <text class="cell" x="1192" y="267.5" text-anchor="end">0</text>
  <text class="cell" x="26" y="297.5">GroupName set: ViewModel</text>
  <text class="cell" x="1192" y="297.5" text-anchor="end">Standard / Single</text>
  <text class="cell" x="26" y="327.5">GroupName set: select Fine</text>
  <text class="cell" x="1192" y="327.5" text-anchor="end">ConvertBack(true) 1, (false) 0; checked Fine + Single; ViewModel Fine / Single</text>
  <text class="cell" x="26" y="357.5">GroupName set: select Draft</text>
  <text class="cell" x="1192" y="357.5" text-anchor="end">checked Draft + Single; ViewModel Draft / Single</text>
  <text class="cell" x="26" y="387.5">no GroupName, one StackPanel per enum</text>
  <text class="cell" x="1192" y="387.5" text-anchor="end">checked Standard + Single; ConvertBack(false) 0</text>
  <text class="cell" x="26" y="417.5">GroupName='quality' in two Borders</text>
  <text class="cell" x="1192" y="417.5" text-anchor="end">checked B:Standard</text>
  <text class="cell" x="26" y="447.5">ConverterParameter=Draft (string): checked</text>
  <text class="cell" x="1192" y="447.5" text-anchor="end">Single</text>
  <text class="cell" x="26" y="477.5">ConverterParameter=Draft (string): select Fine</text>
  <text class="cell" x="1192" y="477.5" text-anchor="end">checked Single; ViewModel Fine / Single</text>
  <text class="cell" x="26" y="507.5">same GroupName, two ViewModels: ConvertBack(false)</text>
  <text class="cell" x="1192" y="507.5" text-anchor="end">1 (Standard)</text>
  <text class="cell" x="26" y="537.5">unbound RadioButton in the group: ConvertBack(false)</text>
  <text class="cell" x="1192" y="537.5" text-anchor="end">1 (Standard)</text>
  <text class="cell" x="26" y="567.5">ConvertBack throws NotImplementedException</text>
  <text class="cell" x="1192" y="567.5" text-anchor="end">ConvertBack(false) 1; NotImplementedException thrown to the caller</text>
  <text class="cell" x="26" y="597.5">ConvertBack returns UnsetValue (FallbackValue=True)</text>
  <text class="cell" x="1192" y="597.5" text-anchor="end">Standard unchecked; error "Value 'False' could not be converted."; source Standard / Single</text>
  <text class="cell" x="26" y="627.5">ConvertBack returns parameter for false (no GroupName)</text>
  <text class="cell" x="1192" y="627.5" text-anchor="end">checked Standard + Single; ConvertBack(false) 1</text>
  <text class="cell" x="26" y="657.5">bool wrapper properties (no GroupName)</text>
  <text class="cell" x="1192" y="657.5" text-anchor="end">checked Standard + Single; setter(false) 1</text>
  <text class="cell" x="26" y="687.5">Grid, different cells</text>
  <text class="cell" x="1192" y="687.5" text-anchor="end">checked B (both set True)</text>
  <text class="cell" x="26" y="717.5">GroupBox Header and Content</text>
  <text class="cell" x="1192" y="717.5" text-anchor="end">checked B (both set True)</text>
  <text class="cell" x="26" y="747.5">ItemsControl, RadioButtons in Items</text>
  <text class="cell" x="1192" y="747.5" text-anchor="end">checked B (both set True)</text>
