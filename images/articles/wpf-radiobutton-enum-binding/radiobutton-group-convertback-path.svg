<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 466" width="880" height="466" role="img">
  <defs>
    <style>
      .lane { fill: #f5f7fb; stroke: #e1e7f0; stroke-width: 1; }
      .box { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.5; }
      .box-ng { fill: #fdf4f4; stroke: #e0aeae; stroke-width: 1.5; }
      .gate { fill: #eef3fd; stroke: #a9bde6; stroke-width: 1.5; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; fill: #1f2933; }
      .code-sm { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
      .lane-title { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #2563eb; }
      .ng { fill: #d64545; }
    </style>
    <marker id="rb-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a3" />
    </marker>
    <marker id="rb-ng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545" />
    </marker>
  </defs>

  <!-- ===== 1 : implicit grouping ===== -->
  <rect class="lane" x="14" y="14" width="852" height="120" rx="10" />
  <text class="lane-title" x="34" y="38">1   GroupName = ""   -&gt;   one implicit group</text>

  <rect class="box" x="34" y="52" width="236" height="62" rx="6" />
  <text class="code" x="152" y="78" text-anchor="middle">PageLayout.Single</text>
  <text class="code-sm" x="152" y="97" text-anchor="middle">IsChecked = true</text>

  <line x1="272" y1="83" x2="310" y2="83" stroke="#8a93a3" stroke-width="2" marker-end="url(#rb-muted)" />

  <rect class="box-ng" x="314" y="52" width="252" height="62" rx="6" />
  <text class="code" x="440" y="78" text-anchor="middle">Quality.Standard</text>
  <text class="code-sm ng" x="440" y="97" text-anchor="middle">IsChecked: true -&gt; false</text>

  <line x1="568" y1="83" x2="592" y2="83" stroke="#8a93a3" stroke-width="2" marker-end="url(#rb-muted)" />

  <rect class="box" x="596" y="52" width="250" height="62" rx="6" />
  <text class="code" x="721" y="76" text-anchor="middle">TwoWay</text>
  <text class="code-sm" x="721" y="97" text-anchor="middle">UpdateSourceTrigger = PropertyChanged</text>

  <!-- ===== 2 : source update ===== -->
  <rect class="lane" x="14" y="146" width="852" height="76" rx="10" />
  <text class="lane-title" x="34" y="170">2   source update</text>

  <rect class="gate" x="34" y="182" width="812" height="30" rx="6" />
  <text class="code" x="440" y="202" text-anchor="middle">ConvertBack(value: false, parameter: Quality.Standard)</text>

  <!-- ===== 3 : return value -> result ===== -->
  <rect class="lane" x="14" y="234" width="852" height="218" rx="10" />
  <text class="lane-title" x="34" y="258">3   ConvertBack return value   -&gt;   result</text>

  <rect class="box" x="34" y="272" width="250" height="36" rx="6" />
  <text class="code" x="159" y="295" text-anchor="middle">Binding.DoNothing</text>
  <line x1="286" y1="290" x2="316" y2="290" stroke="#8a93a3" stroke-width="2" marker-end="url(#rb-muted)" />
  <rect class="box-ng" x="320" y="272" width="526" height="36" rx="6" />
  <text class="code-sm" x="344" y="294">Quality = Standard</text>
  <text class="code-sm ng" x="520" y="294">IsChecked = false</text>

  <rect class="box" x="34" y="316" width="250" height="36" rx="6" />
  <text class="code" x="159" y="339" text-anchor="middle">DependencyProperty.UnsetValue</text>
  <line x1="286" y1="334" x2="316" y2="334" stroke="#d64545" stroke-width="2" marker-end="url(#rb-ng)" />
  <rect class="box-ng" x="320" y="316" width="526" height="36" rx="6" />
  <text class="code-sm" x="344" y="338">Quality = Standard</text>
  <text class="code-sm ng" x="520" y="338">IsChecked = false</text>
  <text class="code-sm ng" x="676" y="338">Validation.Errors</text>

  <rect class="box" x="34" y="360" width="250" height="36" rx="6" />
  <text class="code" x="159" y="383" text-anchor="middle">parameter</text>
  <line x1="286" y1="378" x2="316" y2="378" stroke="#8a93a3" stroke-width="2" marker-end="url(#rb-muted)" />
  <rect class="box" x="320" y="360" width="526" height="36" rx="6" />
  <text class="code-sm" x="344" y="382">Quality = Standard</text>
  <text class="code-sm" x="520" y="382">IsChecked = true</text>

  <rect class="box" x="34" y="404" width="250" height="36" rx="6" />
  <text class="code" x="159" y="427" text-anchor="middle">throw</text>
  <line x1="286" y1="422" x2="316" y2="422" stroke="#d64545" stroke-width="2" marker-end="url(#rb-ng)" />
  <rect class="box-ng" x="320" y="404" width="526" height="36" rx="6" />
  <text class="code-sm ng" x="344" y="426">UnhandledException</text>
  <text class="code-sm ng" x="520" y="426">NotImplementedException</text>
</svg>
