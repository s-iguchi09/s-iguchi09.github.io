<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 637 260" width="637" height="260" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="637" height="260" />
  <text class="title" x="12" y="24">Brush resource at run time (White -&gt; Red): the entry replaced, or the same brush's Color changed</text>
  <rect class="head" x="12" y="38" width="613" height="30" />
  <text class="cell" x="26" y="57.5">configuration</text>
  <text class="cell" x="611" y="57.5" text-anchor="end">Border.Background</text>
  <text class="cell" x="26" y="87.5">StaticResource, before swap</text>
  <text class="cell" x="611" y="87.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="26" y="117.5">StaticResource, after swap</text>
  <text class="cell" x="611" y="117.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="26" y="147.5">DynamicResource, before swap</text>
  <text class="cell" x="611" y="147.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="26" y="177.5">DynamicResource, after swap</text>
  <text class="cell" x="611" y="177.5" text-anchor="end">#FFFF0000</text>
  <text class="cell" x="26" y="207.5">StaticResource, brush.Color changed</text>
  <text class="cell" x="611" y="207.5" text-anchor="end">#FFFF0000 (brush was frozen: False)</text>
  <text class="cell" x="26" y="237.5">DynamicResource, brush.Color changed</text>
  <text class="cell" x="611" y="237.5" text-anchor="end">#FFFF0000 (brush was frozen: False)</text>
  <line class="line" x1="12" y1="38" x2="625" y2="38" />
  <line class="line" x1="12" y1="68" x2="625" y2="68" />
  <line class="line" x1="12" y1="98" x2="625" y2="98" />
  <line class="line" x1="12" y1="128" x2="625" y2="128" />
  <line class="line" x1="12" y1="158" x2="625" y2="158" />
  <line class="line" x1="12" y1="188" x2="625" y2="188" />
  <line class="line" x1="12" y1="218" x2="625" y2="218" />
  <line class="line" x1="12" y1="248" x2="625" y2="248" />
  <line class="line" x1="12" y1="38" x2="12" y2="248" />
  <line class="line" x1="323" y1="38" x2="323" y2="248" />
  <line class="line" x1="625" y1="38" x2="625" y2="248" />
</svg>
