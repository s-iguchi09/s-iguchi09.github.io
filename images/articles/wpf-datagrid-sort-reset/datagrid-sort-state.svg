<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 350" width="1070" height="350" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1070" height="350" />
  <text class="title" x="12" y="24">sort state after each operation</text>
  <rect class="head" x="12" y="38" width="1046" height="30" />
  <text class="cell" x="26" y="57.5">operation</text>
  <text class="cell" x="651" y="57.5" text-anchor="end">SortDescriptions</text>
  <text class="cell" x="836" y="57.5" text-anchor="end">column.SortDirection</text>
  <text class="cell" x="1044" y="57.5" text-anchor="end">order</text>
  <text class="cell" x="26" y="87.5">initial</text>
  <text class="cell" x="651" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="836" y="87.5" text-anchor="end">null</text>
  <text class="cell" x="1044" y="87.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="117.5">SortDescriptions.Add only</text>
  <text class="cell" x="651" y="117.5" text-anchor="end">1</text>
  <text class="cell" x="836" y="117.5" text-anchor="end">null</text>
  <text class="cell" x="1044" y="117.5" text-anchor="end">alice, bob, carol</text>
  <text class="cell" x="26" y="147.5">+ column.SortDirection</text>
  <text class="cell" x="651" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="836" y="147.5" text-anchor="end">Ascending</text>
  <text class="cell" x="1044" y="147.5" text-anchor="end">alice, bob, carol</text>
  <text class="cell" x="26" y="177.5">then SortDescriptions.Clear() only</text>
  <text class="cell" x="651" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="836" y="177.5" text-anchor="end">Ascending</text>
  <text class="cell" x="1044" y="177.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="207.5">+ clear column.SortDirection</text>
  <text class="cell" x="651" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="836" y="207.5" text-anchor="end">null</text>
  <text class="cell" x="1044" y="207.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="237.5">one SortDescription (Score desc), with a tie</text>
  <text class="cell" x="651" y="237.5" text-anchor="end">1</text>
  <text class="cell" x="836" y="237.5" text-anchor="end">null</text>
  <text class="cell" x="1044" y="237.5" text-anchor="end">alice, carol, anna, bob</text>
  <text class="cell" x="26" y="267.5">two SortDescriptions (Score desc, Name asc), with a tie</text>
  <text class="cell" x="651" y="267.5" text-anchor="end">2</text>
  <text class="cell" x="836" y="267.5" text-anchor="end">null</text>
  <text class="cell" x="1044" y="267.5" text-anchor="end">alice, anna, carol, bob</text>
  <text class="cell" x="26" y="297.5">ItemsSource = ICollectionView; view.SortDescriptions.Clear()</text>
  <text class="cell" x="651" y="297.5" text-anchor="end">0</text>
  <text class="cell" x="836" y="297.5" text-anchor="end">Ascending</text>
  <text class="cell" x="1044" y="297.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="327.5">column header click (standard sort)</text>
  <text class="cell" x="651" y="327.5" text-anchor="end">1</text>
  <text class="cell" x="836" y="327.5" text-anchor="end">Ascending</text>
  <text class="cell" x="1044" y="327.5" text-anchor="end">alice, bob, carol</text>
