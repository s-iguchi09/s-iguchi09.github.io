<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827 260" width="827" height="260" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="827" height="260" />
  <text class="title" x="12" y="24">sort state after each operation</text>
  <rect class="head" x="12" y="38" width="803" height="30" />
  <text class="cell" x="26" y="57.5">operation</text>
  <text class="cell" x="454" y="57.5" text-anchor="end">SortDescriptions</text>
  <text class="cell" x="639" y="57.5" text-anchor="end">column.SortDirection</text>
  <text class="cell" x="801" y="57.5" text-anchor="end">order</text>
  <text class="cell" x="26" y="87.5">initial</text>
  <text class="cell" x="454" y="87.5" text-anchor="end">0</text>
  <text class="cell" x="639" y="87.5" text-anchor="end">null</text>
  <text class="cell" x="801" y="87.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="117.5">SortDescriptions.Add only</text>
  <text class="cell" x="454" y="117.5" text-anchor="end">1</text>
  <text class="cell" x="639" y="117.5" text-anchor="end">null</text>
  <text class="cell" x="801" y="117.5" text-anchor="end">alice, bob, carol</text>
  <text class="cell" x="26" y="147.5">+ column.SortDirection</text>
  <text class="cell" x="454" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="639" y="147.5" text-anchor="end">Ascending</text>
  <text class="cell" x="801" y="147.5" text-anchor="end">alice, bob, carol</text>
  <text class="cell" x="26" y="177.5">then SortDescriptions.Clear() only</text>
  <text class="cell" x="454" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="639" y="177.5" text-anchor="end">Ascending</text>
  <text class="cell" x="801" y="177.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="207.5">+ clear column.SortDirection</text>
  <text class="cell" x="454" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="639" y="207.5" text-anchor="end">null</text>
  <text class="cell" x="801" y="207.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="237.5">two SortDescriptions (multi-column)</text>
  <text class="cell" x="454" y="237.5" text-anchor="end">2</text>
  <text class="cell" x="639" y="237.5" text-anchor="end">null</text>
  <text class="cell" x="801" y="237.5" text-anchor="end">alice, carol, bob</text>
