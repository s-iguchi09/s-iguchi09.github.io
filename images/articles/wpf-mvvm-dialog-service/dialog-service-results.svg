<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1482 440" width="1482" height="440" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1482" height="440" />
  <text class="title" x="12" y="24">What the view model receives through DialogService</text>
  <rect class="head" x="12" y="38" width="1458" height="30" />
  <text class="cell" x="26" y="57.5">operation</text>
  <text class="cell" x="910" y="57.5" text-anchor="end">return value</text>
  <text class="cell" x="1456" y="57.5" text-anchor="end">state after the call</text>
  <text class="cell" x="26" y="87.5">DeleteCommand → OK</text>
  <text class="cell" x="910" y="87.5" text-anchor="end">Confirm: true</text>
  <text class="cell" x="1456" y="87.5" text-anchor="end">customers: 1 of 2</text>
  <text class="cell" x="26" y="117.5">DeleteCommand → Cancel</text>
  <text class="cell" x="910" y="117.5" text-anchor="end">Confirm: false</text>
  <text class="cell" x="1456" y="117.5" text-anchor="end">customers: 2 of 2</text>
  <text class="cell" x="26" y="147.5">ImportCommand → Cancel</text>
  <text class="cell" x="910" y="147.5" text-anchor="end">OpenFile: null</text>
  <text class="cell" x="1456" y="147.5" text-anchor="end">ImportPath: null</text>
  <text class="cell" x="26" y="177.5">ImportCommand → type a file name, Open</text>
  <text class="cell" x="910" y="177.5" text-anchor="end">OpenFile: the full path of the file</text>
  <text class="cell" x="1456" y="177.5" text-anchor="end">ImportPath: the same path</text>
  <text class="cell" x="26" y="207.5">EditCommand → type "x", OK</text>
  <text class="cell" x="910" y="207.5" text-anchor="end">ShowDialog: true</text>
  <text class="cell" x="1456" y="207.5" text-anchor="end">Customer.Name: "Alicex"</text>
  <text class="cell" x="26" y="237.5">EditCommand → type "x", Cancel</text>
  <text class="cell" x="910" y="237.5" text-anchor="end">ShowDialog: false</text>
  <text class="cell" x="1456" y="237.5" text-anchor="end">Customer.Name: "Alice"</text>
  <text class="cell" x="26" y="267.5">EditCommand → type "x", × (close)</text>
  <text class="cell" x="910" y="267.5" text-anchor="end">ShowDialog: false</text>
  <text class="cell" x="1456" y="267.5" text-anchor="end">Customer.Name: "Alice"</text>
  <text class="cell" x="26" y="297.5">Window.ShowDialog() itself → × (close)</text>
  <text class="cell" x="910" y="297.5" text-anchor="end">ShowDialog(): false</text>
  <text class="cell" x="1456" y="297.5" text-anchor="end">DialogResult was never set</text>
  <text class="cell" x="26" y="327.5">Customer itself bound → type "x", Cancel</text>
  <text class="cell" x="910" y="327.5" text-anchor="end">ShowDialog: false</text>
  <text class="cell" x="1456" y="327.5" text-anchor="end">Customer.Name: "Alicex"</text>
  <text class="cell" x="26" y="357.5">DeleteCommand of a view model that is no window's DataContext</text>
  <text class="cell" x="910" y="357.5" text-anchor="end">throws InvalidOperationException</text>
  <text class="cell" x="1456" y="357.5" text-anchor="end">shown windows: 1 → 1, Application.Windows: 1 → 1, customers: 1 → 1</text>
  <text class="cell" x="26" y="387.5">EditCommand of a view model that is no window's DataContext</text>
  <text class="cell" x="910" y="387.5" text-anchor="end">throws InvalidOperationException</text>
  <text class="cell" x="1456" y="387.5" text-anchor="end">shown windows: 1 → 1, Application.Windows: 1 → 1, customers: 1 → 1</text>
  <text class="cell" x="26" y="417.5">Same EditCommand, service that creates the window before finding the owner</text>
  <text class="cell" x="910" y="417.5" text-anchor="end">throws InvalidOperationException</text>
  <text class="cell" x="1456" y="417.5" text-anchor="end">shown windows: 1 → 1, Application.Windows: 1 → 2, customers: 1 → 1</text>
  <line class="line" x1="12" y1="38" x2="1470" y2="38" />
  <line class="line" x1="12" y1="68" x2="1470" y2="68" />
  <line class="line" x1="12" y1="98" x2="1470" y2="98" />
  <line class="line" x1="12" y1="128" x2="1470" y2="128" />
  <line class="line" x1="12" y1="158" x2="1470" y2="158" />
  <line class="line" x1="12" y1="188" x2="1470" y2="188" />
  <line class="line" x1="12" y1="218" x2="1470" y2="218" />
  <line class="line" x1="12" y1="248" x2="1470" y2="248" />
  <line class="line" x1="12" y1="278" x2="1470" y2="278" />
  <line class="line" x1="12" y1="308" x2="1470" y2="308" />
  <line class="line" x1="12" y1="338" x2="1470" y2="338" />
  <line class="line" x1="12" y1="368" x2="1470" y2="368" />
  <line class="line" x1="12" y1="398" x2="1470" y2="398" />
  <line class="line" x1="12" y1="428" x2="1470" y2="428" />
  <line class="line" x1="12" y1="38" x2="12" y2="428" />
  <line class="line" x1="621" y1="38" x2="621" y2="428" />
  <line class="line" x1="924" y1="38" x2="924" y2="428" />
  <line class="line" x1="1470" y1="38" x2="1470" y2="428" />
</svg>
