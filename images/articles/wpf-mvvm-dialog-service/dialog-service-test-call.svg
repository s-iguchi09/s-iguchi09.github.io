<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1298 170" width="1298" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1298" height="170" />
  <text class="title" x="12" y="24">Executing DeleteCommand from a separate MTA thread (standing in for a test)</text>
  <rect class="head" x="12" y="38" width="1274" height="30" />
  <text class="cell" x="26" y="57.5">view model</text>
  <text class="cell" x="651" y="57.5" text-anchor="end">windows the thread had open at 1 s</text>
  <text class="cell" x="1079" y="57.5" text-anchor="end">Execute returned within 1 s</text>
  <text class="cell" x="1272" y="57.5" text-anchor="end">customers left (of 2)</text>
  <text class="cell" x="26" y="87.5">calls MessageBox.Show directly</text>
  <text class="cell" x="651" y="87.5" text-anchor="end">message box (#32770)</text>
  <text class="cell" x="1079" y="87.5" text-anchor="end">no (returned after OK (IDOK) was sent from outside)</text>
  <text class="cell" x="1272" y="87.5" text-anchor="end">1</text>
  <text class="cell" x="26" y="117.5">IDialogService (test double returns true)</text>
  <text class="cell" x="651" y="117.5" text-anchor="end">(already returned)</text>
  <text class="cell" x="1079" y="117.5" text-anchor="end">yes</text>
  <text class="cell" x="1272" y="117.5" text-anchor="end">1</text>
  <text class="cell" x="26" y="147.5">IDialogService (test double returns false)</text>
  <text class="cell" x="651" y="147.5" text-anchor="end">(already returned)</text>
  <text class="cell" x="1079" y="147.5" text-anchor="end">yes</text>
  <text class="cell" x="1272" y="147.5" text-anchor="end">2</text>
  <line class="line" x1="12" y1="38" x2="1286" y2="38" />
  <line class="line" x1="12" y1="68" x2="1286" y2="68" />
  <line class="line" x1="12" y1="98" x2="1286" y2="98" />
  <line class="line" x1="12" y1="128" x2="1286" y2="128" />
  <line class="line" x1="12" y1="158" x2="1286" y2="158" />
  <line class="line" x1="12" y1="38" x2="12" y2="158" />
