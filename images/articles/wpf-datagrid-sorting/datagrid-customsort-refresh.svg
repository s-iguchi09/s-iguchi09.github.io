  <rect class="bg" x="0" y="0" width="882" height="200" />
  <text class="title" x="12" y="24">CustomSort and SortDescriptions on a ListCollectionView, and Items.Refresh</text>
  <rect class="head" x="12" y="38" width="858" height="30" />
  <text class="cell" x="26" y="57.5">operation</text>
  <text class="cell" x="462" y="57.5" text-anchor="end">SortDescriptions</text>
  <text class="cell" x="569" y="57.5" text-anchor="end">CustomSort</text>
  <text class="cell" x="856" y="57.5" text-anchor="end">order / selection</text>
  <text class="cell" x="26" y="87.5">SortDescriptions: Name asc</text>
