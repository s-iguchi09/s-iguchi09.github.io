  <text class="cell" x="486" y="57.5" text-anchor="end">SortMemberPath</text>
  <text class="cell" x="600" y="57.5" text-anchor="end">CanUserSort</text>
  <text class="cell" x="777" y="57.5" text-anchor="end">order after sorting</text>
