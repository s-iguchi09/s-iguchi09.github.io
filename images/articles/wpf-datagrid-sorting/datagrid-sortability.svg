<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 230" width="882" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="882" height="230" />
  <text class="title" x="12" y="24">sortability by how the column is declared</text>
  <rect class="head" x="12" y="38" width="858" height="30" />
  <text class="cell" x="26" y="57.5">column</text>
  <text class="cell" x="509" y="57.5" text-anchor="end">SortMemberPath</text>
  <text class="cell" x="624" y="57.5" text-anchor="end">CanUserSort</text>
  <text class="cell" x="856" y="57.5" text-anchor="end">order after a header click</text>
  <text class="cell" x="26" y="87.5">DataGridTextColumn, Binding only</text>
  <text class="cell" x="509" y="87.5" text-anchor="end">Name</text>
  <text class="cell" x="624" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="856" y="87.5" text-anchor="end">alice, bob, carol</text>
  <text class="cell" x="26" y="117.5">+ explicit SortMemberPath=Score</text>
  <text class="cell" x="509" y="117.5" text-anchor="end">Score</text>
  <text class="cell" x="624" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="856" y="117.5" text-anchor="end">bob, carol, alice</text>
  <text class="cell" x="26" y="147.5">+ CanUserSort=False</text>
  <text class="cell" x="509" y="147.5" text-anchor="end">Name</text>
  <text class="cell" x="624" y="147.5" text-anchor="end">False</text>
  <text class="cell" x="856" y="147.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="177.5">DataGridTemplateColumn, no SortMemberPath</text>
  <text class="cell" x="509" y="177.5" text-anchor="end">(empty)</text>
  <text class="cell" x="624" y="177.5" text-anchor="end">False</text>
  <text class="cell" x="856" y="177.5" text-anchor="end">carol, alice, bob</text>
  <text class="cell" x="26" y="207.5">DataGridTemplateColumn + SortMemberPath=Name</text>
  <text class="cell" x="509" y="207.5" text-anchor="end">Name</text>
  <text class="cell" x="624" y="207.5" text-anchor="end">True</text>
  <text class="cell" x="856" y="207.5" text-anchor="end">alice, bob, carol</text>
  <line class="line" x1="12" y1="38" x2="870" y2="38" />
  <line class="line" x1="12" y1="68" x2="870" y2="68" />
  <line class="line" x1="12" y1="98" x2="870" y2="98" />
  <line class="line" x1="12" y1="128" x2="870" y2="128" />
  <line class="line" x1="12" y1="158" x2="870" y2="158" />
  <line class="line" x1="12" y1="188" x2="870" y2="188" />
  <line class="line" x1="12" y1="218" x2="870" y2="218" />
  <line class="line" x1="12" y1="38" x2="12" y2="218" />
  <line class="line" x1="385" y1="38" x2="385" y2="218" />
  <line class="line" x1="523" y1="38" x2="523" y2="218" />
  <line class="line" x1="638" y1="38" x2="638" y2="218" />
  <line class="line" x1="870" y1="38" x2="870" y2="218" />
</svg>
