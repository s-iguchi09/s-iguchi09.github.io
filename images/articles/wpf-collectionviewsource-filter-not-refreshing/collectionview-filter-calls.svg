<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 701 260" width="701" height="260" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="701" height="260" />
  <text class="title" x="12" y="24">filter predicate calls per operation (1,000 items, half pass the filter)</text>
  <rect class="head" x="12" y="38" width="677" height="30" />
  <text class="cell" x="26" y="57.5">operation</text>
  <text class="cell" x="384" y="57.5" text-anchor="end">filter calls</text>
  <text class="cell" x="545" y="57.5" text-anchor="end">CollectionChanged</text>
  <text class="cell" x="675" y="57.5" text-anchor="end">items in view</text>
  <text class="cell" x="26" y="87.5">Add 1 item (passes filter)</text>
  <text class="cell" x="384" y="87.5" text-anchor="end">1</text>
  <text class="cell" x="545" y="87.5" text-anchor="end">1</text>
  <text class="cell" x="675" y="87.5" text-anchor="end">501</text>
  <text class="cell" x="26" y="117.5">Add 1 item (fails filter)</text>
  <text class="cell" x="384" y="117.5" text-anchor="end">1</text>
  <text class="cell" x="545" y="117.5" text-anchor="end">0</text>
  <text class="cell" x="675" y="117.5" text-anchor="end">500</text>
  <text class="cell" x="26" y="147.5">Remove 1 item</text>
  <text class="cell" x="384" y="147.5" text-anchor="end">0</text>
  <text class="cell" x="545" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="675" y="147.5" text-anchor="end">499</text>
  <text class="cell" x="26" y="177.5">item.Stock = 0 (leaves filter)</text>
  <text class="cell" x="384" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="545" y="177.5" text-anchor="end">0</text>
  <text class="cell" x="675" y="177.5" text-anchor="end">500</text>
  <text class="cell" x="26" y="207.5">item.Stock = 1 (enters filter)</text>
  <text class="cell" x="384" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="545" y="207.5" text-anchor="end">0</text>
  <text class="cell" x="675" y="207.5" text-anchor="end">500</text>
  <text class="cell" x="26" y="237.5">view.Refresh()</text>
  <text class="cell" x="384" y="237.5" text-anchor="end">1000</text>
  <text class="cell" x="545" y="237.5" text-anchor="end">1</text>
  <text class="cell" x="675" y="237.5" text-anchor="end">500</text>
  <line class="line" x1="12" y1="38" x2="689" y2="38" />
  <line class="line" x1="12" y1="68" x2="689" y2="68" />
  <line class="line" x1="12" y1="98" x2="689" y2="98" />
  <line class="line" x1="12" y1="128" x2="689" y2="128" />
  <line class="line" x1="12" y1="158" x2="689" y2="158" />
  <line class="line" x1="12" y1="188" x2="689" y2="188" />
  <line class="line" x1="12" y1="218" x2="689" y2="218" />
  <line class="line" x1="12" y1="248" x2="689" y2="248" />
  <line class="line" x1="12" y1="38" x2="12" y2="248" />
  <line class="line" x1="276" y1="38" x2="276" y2="248" />
  <line class="line" x1="398" y1="38" x2="398" y2="248" />
  <line class="line" x1="559" y1="38" x2="559" y2="248" />
  <line class="line" x1="689" y1="38" x2="689" y2="248" />
</svg>
