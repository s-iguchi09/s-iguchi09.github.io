<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1204 260" width="1204" height="260" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1204" height="260" />
  <text class="title" x="12" y="24">Validation.HasError of the name TextBox (rules: required, up to 20 characters)</text>
  <rect class="head" x="12" y="38" width="1180" height="30" />
  <text class="cell" x="26" y="57.5">how the view model validates</text>
  <text class="cell" x="729" y="57.5" text-anchor="end">on startup (name is empty)</text>
  <text class="cell" x="961" y="57.5" text-anchor="end">after typing 21 characters</text>
  <text class="cell" x="1178" y="57.5" text-anchor="end">after clearing the input</text>
  <text class="cell" x="26" y="87.5">Toolkit, setter calls SetProperty(ref _name, value, true)</text>
  <text class="cell" x="729" y="87.5" text-anchor="end">False</text>
  <text class="cell" x="961" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="1178" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="117.5">Toolkit [ObservableProperty] + [Required] / [MaxLength] only</text>
  <text class="cell" x="729" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="961" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="1178" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="147.5">Toolkit [ObservableProperty] + [NotifyDataErrorInfo]</text>
  <text class="cell" x="729" y="147.5" text-anchor="end">False</text>
  <text class="cell" x="961" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="1178" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="177.5">same, plus ValidateAllProperties() in the constructor</text>
  <text class="cell" x="729" y="177.5" text-anchor="end">True</text>
  <text class="cell" x="961" y="177.5" text-anchor="end">True</text>
  <text class="cell" x="1178" y="177.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="207.5">Prism BindableBase + ErrorsContainer, setter validates</text>
  <text class="cell" x="729" y="207.5" text-anchor="end">False</text>
  <text class="cell" x="961" y="207.5" text-anchor="end">True</text>
  <text class="cell" x="1178" y="207.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="237.5">same, plus validation in the constructor</text>
  <text class="cell" x="729" y="237.5" text-anchor="end">True</text>
  <text class="cell" x="961" y="237.5" text-anchor="end">True</text>
  <text class="cell" x="1178" y="237.5" text-anchor="end">True</text>
