<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2107 170" width="2107" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="2107" height="170" />
  <text class="title" x="12" y="24">Saving with the name still empty (Toolkit ObservableValidator)</text>
  <rect class="head" x="12" y="38" width="2083" height="30" />
  <text class="cell" x="26" y="57.5">how Save is guarded</text>
  <text class="cell" x="863" y="57.5" text-anchor="end">Save button IsEnabled on startup</text>
  <text class="cell" x="1040" y="57.5" text-anchor="end">HasError on startup</text>
  <text class="cell" x="1437" y="57.5" text-anchor="end">times the save went through after clicking Save</text>
  <text class="cell" x="1684" y="57.5" text-anchor="end">HasError after clicking Save</text>
  <text class="cell" x="2081" y="57.5" text-anchor="end">Save button IsEnabled after typing a valid name</text>
  <text class="cell" x="26" y="87.5">CanExecute: !HasErrors, [NotifyDataErrorInfo] only</text>
  <text class="cell" x="863" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="1040" y="87.5" text-anchor="end">False</text>
  <text class="cell" x="1437" y="87.5" text-anchor="end">1</text>
  <text class="cell" x="1684" y="87.5" text-anchor="end">False</text>
  <text class="cell" x="2081" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="117.5">CanExecute: !HasErrors, plus ValidateAllProperties() in the constructor</text>
  <text class="cell" x="863" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="1040" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="1437" y="117.5" text-anchor="end">- (cannot click)</text>
  <text class="cell" x="1684" y="117.5" text-anchor="end">- (cannot click)</text>
  <text class="cell" x="2081" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="26" y="147.5">no CanExecute, ValidateAllProperties() at the start of Save</text>
  <text class="cell" x="863" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="1040" y="147.5" text-anchor="end">False</text>
  <text class="cell" x="1437" y="147.5" text-anchor="end">0</text>
  <text class="cell" x="1684" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="2081" y="147.5" text-anchor="end">True</text>
  <line class="line" x1="12" y1="38" x2="2095" y2="38" />
  <line class="line" x1="12" y1="68" x2="2095" y2="68" />
  <line class="line" x1="12" y1="98" x2="2095" y2="98" />
  <line class="line" x1="12" y1="128" x2="2095" y2="128" />
  <line class="line" x1="12" y1="158" x2="2095" y2="158" />
  <line class="line" x1="12" y1="38" x2="12" y2="158" />
  <line class="line" x1="597" y1="38" x2="597" y2="158" />
  <line class="line" x1="877" y1="38" x2="877" y2="158" />
  <line class="line" x1="1054" y1="38" x2="1054" y2="158" />
  <line class="line" x1="1451" y1="38" x2="1451" y2="158" />
  <line class="line" x1="1698" y1="38" x2="1698" y2="158" />
  <line class="line" x1="2095" y1="38" x2="2095" y2="158" />
</svg>
