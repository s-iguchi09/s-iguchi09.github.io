<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1218 500" width="1218" height="500" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1218" height="500" />
  <text class="title" x="12" y="24">pitfalls: OneWay, assignment, property name, Validation.Error, Errors[0], thread</text>
  <rect class="head" x="12" y="38" width="1194" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1192" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">setter validation, LostFocus: cleared by typing</text>
  <text class="cell" x="1192" y="87.5" text-anchor="end">HasError: while focused False (Text ""); after focus leaves True</text>
  <text class="cell" x="26" y="117.5">setter validation, Explicit: cleared by typing</text>
  <text class="cell" x="1192" y="117.5" text-anchor="end">HasError: while focused False (Text ""); after focus leaves False; after UpdateSource True</text>
  <text class="cell" x="26" y="147.5">OneWay + rule, source empty</text>
  <text class="cell" x="1192" y="147.5" text-anchor="end">HasError: start True; typed "abc" True; source "abc" False</text>
  <text class="cell" x="26" y="177.5">OneWay, Text = "x" in code</text>
  <text class="cell" x="1192" y="177.5" text-anchor="end">binding removed, HasError False</text>
  <text class="cell" x="26" y="207.5">OneTime, Text = "x" in code</text>
  <text class="cell" x="1192" y="207.5" text-anchor="end">binding removed, HasError False</text>
  <text class="cell" x="26" y="237.5">OneWay, SetCurrentValue(Text, "x")</text>
  <text class="cell" x="1192" y="237.5" text-anchor="end">binding kept, HasError True</text>
  <text class="cell" x="26" y="267.5">error added, ErrorsChanged("Namee"), path Name</text>
  <text class="cell" x="1192" y="267.5" text-anchor="end">HasErrors True, Validation.HasError False</text>
  <text class="cell" x="26" y="297.5">error added, ErrorsChanged("Name"), path Name</text>
  <text class="cell" x="1192" y="297.5" text-anchor="end">HasErrors True, Validation.HasError True</text>
  <text class="cell" x="26" y="327.5">Validation.Error handler, NotifyOnValidationError=False</text>
  <text class="cell" x="1192" y="327.5" text-anchor="end">Validation.Error raised 0 times</text>
  <text class="cell" x="26" y="357.5">Validation.Error handler, NotifyOnValidationError=True</text>
  <text class="cell" x="1192" y="357.5" text-anchor="end">Validation.Error raised 2 times</text>
  <text class="cell" x="26" y="387.5">(Validation.Errors)[0].ErrorContent, error cleared</text>
  <text class="cell" x="1192" y="387.5" text-anchor="end">HasError False, Error 17 traced 1</text>
  <text class="cell" x="26" y="417.5">(Validation.Errors)/ErrorContent, error cleared</text>
  <text class="cell" x="1192" y="417.5" text-anchor="end">HasError False, Error 17 traced 0</text>
  <text class="cell" x="26" y="447.5">ErrorsChanged raised on the UI thread</text>
  <text class="cell" x="1192" y="447.5" text-anchor="end">Validation.HasError True (raised on thread UI)</text>
  <text class="cell" x="26" y="477.5">ErrorsChanged raised on a background thread</text>
  <text class="cell" x="1192" y="477.5" text-anchor="end">Validation.HasError True (raised on thread other than UI)</text>
