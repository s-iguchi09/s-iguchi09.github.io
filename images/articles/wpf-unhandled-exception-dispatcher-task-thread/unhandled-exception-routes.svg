  <text class="cell" x="1240" y="327.5" text-anchor="end">—</text>
  <text class="cell" x="1449" y="327.5" text-anchor="end">—</text>
  <text class="cell" x="1579" y="327.5" text-anchor="end">keeps running</text>
  <text class="cell" x="26" y="357.5">System.Timers.Timer.Elapsed (sync)</text>
