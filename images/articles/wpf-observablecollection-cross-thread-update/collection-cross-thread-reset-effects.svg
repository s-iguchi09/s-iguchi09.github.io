<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2474 200" width="2474" height="200" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="2474" height="200" />
  <text class="title" x="12" y="24">Adding 1,000 items to a ListBox that already holds 1,000, with a selection and a scroll position</text>
  <rect class="head" x="12" y="38" width="2450" height="30" />
  <text class="cell" x="26" y="57.5">how the items are added</text>
  <text class="cell" x="376" y="57.5" text-anchor="end">VirtualizationMode</text>
