  <text class="cell" x="1992" y="57.5" text-anchor="end">containers realized after: created before / created after the add</text>
  <text class="cell" x="2279" y="57.5" text-anchor="end">Tag set on the selected container</text>
  <text class="cell" x="2448" y="57.5" text-anchor="end">view notifications</text>
