  <text class="cell" x="26" y="57.5">countermeasure</text>
  <text class="cell" x="494" y="57.5" text-anchor="end">background loop ms</text>
  <text class="cell" x="702" y="57.5" text-anchor="end">Items.Count at loop end</text>
  <text class="cell" x="871" y="57.5" text-anchor="end">until all shown ms</text>
