<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1569 230" width="1569" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1569" height="230" />
  <text class="title" x="12" y="24">UI thread stalls while 50,000 items arrive at once (median of 5, interleaved, after one warm-up round)</text>
  <rect class="head" x="12" y="38" width="1545" height="30" />
  <text class="cell" x="26" y="57.5">how the items are applied</text>
  <text class="cell" x="627" y="57.5" text-anchor="end">longest frame interval ms (median)</text>
  <text class="cell" x="977" y="57.5" text-anchor="end">longest frame interval min–max of runs ms</text>
  <text class="cell" x="1233" y="57.5" text-anchor="end">until all applied ms (median)</text>
  <text class="cell" x="1543" y="57.5" text-anchor="end">most items applied in one timer tick</text>
  <text class="cell" x="26" y="87.5">no updates (baseline)</text>
  <text class="cell" x="627" y="87.5" text-anchor="end">18</text>
  <text class="cell" x="977" y="87.5" text-anchor="end">18–26</text>
  <text class="cell" x="1233" y="87.5" text-anchor="end">-</text>
  <text class="cell" x="1543" y="87.5" text-anchor="end">-</text>
  <text class="cell" x="26" y="117.5">Dispatcher.Invoke per item</text>
  <text class="cell" x="627" y="117.5" text-anchor="end">24</text>
  <text class="cell" x="977" y="117.5" text-anchor="end">18–26</text>
  <text class="cell" x="1233" y="117.5" text-anchor="end">4,476</text>
  <text class="cell" x="1543" y="117.5" text-anchor="end">-</text>
  <text class="cell" x="26" y="147.5">EnableCollectionSynchronization + lock</text>
  <text class="cell" x="627" y="147.5" text-anchor="end">29</text>
  <text class="cell" x="977" y="147.5" text-anchor="end">28–33</text>
  <text class="cell" x="1233" y="147.5" text-anchor="end">202</text>
  <text class="cell" x="1543" y="147.5" text-anchor="end">-</text>
  <text class="cell" x="26" y="177.5">queue, drain every 100 ms, Add per item</text>
  <text class="cell" x="627" y="177.5" text-anchor="end">123</text>
  <text class="cell" x="977" y="177.5" text-anchor="end">105–129</text>
  <text class="cell" x="1233" y="177.5" text-anchor="end">213</text>
  <text class="cell" x="1543" y="177.5" text-anchor="end">50,000</text>
  <text class="cell" x="26" y="207.5">queue, drain every 100 ms, one Reset</text>
  <text class="cell" x="627" y="207.5" text-anchor="end">33</text>
  <text class="cell" x="977" y="207.5" text-anchor="end">20–46</text>
  <text class="cell" x="1233" y="207.5" text-anchor="end">110</text>
  <text class="cell" x="1543" y="207.5" text-anchor="end">50,000</text>
