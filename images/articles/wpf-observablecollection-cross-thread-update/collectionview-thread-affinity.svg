<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img">
  <defs>
    <style>
      .lane { fill: #f5f7fb; stroke: #e1e7f0; stroke-width: 1; }
      .thread { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.5; }
      .box-ng { fill: #fdf4f4; stroke: #e0aeae; stroke-width: 1.5; }
      .box-ok { fill: #f1f9f5; stroke: #9dd3b8; stroke-width: 1.5; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; fill: #1f2933; }
      .code-sm { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
      .lane-title { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #2563eb; }
      .ng { fill: #d64545; }
      .ok { fill: #2f9e6e; }
    </style>
    <marker id="ar-ng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545" />
    </marker>
    <marker id="ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e6e" />
    </marker>
  </defs>

  <!-- ===== 直接 Add した場合 ===== -->
  <rect class="lane" x="14" y="14" width="872" height="160" rx="10" />
  <text class="lane-title" x="34" y="40">Items.Add(...)   from Task.Run</text>

  <rect class="thread" x="34" y="56" width="240" height="98" rx="6" stroke-dasharray="5 4" />
  <text class="code-sm" x="154" y="76" text-anchor="middle">background thread</text>
  <rect class="box" x="54" y="88" width="200" height="46" rx="5" />
  <text class="code" x="154" y="116" text-anchor="middle">ObservableCollection</text>

  <line x1="286" y1="111" x2="428" y2="111" stroke="#d64545" stroke-width="2.5" marker-end="url(#ar-ng)" />
  <text class="code-sm ng" x="357" y="100" text-anchor="middle">CollectionChanged</text>

  <rect class="thread" x="440" y="56" width="290" height="98" rx="6" />
  <text class="code-sm" x="585" y="76" text-anchor="middle">UI thread (Dispatcher)</text>
  <rect class="box-ng" x="460" y="88" width="250" height="46" rx="5" />
  <text class="code" x="585" y="110" text-anchor="middle">CollectionView</text>
  <text class="code-sm ng" x="585" y="126" text-anchor="middle">thread affinity</text>

  <text class="ng" x="746" y="106" font-family="Segoe UI, sans-serif" font-size="17">✕</text>
  <text class="code ng" x="746" y="132">NotSupported</text>

  <!-- ===== 解決方法 ===== -->
  <rect class="lane" x="14" y="188" width="872" height="170" rx="10" />
  <text class="lane-title" x="34" y="214">EnableCollectionSynchronization  /  Dispatcher.Invoke</text>

  <rect class="thread" x="34" y="230" width="240" height="110" rx="6" stroke-dasharray="5 4" />
  <text class="code-sm" x="154" y="250" text-anchor="middle">background thread</text>
  <rect class="box" x="54" y="262" width="200" height="46" rx="5" />
  <text class="code" x="154" y="290" text-anchor="middle">ObservableCollection</text>
  <text class="code-sm ok" x="154" y="328" text-anchor="middle">lock (syncRoot)</text>

  <line x1="286" y1="285" x2="428" y2="285" stroke="#2f9e6e" stroke-width="2.5" marker-end="url(#ar-ok)" />
  <text class="code-sm ok" x="357" y="274" text-anchor="middle">marshalled</text>
  <text class="code-sm ok" x="357" y="303" text-anchor="middle">to UI thread</text>

  <rect class="thread" x="440" y="230" width="290" height="110" rx="6" />
  <text class="code-sm" x="585" y="250" text-anchor="middle">UI thread (Dispatcher)</text>
  <rect class="box-ok" x="460" y="262" width="250" height="46" rx="5" />
  <text class="code" x="585" y="290" text-anchor="middle">CollectionView</text>

  <text class="ok" x="746" y="284" font-family="Segoe UI, sans-serif" font-size="17">✓</text>
  <text class="code ok" x="746" y="310">updated</text>
</svg>
