<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 260" width="831" height="260" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="831" height="260" />
  <text class="title" x="12" y="24">ApplyTheme(ThemeMode.Dark) from a Light app</text>
  <rect class="head" x="12" y="38" width="807" height="30" />
  <text class="cell" x="26" y="57.5">window setup</text>
  <text class="cell" x="486" y="57.5" text-anchor="end">Window.ThemeMode</text>
  <text class="cell" x="608" y="57.5" text-anchor="end">brush before</text>
  <text class="cell" x="722" y="57.5" text-anchor="end">brush after</text>
  <text class="cell" x="805" y="57.5" text-anchor="end">follows</text>
