  <text class="cell" x="486" y="87.5" text-anchor="end">None</text>
  <text class="cell" x="608" y="87.5" text-anchor="end">#E4000000</text>
  <text class="cell" x="722" y="87.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="805" y="87.5" text-anchor="end">yes</text>
  <text class="cell" x="26" y="117.5">Window.ThemeMode=None</text>
