  <text class="cell" x="608" y="117.5" text-anchor="end">#E4000000</text>
  <text class="cell" x="722" y="117.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="805" y="117.5" text-anchor="end">yes</text>
  <text class="cell" x="26" y="147.5">Window.ThemeMode=Light</text>
  <text class="cell" x="486" y="147.5" text-anchor="end">None</text>
  <text class="cell" x="608" y="147.5" text-anchor="end">#E4000000</text>
  <text class="cell" x="722" y="147.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="805" y="147.5" text-anchor="end">yes</text>
  <text class="cell" x="26" y="177.5">Fluent.Light.xaml in Window.Resources</text>
  <text class="cell" x="486" y="177.5" text-anchor="end">None</text>
  <text class="cell" x="608" y="177.5" text-anchor="end">#E4000000</text>
  <text class="cell" x="722" y="177.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="805" y="177.5" text-anchor="end">yes</text>
  <text class="cell" x="26" y="207.5">Fluent.Light.xaml in App resources</text>
  <text class="cell" x="486" y="207.5" text-anchor="end">None</text>
  <text class="cell" x="608" y="207.5" text-anchor="end">#E4000000</text>
  <text class="cell" x="722" y="207.5" text-anchor="end">#FFFFFFFF</text>
  <text class="cell" x="805" y="207.5" text-anchor="end">yes</text>
  <text class="cell" x="26" y="237.5">Fluent.Light.xaml nested in Styles.xaml</text>
  <text class="cell" x="486" y="237.5" text-anchor="end">None</text>
  <text class="cell" x="608" y="237.5" text-anchor="end">#E4000000</text>
  <text class="cell" x="722" y="237.5" text-anchor="end">#E4000000</text>
  <text class="cell" x="805" y="237.5" text-anchor="end">no</text>
