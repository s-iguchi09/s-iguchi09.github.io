<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 607 410" width="607" height="410" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
