  <text class="cell" x="522" y="267.5" text-anchor="end">[1, 2, 3]</text>
  <text class="cell" x="581" y="267.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="297.5">Numbers.SkipLast(0)</text>
  <text class="cell" x="352" y="297.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="522" y="297.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="581" y="297.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="327.5">Numbers.SkipLast(10)</text>
