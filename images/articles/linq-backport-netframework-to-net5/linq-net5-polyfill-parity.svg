  <rect class="bg" x="0" y="0" width="607" height="410" />
  <text class="title" x="12" y="24">polyfill on net48 vs built-in on net10.0 — same source, same driver</text>
  <rect class="head" x="12" y="38" width="583" height="30" />
  <text class="cell" x="26" y="57.5">expression</text>
  <text class="cell" x="352" y="57.5" text-anchor="end">net10.0 (built-in)</text>
  <text class="cell" x="522" y="57.5" text-anchor="end">net48 (polyfill)</text>
  <text class="cell" x="581" y="57.5" text-anchor="end"></text>
  <text class="cell" x="26" y="87.5">Numbers.Append(6)</text>
  <text class="cell" x="352" y="87.5" text-anchor="end">[1, 2, 3, 4, 5, 6]</text>
  <text class="cell" x="522" y="87.5" text-anchor="end">[1, 2, 3, 4, 5, 6]</text>
  <text class="cell" x="581" y="87.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="117.5">Numbers.Prepend(0)</text>
  <text class="cell" x="352" y="117.5" text-anchor="end">[0, 1, 2, 3, 4, 5]</text>
  <text class="cell" x="522" y="117.5" text-anchor="end">[0, 1, 2, 3, 4, 5]</text>
  <text class="cell" x="581" y="117.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="147.5">Numbers.TakeLast(2)</text>
  <text class="cell" x="352" y="147.5" text-anchor="end">[4, 5]</text>
  <text class="cell" x="522" y="147.5" text-anchor="end">[4, 5]</text>
  <text class="cell" x="581" y="147.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="177.5">Numbers.TakeLast(0)</text>
  <text class="cell" x="352" y="177.5" text-anchor="end">[]</text>
  <text class="cell" x="522" y="177.5" text-anchor="end">[]</text>
  <text class="cell" x="581" y="177.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="207.5">Numbers.TakeLast(10)</text>
  <text class="cell" x="352" y="207.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="522" y="207.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="581" y="207.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="237.5">Numbers.TakeLast(-1)</text>
  <text class="cell" x="352" y="237.5" text-anchor="end">[]</text>
  <text class="cell" x="522" y="237.5" text-anchor="end">[]</text>
  <text class="cell" x="581" y="237.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="267.5">Numbers.SkipLast(2)</text>
