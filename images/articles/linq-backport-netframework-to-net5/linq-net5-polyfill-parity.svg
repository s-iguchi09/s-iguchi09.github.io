<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 615 440" width="615" height="440" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="615" height="440" />
  <text class="title" x="12" y="24">polyfill on net48 vs built-in on net10.0 — same source, same driver</text>
  <rect class="head" x="12" y="38" width="591" height="30" />
  <text class="cell" x="26" y="57.5">expression</text>
  <text class="cell" x="360" y="57.5" text-anchor="end">net10.0 (built-in)</text>
  <text class="cell" x="529" y="57.5" text-anchor="end">net48 (polyfill)</text>
  <text class="cell" x="589" y="57.5" text-anchor="end"></text>
  <text class="cell" x="26" y="87.5">Numbers.Append(6)</text>
  <text class="cell" x="360" y="87.5" text-anchor="end">[1, 2, 3, 4, 5, 6]</text>
  <text class="cell" x="529" y="87.5" text-anchor="end">[1, 2, 3, 4, 5, 6]</text>
  <text class="cell" x="589" y="87.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="117.5">Numbers.Prepend(0)</text>
  <text class="cell" x="360" y="117.5" text-anchor="end">[0, 1, 2, 3, 4, 5]</text>
  <text class="cell" x="529" y="117.5" text-anchor="end">[0, 1, 2, 3, 4, 5]</text>
  <text class="cell" x="589" y="117.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="147.5">Numbers.TakeLast(2)</text>
  <text class="cell" x="360" y="147.5" text-anchor="end">[4, 5]</text>
  <text class="cell" x="529" y="147.5" text-anchor="end">[4, 5]</text>
  <text class="cell" x="589" y="147.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="177.5">Numbers.TakeLast(0)</text>
  <text class="cell" x="360" y="177.5" text-anchor="end">[]</text>
  <text class="cell" x="529" y="177.5" text-anchor="end">[]</text>
  <text class="cell" x="589" y="177.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="207.5">Numbers.TakeLast(10)</text>
  <text class="cell" x="360" y="207.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="529" y="207.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="589" y="207.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="237.5">Numbers.TakeLast(-1)</text>
  <text class="cell" x="360" y="237.5" text-anchor="end">[]</text>
  <text class="cell" x="529" y="237.5" text-anchor="end">[]</text>
  <text class="cell" x="589" y="237.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="267.5">Numbers.SkipLast(2)</text>
  <text class="cell" x="360" y="267.5" text-anchor="end">[1, 2, 3]</text>
  <text class="cell" x="529" y="267.5" text-anchor="end">[1, 2, 3]</text>
  <text class="cell" x="589" y="267.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="297.5">Numbers.SkipLast(0)</text>
  <text class="cell" x="360" y="297.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="529" y="297.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="589" y="297.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="327.5">Numbers.SkipLast(10)</text>
  <text class="cell" x="360" y="327.5" text-anchor="end">[]</text>
  <text class="cell" x="529" y="327.5" text-anchor="end">[]</text>
  <text class="cell" x="589" y="327.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="357.5">Numbers.SkipLast(-1)</text>
  <text class="cell" x="360" y="357.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="529" y="357.5" text-anchor="end">[1, 2, 3, 4, 5]</text>
  <text class="cell" x="589" y="357.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="387.5">empty.TakeLast(2)</text>
  <text class="cell" x="360" y="387.5" text-anchor="end">[]</text>
  <text class="cell" x="529" y="387.5" text-anchor="end">[]</text>
  <text class="cell" x="589" y="387.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="417.5">SkipLast(0) is source</text>
  <text class="cell" x="360" y="417.5" text-anchor="end">False</text>
  <text class="cell" x="529" y="417.5" text-anchor="end">False</text>
  <text class="cell" x="589" y="417.5" text-anchor="end">same</text>
