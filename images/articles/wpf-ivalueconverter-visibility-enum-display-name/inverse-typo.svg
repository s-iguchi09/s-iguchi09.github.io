  <line class="line" x1="12" y1="188" x2="1198" y2="188" />
  <line class="line" x1="12" y1="38" x2="12" y2="188" />
  <line class="line" x1="692" y1="38" x2="692" y2="188" />
  <line class="line" x1="1198" y1="38" x2="1198" y2="188" />
</svg>
