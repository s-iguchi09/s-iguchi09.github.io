<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 200" width="1210" height="200" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1210" height="200" />
  <text class="title" x="12" y="24">A misspelled value in each way of inverting</text>
  <rect class="head" x="12" y="38" width="1186" height="30" />
  <text class="cell" x="26" y="57.5">XAML</text>
  <text class="cell" x="1184" y="57.5" text-anchor="end">result</text>
  <text class="cell" x="26" y="87.5">Converter={StaticResource StringParameterBoolToVisibility}, ConverterParameter=True</text>
  <text class="cell" x="1184" y="87.5" text-anchor="end">no exception; IsBusy=True → Collapsed, IsBusy=False → Visible</text>
  <text class="cell" x="26" y="117.5">Converter={StaticResource StringParameterBoolToVisibility}, ConverterParameter=Ture</text>
  <text class="cell" x="1184" y="117.5" text-anchor="end">no exception; IsBusy=True → Visible, IsBusy=False → Collapsed</text>
  <text class="cell" x="26" y="147.5">&lt;local:BoolToVisibilityConverter x:Key="BoolToHidden" FalseValue="Hidden" /&gt;</text>
  <text class="cell" x="1184" y="147.5" text-anchor="end">no exception from XamlReader.Parse</text>
  <text class="cell" x="26" y="177.5">&lt;local:BoolToVisibilityConverter x:Key="BoolToHidden" FalseValue="Hiden" /&gt;</text>
  <text class="cell" x="1184" y="177.5" text-anchor="end">XamlParseException from XamlReader.Parse</text>
