<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 779 230" width="779" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="779" height="230" />
  <text class="title" x="12" y="24">ComboBox with the converter in its ItemTemplate</text>
  <rect class="head" x="12" y="38" width="755" height="30" />
  <text class="cell" x="26" y="57.5">what is read</text>
  <text class="cell" x="753" y="57.5" text-anchor="end">value</text>
  <text class="cell" x="26" y="87.5">selection box text (Status = AwaitingPayment)</text>
  <text class="cell" x="753" y="87.5" text-anchor="end">"Awaiting payment"</text>
  <text class="cell" x="26" y="117.5">item texts in the drop-down</text>
  <text class="cell" x="753" y="117.5" text-anchor="end">"Awaiting payment", "In progress", "Shipped"</text>
  <text class="cell" x="26" y="147.5">Status after selecting the second item</text>
  <text class="cell" x="753" y="147.5" text-anchor="end">InProgress</text>
  <text class="cell" x="26" y="177.5">type of SelectedItem</text>
  <text class="cell" x="753" y="177.5" text-anchor="end">OrderStatus</text>
  <text class="cell" x="26" y="207.5">selection box text after that</text>
  <text class="cell" x="753" y="207.5" text-anchor="end">"In progress"</text>
  <line class="line" x1="12" y1="38" x2="767" y2="38" />
  <line class="line" x1="12" y1="68" x2="767" y2="68" />
  <line class="line" x1="12" y1="98" x2="767" y2="98" />
  <line class="line" x1="12" y1="128" x2="767" y2="128" />
  <line class="line" x1="12" y1="158" x2="767" y2="158" />
  <line class="line" x1="12" y1="188" x2="767" y2="188" />
  <line class="line" x1="12" y1="218" x2="767" y2="218" />
  <line class="line" x1="12" y1="38" x2="12" y2="218" />
  <line class="line" x1="393" y1="38" x2="393" y2="218" />
  <line class="line" x1="767" y1="38" x2="767" y2="218" />
</svg>
