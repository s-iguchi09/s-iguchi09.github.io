<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003 170" width="1003" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1003" height="170" />
  <text class="title" x="12" y="24">Text after Status changes from AwaitingPayment to Shipped</text>
  <rect class="head" x="12" y="38" width="979" height="30" />
  <text class="cell" x="26" y="57.5">display</text>
  <text class="cell" x="808" y="57.5" text-anchor="end">Text before</text>
  <text class="cell" x="977" y="57.5" text-anchor="end">Text after</text>
  <text class="cell" x="26" y="87.5">converter: Text="{Binding Status, Converter={StaticResource EnumDescription}}"</text>
  <text class="cell" x="808" y="87.5" text-anchor="end">"Awaiting payment"</text>
  <text class="cell" x="977" y="87.5" text-anchor="end">"Shipped"</text>
  <text class="cell" x="26" y="117.5">view model: StatusText, also notified in the Status setter</text>
  <text class="cell" x="808" y="117.5" text-anchor="end">"Awaiting payment"</text>
  <text class="cell" x="977" y="117.5" text-anchor="end">"Shipped"</text>
  <text class="cell" x="26" y="147.5">view model: StatusText, not notified</text>
  <text class="cell" x="808" y="147.5" text-anchor="end">"Awaiting payment"</text>
  <text class="cell" x="977" y="147.5" text-anchor="end">"Awaiting payment"</text>
  <line class="line" x1="12" y1="38" x2="991" y2="38" />
  <line class="line" x1="12" y1="68" x2="991" y2="68" />
  <line class="line" x1="12" y1="98" x2="991" y2="98" />
  <line class="line" x1="12" y1="128" x2="991" y2="128" />
  <line class="line" x1="12" y1="158" x2="991" y2="158" />
  <line class="line" x1="12" y1="38" x2="12" y2="158" />
  <line class="line" x1="652" y1="38" x2="652" y2="158" />
  <line class="line" x1="822" y1="38" x2="822" y2="158" />
  <line class="line" x1="991" y1="38" x2="991" y2="158" />
</svg>
