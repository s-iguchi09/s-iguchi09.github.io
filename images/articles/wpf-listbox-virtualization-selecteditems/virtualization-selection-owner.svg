<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img">
  <defs>
    <style>
      .lane { fill: #f5f7fb; stroke: #e1e7f0; stroke-width: 1; }
      .box { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.5; }
      .box-gone { fill: #ffffff; stroke: #e0c4c4; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .box-keep { fill: #f1f9f5; stroke: #9dd3b8; stroke-width: 1.5; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; fill: #1f2933; }
      .code-sm { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
      .lane-title { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #2563eb; }
      .ng { fill: #d64545; }
      .ok { fill: #2f9e6e; }
    </style>
    <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a3" />
    </marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e6e" />
    </marker>
  </defs>

  <!-- ===== 選択状態をコンテナが持つ場合 ===== -->
  <rect class="lane" x="14" y="14" width="812" height="140" rx="10" />
  <text class="lane-title" x="34" y="40">ListBoxItem.IsSelected</text>

  <rect class="box" x="40" y="58" width="210" height="72" rx="6" />
  <text class="code" x="145" y="84" text-anchor="middle">ListBoxItem</text>
  <text class="code-sm" x="145" y="105" text-anchor="middle" fill="#2563eb">IsSelected = true</text>

  <line x1="262" y1="94" x2="418" y2="94" stroke="#8a93a3" stroke-width="2" marker-end="url(#a-muted)" />
  <text class="code-sm" x="340" y="83" text-anchor="middle">VirtualizingStackPanel</text>
  <text class="code-sm" x="340" y="113" text-anchor="middle">scroll out</text>

  <rect class="box-gone" x="430" y="58" width="210" height="72" rx="6" />
  <text class="code" x="535" y="84" text-anchor="middle" fill="#8a93a3">ListBoxItem</text>
  <text class="code-sm" x="535" y="105" text-anchor="middle" fill="#d64545">recycled</text>

  <text class="ng" x="672" y="92" font-family="Segoe UI, sans-serif" font-size="17">✕</text>
  <text class="code ng" x="694" y="91">SelectedItems</text>
  <text class="code-sm ng" x="694" y="110">state lost</text>

  <!-- ===== 選択状態をデータが持つ場合 ===== -->
  <rect class="lane" x="14" y="168" width="812" height="148" rx="10" />
  <text class="lane-title" x="34" y="194">RowItemViewModel.IsSelected</text>

  <rect class="box-keep" x="40" y="212" width="210" height="80" rx="6" />
  <text class="code" x="145" y="238" text-anchor="middle">RowItemViewModel</text>
  <text class="code-sm" x="145" y="259" text-anchor="middle" fill="#2f9e6e">IsSelected = true</text>
  <text class="code-sm" x="145" y="277" text-anchor="middle">kept in data</text>

  <line x1="262" y1="252" x2="418" y2="252" stroke="#2f9e6e" stroke-width="2" marker-end="url(#a-green)" />
  <line x1="418" y1="266" x2="262" y2="266" stroke="#2f9e6e" stroke-width="2" marker-end="url(#a-green)" />
  <text class="code-sm ok" x="340" y="241" text-anchor="middle">ItemContainerStyle</text>
  <text class="code-sm ok" x="340" y="288" text-anchor="middle">Mode=TwoWay</text>

  <rect class="box-gone" x="430" y="212" width="210" height="80" rx="6" />
  <text class="code" x="535" y="238" text-anchor="middle" fill="#8a93a3">ListBoxItem</text>
  <text class="code-sm" x="535" y="259" text-anchor="middle">recycled</text>
  <text class="code-sm" x="535" y="277" text-anchor="middle" fill="#2f9e6e">re-bound from data</text>

  <text class="ok" x="672" y="248" font-family="Segoe UI, sans-serif" font-size="17">✓</text>
  <text class="code ok" x="694" y="247">SelectedItems</text>
  <text class="code-sm ok" x="694" y="266">state kept</text>
</svg>
