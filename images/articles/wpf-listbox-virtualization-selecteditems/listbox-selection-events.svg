<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1215 230" width="1215" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1215" height="230" />
  <text class="title" x="12" y="24">ListBox, 10,000 items, virtualized: when SelectionChanged is raised</text>
  <rect class="head" x="12" y="38" width="1191" height="30" />
  <text class="cell" x="26" y="57.5"></text>
  <text class="cell" x="501" y="57.5" text-anchor="end"></text>
  <text class="cell" x="1189" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">both</text>
  <text class="cell" x="501" y="87.5" text-anchor="end">SelectAll(), then PageDown x10</text>
  <text class="cell" x="1189" y="87.5" text-anchor="end">SelectionChanged 0 (added 0, removed 0)</text>
  <text class="cell" x="26" y="117.5">both</text>
  <text class="cell" x="501" y="117.5" text-anchor="end">Row 5001.IsSelected = true (off screen)</text>
  <text class="cell" x="1189" y="117.5" text-anchor="end">SelectedItems 0, SelectionChanged 0 (added 0, removed 0)</text>
  <text class="cell" x="26" y="147.5">both</text>
  <text class="cell" x="501" y="147.5" text-anchor="end">then ScrollIntoView(Row 5001)</text>
  <text class="cell" x="1189" y="147.5" text-anchor="end">SelectedItems 1, SelectionChanged 1 (added 1, removed 0)</text>
  <text class="cell" x="26" y="177.5">SelectionChanged</text>
  <text class="cell" x="501" y="177.5" text-anchor="end">Row 1 selected, then Shift+End</text>
  <text class="cell" x="1189" y="177.5" text-anchor="end">SelectedItems 10,000, IsSelected 10,000, SelectionChanged 1 (added 9,999, removed 0)</text>
  <text class="cell" x="26" y="207.5">ItemContainerStyle</text>
  <text class="cell" x="501" y="207.5" text-anchor="end">Row 1 selected, then Shift+End</text>
  <text class="cell" x="1189" y="207.5" text-anchor="end">SelectedItems 10,000, IsSelected 31, SelectionChanged 1 (added 9,999, removed 0)</text>
  <line class="line" x1="12" y1="38" x2="1203" y2="38" />
  <line class="line" x1="12" y1="68" x2="1203" y2="68" />
  <line class="line" x1="12" y1="98" x2="1203" y2="98" />
