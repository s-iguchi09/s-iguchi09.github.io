  <line class="line" x1="12" y1="218" x2="1203" y2="218" />
  <line class="line" x1="12" y1="38" x2="12" y2="218" />
  <line class="line" x1="181" y1="38" x2="181" y2="218" />
  <line class="line" x1="515" y1="38" x2="515" y2="218" />
  <line class="line" x1="1203" y1="38" x2="1203" y2="218" />
