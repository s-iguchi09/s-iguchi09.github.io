<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 587 230" width="587" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="587" height="230" />
  <text class="title" x="12" y="24">ContentPresenter whose TemplatedParent is the control itself</text>
  <rect class="head" x="12" y="38" width="563" height="30" />
  <text class="cell" x="26" y="57.5">control</text>
  <text class="cell" x="250" y="57.5" text-anchor="end">count</text>
  <text class="cell" x="561" y="57.5" text-anchor="end">name = RecognizesAccessKey</text>
  <text class="cell" x="26" y="87.5">GroupBox</text>
  <text class="cell" x="250" y="87.5" text-anchor="end">2</text>
  <text class="cell" x="561" y="87.5" text-anchor="end">(unnamed)=True  (unnamed)=False</text>
  <text class="cell" x="26" y="117.5">Expander</text>
  <text class="cell" x="250" y="117.5" text-anchor="end">1</text>
  <text class="cell" x="561" y="117.5" text-anchor="end">ExpandSite=False</text>
  <text class="cell" x="26" y="147.5">TabItem</text>
  <text class="cell" x="250" y="147.5" text-anchor="end">1</text>
  <text class="cell" x="561" y="147.5" text-anchor="end">contentPresenter=True</text>
  <text class="cell" x="26" y="177.5">MenuItem (top level)</text>
  <text class="cell" x="250" y="177.5" text-anchor="end">2</text>
  <text class="cell" x="561" y="177.5" text-anchor="end">Icon=False  (unnamed)=True</text>
  <text class="cell" x="26" y="207.5">MenuItem (submenu)</text>
  <text class="cell" x="250" y="207.5" text-anchor="end">2</text>
  <text class="cell" x="561" y="207.5" text-anchor="end">Icon=False  menuHeaderContainer=True</text>
