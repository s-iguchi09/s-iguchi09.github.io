<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 320" width="890" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="890" height="320" />
  <text class="title" x="12" y="24">polyfill on net48 vs built-in on net10.0 — same source, same driver</text>
  <rect class="head" x="12" y="38" width="866" height="30" />
  <text class="cell" x="26" y="57.5">expression</text>
  <text class="cell" x="517" y="57.5" text-anchor="end">net10.0 (built-in)</text>
  <text class="cell" x="804" y="57.5" text-anchor="end">net48 (polyfill)</text>
  <text class="cell" x="864" y="57.5" text-anchor="end"></text>
  <text class="cell" x="26" y="87.5">Pairs.ToDictionary()</text>
  <text class="cell" x="517" y="87.5" text-anchor="end">[[apple, 2], [fig, 3], [pear, 1]]</text>
  <text class="cell" x="804" y="87.5" text-anchor="end">[[apple, 2], [fig, 3], [pear, 1]]</text>
  <text class="cell" x="864" y="87.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="117.5">Tuples.ToDictionary()</text>
  <text class="cell" x="517" y="117.5" text-anchor="end">[[apple, 2], [fig, 3], [pear, 1]]</text>
  <text class="cell" x="804" y="117.5" text-anchor="end">[[apple, 2], [fig, 3], [pear, 1]]</text>
  <text class="cell" x="864" y="117.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="147.5">Pairs.ToDictionary(cmp)</text>
  <text class="cell" x="517" y="147.5" text-anchor="end">[[apple, 2], [fig, 3], [pear, 1]]</text>
  <text class="cell" x="804" y="147.5" text-anchor="end">[[apple, 2], [fig, 3], [pear, 1]]</text>
  <text class="cell" x="864" y="147.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="177.5">Tuples.ToDictionary(cmp)</text>
  <text class="cell" x="517" y="177.5" text-anchor="end">[[apple, 2], [fig, 3], [pear, 1]]</text>
  <text class="cell" x="804" y="177.5" text-anchor="end">[[apple, 2], [fig, 3], [pear, 1]]</text>
  <text class="cell" x="864" y="177.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="207.5">duplicate key</text>
  <text class="cell" x="517" y="207.5" text-anchor="end">throws ArgumentException</text>
  <text class="cell" x="804" y="207.5" text-anchor="end">throws ArgumentException</text>
  <text class="cell" x="864" y="207.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="237.5">case variants, ordinal</text>
  <text class="cell" x="517" y="237.5" text-anchor="end">[[pear, 1], [PEAR, 2]]</text>
  <text class="cell" x="804" y="237.5" text-anchor="end">[[pear, 1], [PEAR, 2]]</text>
  <text class="cell" x="864" y="237.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="267.5">case variants, ignore case</text>
  <text class="cell" x="517" y="267.5" text-anchor="end">throws ArgumentException</text>
  <text class="cell" x="804" y="267.5" text-anchor="end">throws ArgumentException</text>
  <text class="cell" x="864" y="267.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="297.5">empty.ToDictionary()</text>
  <text class="cell" x="517" y="297.5" text-anchor="end">[]</text>
  <text class="cell" x="804" y="297.5" text-anchor="end">[]</text>
  <text class="cell" x="864" y="297.5" text-anchor="end">same</text>
  <line class="line" x1="12" y1="38" x2="878" y2="38" />
  <line class="line" x1="12" y1="68" x2="878" y2="68" />
