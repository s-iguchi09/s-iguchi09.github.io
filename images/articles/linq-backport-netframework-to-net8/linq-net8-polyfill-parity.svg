  <line class="line" x1="12" y1="278" x2="878" y2="278" />
  <line class="line" x1="12" y1="308" x2="878" y2="308" />
  <line class="line" x1="12" y1="38" x2="12" y2="308" />
  <line class="line" x1="244" y1="38" x2="244" y2="308" />
  <line class="line" x1="531" y1="38" x2="531" y2="308" />
