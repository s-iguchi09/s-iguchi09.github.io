  <text class="cell" x="533" y="87.5" text-anchor="end">(empty)</text>
  <text class="cell" x="679" y="87.5" text-anchor="end">PageViewModel</text>
  <text class="cell" x="26" y="117.5">RelativeSource Self (on the inner element)</text>
  <text class="cell" x="533" y="117.5" text-anchor="end">(empty)</text>
  <text class="cell" x="679" y="117.5" text-anchor="end">PageViewModel</text>
  <text class="cell" x="26" y="147.5">RelativeSource AncestorType=UserControl</text>
  <text class="cell" x="533" y="147.5" text-anchor="end">from InfoCard.Title</text>
  <text class="cell" x="679" y="147.5" text-anchor="end">PageViewModel</text>
