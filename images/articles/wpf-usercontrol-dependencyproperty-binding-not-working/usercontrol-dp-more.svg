<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 951 470" width="951" height="470" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="951" height="470" />
  <text class="title" x="12" y="24">the other measured runs in this article</text>
  <rect class="head" x="12" y="38" width="927" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="925" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">caller Title={Binding HeaderText}, inner {Binding Title}</text>
  <text class="cell" x="925" y="87.5" text-anchor="end">Title from PageViewModel, inner (empty); Error 40 x1</text>
  <text class="cell" x="26" y="117.5">caller's view model also has Title</text>
  <text class="cell" x="925" y="117.5" text-anchor="end">Title VM-TITLE, inner VM-OWN-TITLE; 0 errors</text>
  <text class="cell" x="26" y="147.5">parent without DataContext, Title set</text>
  <text class="cell" x="925" y="147.5" text-anchor="end">inner (empty); 0 errors</text>
  <text class="cell" x="26" y="177.5">DataContext delegated to the inner Grid</text>
  <text class="cell" x="925" y="177.5" text-anchor="end">inner sees InfoCard, card keeps PageViewModel; 0 errors</text>
  <text class="cell" x="26" y="207.5">delegated, DataContext.HeaderText via AncestorType</text>
  <text class="cell" x="925" y="207.5" text-anchor="end">from PageViewModel; 0 errors</text>
  <text class="cell" x="26" y="237.5">BindsTwoWayByDefault, type xyz inside</text>
  <text class="cell" x="925" y="237.5" text-anchor="end">HeaderText xyz; 0 errors</text>
  <text class="cell" x="26" y="267.5">DataContext = this, caller binds Title</text>
  <text class="cell" x="925" y="267.5" text-anchor="end">Title (unset); Error 40 x1</text>
  <text class="cell" x="26" y="297.5">DataContext = this, caller's DataContext lacks Title</text>
  <text class="cell" x="925" y="297.5" text-anchor="end">inner (empty); Error 40 x1</text>
  <text class="cell" x="26" y="327.5">DataContext = this, caller's DataContext has Title</text>
  <text class="cell" x="925" y="327.5" text-anchor="end">inner from Detail.Title; 0 errors</text>
  <text class="cell" x="26" y="357.5">caller OneWay, inside Title = x</text>
  <text class="cell" x="925" y="357.5" text-anchor="end">binding removed; HeaderText=new -&gt; Title x; 0 errors</text>
  <text class="cell" x="26" y="387.5">caller OneWay, inside inner TwoWay write-back</text>
  <text class="cell" x="925" y="387.5" text-anchor="end">binding removed; HeaderText=new -&gt; Title x; 0 errors</text>
  <text class="cell" x="26" y="417.5">caller OneWay, inside SetCurrentValue</text>
  <text class="cell" x="925" y="417.5" text-anchor="end">binding kept; HeaderText=new -&gt; Title new; 0 errors</text>
  <text class="cell" x="26" y="447.5">caller also names an element Root</text>
  <text class="cell" x="925" y="447.5" text-anchor="end">inside -&gt; the card, caller -&gt; caller's Root; 0 errors</text>
