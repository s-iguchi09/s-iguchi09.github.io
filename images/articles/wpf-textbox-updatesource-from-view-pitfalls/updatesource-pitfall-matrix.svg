<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 858 320" width="858" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="858" height="320" />
  <text class="title" x="12" y="24">GetBindingExpression() and UpdateSource()</text>
  <rect class="head" x="12" y="38" width="834" height="30" />
  <text class="cell" x="26" y="57.5">how Text is set</text>
  <text class="cell" x="423" y="57.5" text-anchor="end">GetBindingExpression</text>
  <text class="cell" x="608" y="57.5" text-anchor="end">UpdateSource() as-is</text>
  <text class="cell" x="832" y="57.5" text-anchor="end">after editing Text</text>
  <text class="cell" x="26" y="87.5">Text="literal"</text>
  <text class="cell" x="423" y="87.5" text-anchor="end">null</text>
  <text class="cell" x="608" y="87.5" text-anchor="end">cannot call</text>
  <text class="cell" x="832" y="87.5" text-anchor="end">cannot call</text>
  <text class="cell" x="26" y="117.5">MultiBinding</text>
  <text class="cell" x="423" y="117.5" text-anchor="end">null</text>
  <text class="cell" x="608" y="117.5" text-anchor="end">cannot call</text>
  <text class="cell" x="832" y="117.5" text-anchor="end">cannot call</text>
  <text class="cell" x="26" y="147.5">TemplateBinding</text>
  <text class="cell" x="423" y="147.5" text-anchor="end">null</text>
  <text class="cell" x="608" y="147.5" text-anchor="end">cannot call</text>
  <text class="cell" x="832" y="147.5" text-anchor="end">cannot call</text>
  <text class="cell" x="26" y="177.5">Binding Mode=OneTime</text>
  <text class="cell" x="423" y="177.5" text-anchor="end">obtained</text>
  <text class="cell" x="608" y="177.5" text-anchor="end">no change</text>
  <text class="cell" x="832" y="177.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="26" y="207.5">Binding Mode=OneWay</text>
  <text class="cell" x="423" y="207.5" text-anchor="end">obtained</text>
  <text class="cell" x="608" y="207.5" text-anchor="end">no change</text>
  <text class="cell" x="832" y="207.5" text-anchor="end">InvalidOperationException</text>
  <text class="cell" x="26" y="237.5">Binding Mode=OneWayToSource</text>
  <text class="cell" x="423" y="237.5" text-anchor="end">obtained</text>
  <text class="cell" x="608" y="237.5" text-anchor="end">no change</text>
  <text class="cell" x="832" y="237.5" text-anchor="end">source updated</text>
  <text class="cell" x="26" y="267.5">Binding Mode=TwoWay</text>
  <text class="cell" x="423" y="267.5" text-anchor="end">obtained</text>
  <text class="cell" x="608" y="267.5" text-anchor="end">no change</text>
  <text class="cell" x="832" y="267.5" text-anchor="end">source updated</text>
  <text class="cell" x="26" y="297.5">TwoWay, then ClearBinding</text>
  <text class="cell" x="423" y="297.5" text-anchor="end">obtained</text>
  <text class="cell" x="608" y="297.5" text-anchor="end">-</text>
  <text class="cell" x="832" y="297.5" text-anchor="end">InvalidOperationException</text>
