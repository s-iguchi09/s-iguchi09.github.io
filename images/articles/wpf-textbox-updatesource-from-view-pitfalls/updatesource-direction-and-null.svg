<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 412" width="820" height="412" role="img">
  <defs>
    <style>
      .lane { fill: #f5f7fb; stroke: #e1e7f0; stroke-width: 1; }
      .box { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.5; }
      .chip { fill: #ffffff; stroke: #e0c4c4; stroke-width: 1.5; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .code-sm { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; fill: #5b6673; }
      .lane-title { font-family: Consolas, "Courier New", monospace; font-size: 13.5px; fill: #2563eb; }
      .lane-title-ng { font-family: Consolas, "Courier New", monospace; font-size: 13.5px; fill: #d64545; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- ============ UpdateSource(): ターゲット → ソース ============ -->
  <rect class="lane" x="14" y="14" width="792" height="118" rx="10" />
  <text class="lane-title" x="34" y="40">UpdateSource()</text>

  <rect class="box" x="40" y="58" width="200" height="46" rx="6" />
  <text class="code" x="140" y="79" text-anchor="middle">TextBox.Text</text>
  <text class="code-sm" x="140" y="95" text-anchor="middle">target</text>

  <line x1="252" y1="81" x2="486" y2="81" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text class="code-sm" x="369" y="70" text-anchor="middle" fill="#2563eb">Mode = TwoWay | OneWayToSource</text>

  <rect class="box" x="498" y="58" width="230" height="46" rx="6" />
  <text class="code" x="613" y="79" text-anchor="middle">ViewModel.Amount</text>
  <text class="code-sm" x="613" y="95" text-anchor="middle">source</text>

  <text class="code-sm" x="369" y="99" text-anchor="middle">OneWay / OneTime = no-op</text>

  <!-- ============ UpdateTarget(): ソース → ターゲット ============ -->
  <rect class="lane" x="14" y="146" width="792" height="118" rx="10" />
  <text class="lane-title" x="34" y="172">UpdateTarget()</text>

  <rect class="box" x="40" y="190" width="200" height="46" rx="6" />
  <text class="code" x="140" y="211" text-anchor="middle">TextBox.Text</text>
  <text class="code-sm" x="140" y="227" text-anchor="middle">target</text>

  <line x1="486" y1="213" x2="252" y2="213" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)" />
  <text class="code-sm" x="369" y="202" text-anchor="middle" fill="#2563eb">Mode = TwoWay | OneWay</text>

  <rect class="box" x="498" y="190" width="230" height="46" rx="6" />
  <text class="code" x="613" y="211" text-anchor="middle">ViewModel.Amount</text>
  <text class="code-sm" x="613" y="227" text-anchor="middle">source</text>

  <!-- ============ GetBindingExpression() が null を返す条件 ============ -->
  <rect class="lane" x="14" y="278" width="792" height="120" rx="10" />
  <text class="lane-title-ng" x="34" y="304">GetBindingExpression(TextBox.TextProperty) == null</text>

  <rect class="chip" x="40" y="322" width="228" height="56" rx="6" />
  <text class="code" x="154" y="345" text-anchor="middle">Text="literal"</text>
  <text class="code-sm" x="154" y="364" text-anchor="middle">no binding</text>

  <rect class="chip" x="284" y="322" width="228" height="56" rx="6" />
  <text class="code" x="398" y="345" text-anchor="middle">MultiBinding</text>
  <text class="code-sm" x="398" y="364" text-anchor="middle">GetMultiBindingExpression()</text>

  <rect class="chip" x="528" y="322" width="228" height="56" rx="6" />
  <text class="code" x="642" y="345" text-anchor="middle">{TemplateBinding}</text>
  <text class="code-sm" x="642" y="364" text-anchor="middle">not a BindingExpression</text>
</svg>
