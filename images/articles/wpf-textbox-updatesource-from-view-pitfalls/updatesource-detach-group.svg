<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1046 230" width="1046" height="230" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1046" height="230" />
  <text class="title" x="12" y="24">detached TextBox, UpdateTarget with OneTime, and BindingGroup validation steps</text>
  <rect class="head" x="12" y="38" width="1022" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1020" y="57.5" text-anchor="end">result</text>
  <text class="cell" x="26" y="87.5">TwoWay, TextBox removed from the tree, then UpdateSource()</text>
  <text class="cell" x="1020" y="87.5" text-anchor="end">no exception; Status PathError; source = before</text>
  <text class="cell" x="26" y="117.5">OneTime: source changed, then UpdateTarget()</text>
  <text class="cell" x="1020" y="117.5" text-anchor="end">Text before -&gt; before (no call) -&gt; changed (after UpdateTarget)</text>
  <text class="cell" x="26" y="147.5">BindingGroup.UpdateSources(), no rule</text>
  <text class="cell" x="1020" y="147.5" text-anchor="end">returns True; source = after</text>
  <text class="cell" x="26" y="177.5">BindingGroup.UpdateSources(), rule at RawProposedValue fails</text>
  <text class="cell" x="1020" y="177.5" text-anchor="end">returns False; source = before</text>
  <text class="cell" x="26" y="207.5">BindingGroup.UpdateSources(), rule at UpdatedValue fails</text>
  <text class="cell" x="1020" y="207.5" text-anchor="end">returns False; source = after</text>
  <line class="line" x1="12" y1="38" x2="1034" y2="38" />
  <line class="line" x1="12" y1="68" x2="1034" y2="68" />
  <line class="line" x1="12" y1="98" x2="1034" y2="98" />
  <line class="line" x1="12" y1="128" x2="1034" y2="128" />
  <line class="line" x1="12" y1="158" x2="1034" y2="158" />
  <line class="line" x1="12" y1="188" x2="1034" y2="188" />
  <line class="line" x1="12" y1="218" x2="1034" y2="218" />
  <line class="line" x1="12" y1="38" x2="12" y2="218" />
  <line class="line" x1="511" y1="38" x2="511" y2="218" />
  <line class="line" x1="1034" y1="38" x2="1034" y2="218" />
</svg>
