<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 665 320" width="665" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="665" height="320" />
  <text class="title" x="12" y="24">what StringFormat actually produces</text>
  <rect class="head" x="12" y="38" width="641" height="30" />
  <text class="cell" x="26" y="57.5">binding target and format</text>
  <text class="cell" x="509" y="57.5" text-anchor="end">culture</text>
  <text class="cell" x="639" y="57.5" text-anchor="end">rendered text</text>
  <text class="cell" x="26" y="87.5">FrameworkElement.Language default</text>
  <text class="cell" x="509" y="87.5" text-anchor="end">-</text>
  <text class="cell" x="639" y="87.5" text-anchor="end">en-us</text>
  <text class="cell" x="26" y="117.5">CultureInfo.CurrentCulture</text>
  <text class="cell" x="509" y="117.5" text-anchor="end">-</text>
  <text class="cell" x="639" y="117.5" text-anchor="end">ja-JP</text>
  <text class="cell" x="26" y="147.5">TextBlock.Text, C</text>
  <text class="cell" x="509" y="147.5" text-anchor="end">no ConverterCulture</text>
  <text class="cell" x="639" y="147.5" text-anchor="end">$1,234.50</text>
  <text class="cell" x="26" y="177.5">TextBlock.Text, C</text>
  <text class="cell" x="509" y="177.5" text-anchor="end">ConverterCulture=ja-JP</text>
  <text class="cell" x="639" y="177.5" text-anchor="end">¥1,235</text>
  <text class="cell" x="26" y="207.5">TextBlock.Text, d</text>
  <text class="cell" x="509" y="207.5" text-anchor="end">no ConverterCulture</text>
  <text class="cell" x="639" y="207.5" text-anchor="end">7/17/2026</text>
  <text class="cell" x="26" y="237.5">TextBlock.Text, d</text>
  <text class="cell" x="509" y="237.5" text-anchor="end">ConverterCulture=ja-JP</text>
  <text class="cell" x="639" y="237.5" text-anchor="end">2026/07/17</text>
  <text class="cell" x="26" y="267.5">Label.Content, StringFormat=C</text>
  <text class="cell" x="509" y="267.5" text-anchor="end">-</text>
  <text class="cell" x="639" y="267.5" text-anchor="end">1234.5</text>
  <text class="cell" x="26" y="297.5">Label.Content, ContentStringFormat=C</text>
  <text class="cell" x="509" y="297.5" text-anchor="end">-</text>
  <text class="cell" x="639" y="297.5" text-anchor="end">$1,234.50</text>
  <line class="line" x1="12" y1="38" x2="653" y2="38" />
  <line class="line" x1="12" y1="68" x2="653" y2="68" />
  <line class="line" x1="12" y1="98" x2="653" y2="98" />
  <line class="line" x1="12" y1="128" x2="653" y2="128" />
  <line class="line" x1="12" y1="158" x2="653" y2="158" />
  <line class="line" x1="12" y1="188" x2="653" y2="188" />
  <line class="line" x1="12" y1="218" x2="653" y2="218" />
  <line class="line" x1="12" y1="248" x2="653" y2="248" />
  <line class="line" x1="12" y1="278" x2="653" y2="278" />
  <line class="line" x1="12" y1="308" x2="653" y2="308" />
  <line class="line" x1="12" y1="38" x2="12" y2="308" />
  <line class="line" x1="323" y1="38" x2="323" y2="308" />
  <line class="line" x1="523" y1="38" x2="523" y2="308" />
  <line class="line" x1="653" y1="38" x2="653" y2="308" />
