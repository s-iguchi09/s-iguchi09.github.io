<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 394" width="880" height="394" role="img">
  <defs>
    <style>
      .lane { fill: #f5f7fb; stroke: #e1e7f0; stroke-width: 1; }
      .box { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.5; }
      .code { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .code-sm { font-family: Consolas, "Courier New", monospace; font-size: 11.5px; fill: #5b6673; }
      .lane-title { font-family: Consolas, "Courier New", monospace; font-size: 13.5px; fill: #2563eb; }
      .ng { fill: #d64545; }
      .ok { fill: #2f9e6e; }
      .stroke-ng { stroke: #d64545; }
      .stroke-ok { stroke: #2f9e6e; }
      .stroke-muted { stroke: #8a93a3; }
    </style>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a3" />
    </marker>
    <marker id="arrow-ng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d64545" />
    </marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e6e" />
    </marker>
  </defs>

  <!-- ================= 上段: 既定のキャッシュ動作 ================= -->
  <rect class="lane" x="14" y="14" width="852" height="176" rx="10" />
  <text class="lane-title" x="34" y="42">BitmapCacheOption.Default / OnDemand</text>

  <rect class="box" x="34" y="70" width="132" height="54" rx="6" />
  <text class="code" x="100" y="102" text-anchor="middle">preview.png</text>

  <!-- ファイルストリームを開いたまま保持する -->
  <line class="stroke-ng" x1="172" y1="97" x2="290" y2="97" stroke-width="2.5" marker-end="url(#arrow-ng)" />
  <text class="code-sm ng" x="231" y="86" text-anchor="middle">FileStream</text>
  <g transform="translate(224,104)">
    <path d="M 3.5 6 v -2.5 a 3.5 3.5 0 0 1 7 0 V 6" fill="none" stroke="#d64545" stroke-width="1.6" />
    <rect x="0" y="6" width="14" height="10" rx="2" fill="#d64545" />
  </g>

  <rect class="box" x="296" y="70" width="168" height="54" rx="6" />
  <text class="code" x="380" y="102" text-anchor="middle">BitmapImage</text>

  <!-- 解放のタイミングは GC 任せ -->
  <path class="stroke-muted" d="M 380 130 v 26 H 100 v -22" fill="none" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-muted)" />
  <text class="code-sm" x="240" y="172" text-anchor="middle">GC ?</text>

  <line x1="512" y1="52" x2="512" y2="152" stroke="#d5dce8" stroke-width="1.5" stroke-dasharray="4 4" />

  <rect class="box" x="546" y="70" width="130" height="54" rx="6" />
  <text class="code" x="611" y="102" text-anchor="middle">File.Delete()</text>
  <line class="stroke-ng" x1="682" y1="97" x2="712" y2="97" stroke-width="2.5" marker-end="url(#arrow-ng)" />
  <text class="ng" x="722" y="103" font-family="Segoe UI, sans-serif" font-size="17">✕</text>
  <text class="code ng" x="742" y="102">IOException</text>

  <!-- ================= 下段: OnLoad ================= -->
  <rect class="lane" x="14" y="204" width="852" height="176" rx="10" />
  <text class="lane-title" x="34" y="232">BitmapCacheOption.OnLoad</text>

  <rect class="box" x="34" y="260" width="132" height="54" rx="6" />
  <text class="code" x="100" y="292" text-anchor="middle">preview.png</text>

  <!-- EndInit の完了時点でストリームは閉じられる -->
  <line class="stroke-muted" x1="172" y1="287" x2="290" y2="287" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-muted)" />
  <text class="code-sm" x="231" y="276" text-anchor="middle">FileStream</text>
  <g transform="translate(221,294)">
    <path d="M 10.5 6 v -2.5 a 3.5 3.5 0 0 1 7 0 v 2" fill="none" stroke="#2f9e6e" stroke-width="1.6" />
    <rect x="0" y="6" width="14" height="10" rx="2" fill="#2f9e6e" />
  </g>
  <text class="code-sm ok" x="231" y="332" text-anchor="middle">EndInit()</text>

  <rect class="box" x="296" y="252" width="168" height="70" rx="6" />
  <text class="code" x="380" y="279" text-anchor="middle">BitmapImage</text>
  <rect x="316" y="288" width="128" height="21" rx="3" fill="#eef2fb" stroke="#c8d4ee" stroke-width="1" />
  <text class="code-sm" x="380" y="303" text-anchor="middle" fill="#2563eb">cached in memory</text>

  <line x1="512" y1="242" x2="512" y2="342" stroke="#d5dce8" stroke-width="1.5" stroke-dasharray="4 4" />

  <rect class="box" x="546" y="260" width="130" height="54" rx="6" />
  <text class="code" x="611" y="292" text-anchor="middle">File.Delete()</text>
  <line class="stroke-ok" x1="682" y1="287" x2="712" y2="287" stroke-width="2.5" marker-end="url(#arrow-ok)" />
  <text class="ok" x="722" y="293" font-family="Segoe UI, sans-serif" font-size="17">✓</text>
  <text class="code ok" x="742" y="292">OK</text>
</svg>
