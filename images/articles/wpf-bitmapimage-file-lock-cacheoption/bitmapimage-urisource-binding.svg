<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 170" width="834" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="834" height="170" />
  <text class="title" x="12" y="24">BitmapImage with UriSource="{Binding ImagePath}"</text>
  <rect class="head" x="12" y="38" width="810" height="30" />
  <text class="cell" x="26" y="57.5">where the XAML is loaded</text>
  <text class="cell" x="808" y="57.5" text-anchor="end">result</text>
  <text class="cell" x="26" y="87.5">XamlReader, no DataContext</text>
  <text class="cell" x="808" y="87.5" text-anchor="end">XamlParseException (inner InvalidOperationException)</text>
  <text class="cell" x="26" y="117.5">DataTemplate, DataContext holds a valid path</text>
  <text class="cell" x="808" y="117.5" text-anchor="end">shown: 64x48, UriSource = current ImagePath</text>
  <text class="cell" x="26" y="147.5">then ImagePath changed to a 64x96 image</text>
  <text class="cell" x="808" y="147.5" text-anchor="end">shown: 64x48, UriSource = earlier path</text>
  <line class="line" x1="12" y1="38" x2="822" y2="38" />
  <line class="line" x1="12" y1="68" x2="822" y2="68" />
  <line class="line" x1="12" y1="98" x2="822" y2="98" />
  <line class="line" x1="12" y1="128" x2="822" y2="128" />
  <line class="line" x1="12" y1="158" x2="822" y2="158" />
  <line class="line" x1="12" y1="38" x2="12" y2="158" />
  <line class="line" x1="385" y1="38" x2="385" y2="158" />
  <line class="line" x1="822" y1="38" x2="822" y2="158" />
</svg>
