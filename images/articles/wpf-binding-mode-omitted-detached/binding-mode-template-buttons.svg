  <text class="cell" x="26" y="57.5">element in the template</text>
  <text class="cell" x="580" y="57.5" text-anchor="end">Binding</text>
  <text class="cell" x="663" y="57.5" text-anchor="end">Mode</text>
  <text class="cell" x="809" y="57.5" text-anchor="end">RelativeSource</text>
  <text class="cell" x="26" y="87.5">TreeViewItem: ToggleButton "Expander" IsChecked</text>
  <text class="cell" x="580" y="87.5" text-anchor="end">{Binding IsExpanded}</text>
  <text class="cell" x="663" y="87.5" text-anchor="end">Default</text>
  <text class="cell" x="809" y="87.5" text-anchor="end">TemplatedParent</text>
  <text class="cell" x="26" y="117.5">Expander: ToggleButton "HeaderSite" IsChecked</text>
  <text class="cell" x="580" y="117.5" text-anchor="end">{Binding IsExpanded}</text>
  <text class="cell" x="663" y="117.5" text-anchor="end">TwoWay</text>
  <text class="cell" x="809" y="117.5" text-anchor="end">TemplatedParent</text>
