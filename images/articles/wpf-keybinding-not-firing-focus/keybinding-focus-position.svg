  <text class="cell" x="1739" y="507.5" text-anchor="end">3: outside the element</text>
  <text class="cell" x="2003" y="507.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="507.5" text-anchor="end">none</text>
  <text class="cell" x="26" y="537.5">Ctrl+D</text>
  <text class="cell" x="604" y="537.5" text-anchor="end">UserControl with Focusable="True"</text>
  <text class="cell" x="1173" y="537.5" text-anchor="end">Keyboard.Focus(panel)</text>
  <text class="cell" x="1499" y="537.5" text-anchor="end">UserControl</text>
  <text class="cell" x="1739" y="537.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="537.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="537.5" text-anchor="end">DeleteCommand</text>
  <text class="cell" x="26" y="567.5">Ctrl+D</text>
  <text class="cell" x="604" y="567.5" text-anchor="end">Window (removed from the UserControl)</text>
  <text class="cell" x="1173" y="567.5" text-anchor="end">Keyboard.Focus(titleBox)</text>
  <text class="cell" x="1499" y="567.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1739" y="567.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="567.5" text-anchor="end">raised</text>
