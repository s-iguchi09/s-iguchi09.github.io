<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2182 590" width="2182" height="590" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="2182" height="590" />
  <text class="title" x="12" y="24">Which KeyBinding runs, by where keyboard focus is</text>
  <rect class="head" x="12" y="38" width="2158" height="30" />
  <text class="cell" x="26" y="57.5">key</text>
  <text class="cell" x="604" y="57.5" text-anchor="end">where the KeyBinding is</text>
  <text class="cell" x="1173" y="57.5" text-anchor="end">before pressing the key</text>
  <text class="cell" x="1499" y="57.5" text-anchor="end">keyboard focus when the key is pressed</text>
  <text class="cell" x="1739" y="57.5" text-anchor="end">isolation step that applies</text>
  <text class="cell" x="2003" y="57.5" text-anchor="end">Window's PreviewKeyDown raised</text>
  <text class="cell" x="2156" y="57.5" text-anchor="end">command that ran</text>
  <text class="cell" x="26" y="87.5">Ctrl+S</text>
  <text class="cell" x="604" y="87.5" text-anchor="end">Window</text>
  <text class="cell" x="1173" y="87.5" text-anchor="end">Keyboard.Focus(titleBox)</text>
  <text class="cell" x="1499" y="87.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1739" y="87.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="87.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="87.5" text-anchor="end">SaveCommand</text>
  <text class="cell" x="26" y="117.5">Ctrl+S</text>
  <text class="cell" x="604" y="117.5" text-anchor="end">Window</text>
  <text class="cell" x="1173" y="117.5" text-anchor="end">Keyboard.Focus(okButton)</text>
  <text class="cell" x="1499" y="117.5" text-anchor="end">Button</text>
  <text class="cell" x="1739" y="117.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="117.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="117.5" text-anchor="end">SaveCommand</text>
  <text class="cell" x="26" y="147.5">Ctrl+S</text>
  <text class="cell" x="604" y="147.5" text-anchor="end">Window</text>
  <text class="cell" x="1173" y="147.5" text-anchor="end">show and Activate only</text>
  <text class="cell" x="1499" y="147.5" text-anchor="end">Window</text>
  <text class="cell" x="1739" y="147.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="147.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="147.5" text-anchor="end">SaveCommand</text>
  <text class="cell" x="26" y="177.5">Ctrl+S</text>
  <text class="cell" x="604" y="177.5" text-anchor="end">Window</text>
  <text class="cell" x="1173" y="177.5" text-anchor="end">Keyboard.ClearFocus()</text>
  <text class="cell" x="1499" y="177.5" text-anchor="end">none (Keyboard.FocusedElement is null)</text>
  <text class="cell" x="1739" y="177.5" text-anchor="end">1: no focus</text>
  <text class="cell" x="2003" y="177.5" text-anchor="end">not raised</text>
  <text class="cell" x="2156" y="177.5" text-anchor="end">none</text>
  <text class="cell" x="26" y="207.5">Ctrl+S</text>
  <text class="cell" x="604" y="207.5" text-anchor="end">Window</text>
  <text class="cell" x="1173" y="207.5" text-anchor="end">Keyboard.ClearFocus(), then Keyboard.Focus(window)</text>
  <text class="cell" x="1499" y="207.5" text-anchor="end">Window</text>
  <text class="cell" x="1739" y="207.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="207.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="207.5" text-anchor="end">SaveCommand</text>
  <text class="cell" x="26" y="237.5">Ctrl+S</text>
  <text class="cell" x="604" y="237.5" text-anchor="end">Window</text>
  <text class="cell" x="1173" y="237.5" text-anchor="end">Keyboard.Focus(okButton), then okButton.IsEnabled = false</text>
  <text class="cell" x="1499" y="237.5" text-anchor="end">Window</text>
  <text class="cell" x="1739" y="237.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="237.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="237.5" text-anchor="end">SaveCommand</text>
  <text class="cell" x="26" y="267.5">Ctrl+S</text>
  <text class="cell" x="604" y="267.5" text-anchor="end">Window</text>
  <text class="cell" x="1173" y="267.5" text-anchor="end">Keyboard.Focus(titleBox), then titleBox.Visibility = Collapsed</text>
  <text class="cell" x="1499" y="267.5" text-anchor="end">Window</text>
  <text class="cell" x="1739" y="267.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="267.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="267.5" text-anchor="end">SaveCommand</text>
  <text class="cell" x="26" y="297.5">Ctrl+S</text>
  <text class="cell" x="604" y="297.5" text-anchor="end">Window</text>
  <text class="cell" x="1173" y="297.5" text-anchor="end">focus the TextBox in an owned window</text>
  <text class="cell" x="1499" y="297.5" text-anchor="end">TextBox in the owned window</text>
  <text class="cell" x="1739" y="297.5" text-anchor="end">2: another window</text>
  <text class="cell" x="2003" y="297.5" text-anchor="end">not raised</text>
  <text class="cell" x="2156" y="297.5" text-anchor="end">none</text>
  <text class="cell" x="26" y="327.5">Ctrl+S</text>
  <text class="cell" x="604" y="327.5" text-anchor="end">Window and the owned window</text>
  <text class="cell" x="1173" y="327.5" text-anchor="end">focus the TextBox in an owned window</text>
  <text class="cell" x="1499" y="327.5" text-anchor="end">TextBox in the owned window</text>
  <text class="cell" x="1739" y="327.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="327.5" text-anchor="end">not raised</text>
  <text class="cell" x="2156" y="327.5" text-anchor="end">SaveCommand</text>
  <text class="cell" x="26" y="357.5">Ctrl+S</text>
  <text class="cell" x="604" y="357.5" text-anchor="end">Window and the owned window (no DataContext on the owned window)</text>
  <text class="cell" x="1173" y="357.5" text-anchor="end">focus the TextBox in an owned window</text>
  <text class="cell" x="1499" y="357.5" text-anchor="end">TextBox in the owned window</text>
  <text class="cell" x="1739" y="357.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="357.5" text-anchor="end">not raised</text>
  <text class="cell" x="2156" y="357.5" text-anchor="end">none</text>
  <text class="cell" x="26" y="387.5">Ctrl+D</text>
  <text class="cell" x="604" y="387.5" text-anchor="end">UserControl</text>
  <text class="cell" x="1173" y="387.5" text-anchor="end">Keyboard.Focus(panelBox)</text>
  <text class="cell" x="1499" y="387.5" text-anchor="end">TextBox in the UserControl</text>
  <text class="cell" x="1739" y="387.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="2003" y="387.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="387.5" text-anchor="end">DeleteCommand</text>
  <text class="cell" x="26" y="417.5">Ctrl+D</text>
  <text class="cell" x="604" y="417.5" text-anchor="end">UserControl</text>
  <text class="cell" x="1173" y="417.5" text-anchor="end">Keyboard.Focus(titleBox)</text>
  <text class="cell" x="1499" y="417.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1739" y="417.5" text-anchor="end">3: outside the element</text>
  <text class="cell" x="2003" y="417.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="417.5" text-anchor="end">none</text>
  <text class="cell" x="26" y="447.5">Ctrl+D</text>
  <text class="cell" x="604" y="447.5" text-anchor="end">UserControl</text>
  <text class="cell" x="1173" y="447.5" text-anchor="end">Keyboard.Focus(titleBox), then click the TextBlock in the UserControl</text>
  <text class="cell" x="1499" y="447.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1739" y="447.5" text-anchor="end">3: outside the element</text>
  <text class="cell" x="2003" y="447.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="447.5" text-anchor="end">none</text>
  <text class="cell" x="26" y="477.5">Ctrl+D</text>
  <text class="cell" x="604" y="477.5" text-anchor="end">UserControl with Focusable="True"</text>
  <text class="cell" x="1173" y="477.5" text-anchor="end">Keyboard.Focus(titleBox), then click the TextBlock in the UserControl</text>
  <text class="cell" x="1499" y="477.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1739" y="477.5" text-anchor="end">3: outside the element</text>
  <text class="cell" x="2003" y="477.5" text-anchor="end">raised</text>
  <text class="cell" x="2156" y="477.5" text-anchor="end">none</text>
