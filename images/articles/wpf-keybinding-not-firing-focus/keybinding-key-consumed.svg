<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1923 320" width="1923" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1923" height="320" />
  <text class="title" x="12" y="24">Keys the focused control uses itself</text>
  <rect class="head" x="12" y="38" width="1899" height="30" />
  <text class="cell" x="26" y="57.5">key</text>
  <text class="cell" x="501" y="57.5" text-anchor="end">where the KeyBinding is</text>
  <text class="cell" x="851" y="57.5" text-anchor="end">before pressing the key</text>
  <text class="cell" x="1178" y="57.5" text-anchor="end">keyboard focus when the key is pressed</text>
  <text class="cell" x="1418" y="57.5" text-anchor="end">isolation step that applies</text>
  <text class="cell" x="1658" y="57.5" text-anchor="end">view-model command that ran</text>
  <text class="cell" x="1897" y="57.5" text-anchor="end">titleBox text after the key</text>
  <text class="cell" x="26" y="87.5">Ctrl+Z</text>
  <text class="cell" x="501" y="87.5" text-anchor="end">Window</text>
  <text class="cell" x="851" y="87.5" text-anchor="end">Keyboard.Focus(titleBox)</text>
  <text class="cell" x="1178" y="87.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1418" y="87.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="1658" y="87.5" text-anchor="end">none</text>
  <text class="cell" x="1897" y="87.5" text-anchor="end">""</text>
  <text class="cell" x="26" y="117.5">Ctrl+Z</text>
  <text class="cell" x="501" y="117.5" text-anchor="end">Window</text>
  <text class="cell" x="851" y="117.5" text-anchor="end">Keyboard.Focus(titleBox), then type "abc"</text>
  <text class="cell" x="1178" y="117.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1418" y="117.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="1658" y="117.5" text-anchor="end">none</text>
  <text class="cell" x="1897" y="117.5" text-anchor="end">""</text>
  <text class="cell" x="26" y="147.5">Ctrl+Z</text>
  <text class="cell" x="501" y="147.5" text-anchor="end">Window</text>
  <text class="cell" x="851" y="147.5" text-anchor="end">Keyboard.Focus(okButton)</text>
  <text class="cell" x="1178" y="147.5" text-anchor="end">Button</text>
  <text class="cell" x="1418" y="147.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="1658" y="147.5" text-anchor="end">UndoCommand</text>
  <text class="cell" x="1897" y="147.5" text-anchor="end">-</text>
  <text class="cell" x="26" y="177.5">Ctrl+Z</text>
  <text class="cell" x="501" y="177.5" text-anchor="end">Window and titleBox.InputBindings (TextUndoCommand)</text>
  <text class="cell" x="851" y="177.5" text-anchor="end">Keyboard.Focus(titleBox), then type "abc"</text>
  <text class="cell" x="1178" y="177.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1418" y="177.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="1658" y="177.5" text-anchor="end">TextUndoCommand</text>
  <text class="cell" x="1897" y="177.5" text-anchor="end">"abc"</text>
  <text class="cell" x="26" y="207.5">Ctrl+Z</text>
  <text class="cell" x="501" y="207.5" text-anchor="end">Window and Window.PreviewKeyDown (TextUndoCommand)</text>
  <text class="cell" x="851" y="207.5" text-anchor="end">Keyboard.Focus(titleBox), then type "abc"</text>
  <text class="cell" x="1178" y="207.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1418" y="207.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="1658" y="207.5" text-anchor="end">TextUndoCommand</text>
  <text class="cell" x="1897" y="207.5" text-anchor="end">"abc"</text>
  <text class="cell" x="26" y="237.5">Enter</text>
  <text class="cell" x="501" y="237.5" text-anchor="end">Window</text>
  <text class="cell" x="851" y="237.5" text-anchor="end">Keyboard.Focus(titleBox)</text>
  <text class="cell" x="1178" y="237.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1418" y="237.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="1658" y="237.5" text-anchor="end">SubmitCommand</text>
  <text class="cell" x="1897" y="237.5" text-anchor="end">""</text>
  <text class="cell" x="26" y="267.5">Enter</text>
  <text class="cell" x="501" y="267.5" text-anchor="end">Window (titleBox with AcceptsReturn="True")</text>
  <text class="cell" x="851" y="267.5" text-anchor="end">Keyboard.Focus(titleBox)</text>
  <text class="cell" x="1178" y="267.5" text-anchor="end">TextBox in the Window</text>
  <text class="cell" x="1418" y="267.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="1658" y="267.5" text-anchor="end">none</text>
  <text class="cell" x="1897" y="267.5" text-anchor="end">"\r\n"</text>
  <text class="cell" x="26" y="297.5">Enter</text>
  <text class="cell" x="501" y="297.5" text-anchor="end">Window</text>
  <text class="cell" x="851" y="297.5" text-anchor="end">Keyboard.Focus(okButton)</text>
  <text class="cell" x="1178" y="297.5" text-anchor="end">Button</text>
  <text class="cell" x="1418" y="297.5" text-anchor="end">4: on the path</text>
  <text class="cell" x="1658" y="297.5" text-anchor="end">OkCommand</text>
  <text class="cell" x="1897" y="297.5" text-anchor="end">-</text>
