  <text class="cell" x="820" y="237.5" text-anchor="end">NotSupportedException</text>
  <text class="cell" x="26" y="267.5">A</text>
  <text class="cell" x="478" y="267.5" text-anchor="end">new KeyBinding(command, Key.A, ModifierKeys.None)</text>
