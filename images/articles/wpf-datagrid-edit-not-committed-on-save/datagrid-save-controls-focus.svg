<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 701 170" width="701" height="170" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="701" height="170" />
  <text class="title" x="12" y="24">Focus properties of the three Save controls</text>
  <rect class="head" x="12" y="38" width="677" height="30" />
  <text class="cell" x="26" y="57.5">control</text>
  <text class="cell" x="329" y="57.5" text-anchor="end">Focusable</text>
  <text class="cell" x="553" y="57.5" text-anchor="end">focus scope it belongs to</text>
  <text class="cell" x="675" y="57.5" text-anchor="end">IsFocusScope</text>
  <text class="cell" x="26" y="87.5">Button in the ToolBar</text>
  <text class="cell" x="329" y="87.5" text-anchor="end">True</text>
  <text class="cell" x="553" y="87.5" text-anchor="end">ToolBar</text>
  <text class="cell" x="675" y="87.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="117.5">MenuItem in the Menu</text>
  <text class="cell" x="329" y="117.5" text-anchor="end">True</text>
  <text class="cell" x="553" y="117.5" text-anchor="end">Menu</text>
  <text class="cell" x="675" y="117.5" text-anchor="end">False</text>
  <text class="cell" x="26" y="147.5">Button outside the ToolBar</text>
  <text class="cell" x="329" y="147.5" text-anchor="end">True</text>
  <text class="cell" x="553" y="147.5" text-anchor="end">Window</text>
  <text class="cell" x="675" y="147.5" text-anchor="end">False</text>
  <line class="line" x1="12" y1="38" x2="689" y2="38" />
  <line class="line" x1="12" y1="68" x2="689" y2="68" />
