<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 802 290" width="802" height="290" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="802" height="290" />
  <text class="title" x="12" y="24">PasswordBox: is the whole password left in process memory as UTF-16?</text>
  <rect class="head" x="12" y="38" width="778" height="30" />
  <text class="cell" x="26" y="57.5">what the code did</text>
  <text class="cell" x="776" y="57.5" text-anchor="end">found in memory</text>
  <text class="cell" x="26" y="87.5">typed into a PasswordBox only</text>
  <text class="cell" x="776" y="87.5" text-anchor="end">no</text>
  <text class="cell" x="26" y="117.5">read SecurePassword (and disposed it)</text>
  <text class="cell" x="776" y="117.5" text-anchor="end">no</text>
  <text class="cell" x="26" y="147.5">copied SecurePassword to unmanaged memory (before ZeroFreeGlobalAllocUnicode)</text>
  <text class="cell" x="776" y="147.5" text-anchor="end">yes</text>
  <text class="cell" x="26" y="177.5">copied SecurePassword to unmanaged memory, then ZeroFreeGlobalAllocUnicode</text>
  <text class="cell" x="776" y="177.5" text-anchor="end">no</text>
  <text class="cell" x="26" y="207.5">read Password once (string, reference dropped)</text>
  <text class="cell" x="776" y="207.5" text-anchor="end">yes</text>
  <text class="cell" x="26" y="237.5">synced to a ViewModel string with the attached property</text>
  <text class="cell" x="776" y="237.5" text-anchor="end">yes</text>
  <text class="cell" x="26" y="267.5">same, then PasswordBox.Clear() (the ViewModel becomes "") and GC.Collect</text>
  <text class="cell" x="776" y="267.5" text-anchor="end">yes</text>
  <line class="line" x1="12" y1="38" x2="790" y2="38" />
  <line class="line" x1="12" y1="68" x2="790" y2="68" />
  <line class="line" x1="12" y1="98" x2="790" y2="98" />
  <line class="line" x1="12" y1="128" x2="790" y2="128" />
  <line class="line" x1="12" y1="158" x2="790" y2="158" />
  <line class="line" x1="12" y1="188" x2="790" y2="188" />
  <line class="line" x1="12" y1="218" x2="790" y2="218" />
  <line class="line" x1="12" y1="248" x2="790" y2="248" />
  <line class="line" x1="12" y1="278" x2="790" y2="278" />
  <line class="line" x1="12" y1="38" x2="12" y2="278" />
  <line class="line" x1="644" y1="38" x2="644" y2="278" />
  <line class="line" x1="790" y1="38" x2="790" y2="278" />
</svg>
