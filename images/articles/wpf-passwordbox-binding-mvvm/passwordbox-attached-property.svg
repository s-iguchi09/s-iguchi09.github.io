<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 260" width="944" height="260" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="944" height="260" />
  <text class="title" x="12" y="24">PasswordBox: syncing with an attached property</text>
  <rect class="head" x="12" y="38" width="920" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="918" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">subscribe in the change callback, ViewModel starts with "": type "abc"</text>
  <text class="cell" x="918" y="87.5" text-anchor="end">ViewModel.Password ""</text>
  <text class="cell" x="26" y="117.5">set Password back without comparing: type "abc"</text>
  <text class="cell" x="918" y="117.5" text-anchor="end">PasswordBox "cba" / ViewModel "cba"</text>
  <text class="cell" x="26" y="147.5">no attached property: type "ab", set Password = "ab" in code, then type "c"</text>
  <text class="cell" x="918" y="147.5" text-anchor="end">PasswordBox "cab"</text>
  <text class="cell" x="26" y="177.5">article's attached property: type "abc"</text>
  <text class="cell" x="918" y="177.5" text-anchor="end">PasswordBox "abc" / ViewModel "abc"</text>
  <text class="cell" x="26" y="207.5">then the ViewModel sets Password = ""</text>
  <text class="cell" x="918" y="207.5" text-anchor="end">PasswordBox ""</text>
  <text class="cell" x="26" y="237.5">button IsEnabled before / after typing</text>
  <text class="cell" x="918" y="237.5" text-anchor="end">False / True</text>
  <line class="line" x1="12" y1="38" x2="932" y2="38" />
  <line class="line" x1="12" y1="68" x2="932" y2="68" />
  <line class="line" x1="12" y1="98" x2="932" y2="98" />
  <line class="line" x1="12" y1="128" x2="932" y2="128" />
  <line class="line" x1="12" y1="158" x2="932" y2="158" />
  <line class="line" x1="12" y1="188" x2="932" y2="188" />
  <line class="line" x1="12" y1="218" x2="932" y2="218" />
  <line class="line" x1="12" y1="248" x2="932" y2="248" />
  <line class="line" x1="12" y1="38" x2="12" y2="248" />
  <line class="line" x1="629" y1="38" x2="629" y2="248" />
  <line class="line" x1="932" y1="38" x2="932" y2="248" />
</svg>
