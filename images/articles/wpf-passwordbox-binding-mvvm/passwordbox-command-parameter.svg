<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1689 200" width="1689" height="200" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1689" height="200" />
  <text class="title" x="12" y="24">PasswordBox: passing it as CommandParameter</text>
  <rect class="head" x="12" y="38" width="1665" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1663" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">CommandParameter="{Binding SecurePassword, ElementName=PasswordInput}": type "abc", then click</text>
  <text class="cell" x="1663" y="87.5" text-anchor="end">SecureString.Length 0</text>
  <text class="cell" x="26" y="117.5">CommandParameter="{Binding Password, ElementName=PasswordInput}": type "abc", then click</text>
  <text class="cell" x="1663" y="117.5" text-anchor="end">String.Length 0</text>
  <text class="cell" x="26" y="147.5">article's SignInViewModel, CommandParameter="{Binding ElementName=PasswordInput}": type "abc", then click</text>
  <text class="cell" x="1663" y="147.5" text-anchor="end">SecureString.Length 3</text>
  <text class="cell" x="26" y="177.5">RelayCommand&lt;PasswordBox&gt; with CanExecute checking SecurePassword.Length &gt; 0: button IsEnabled (before / after typing (CommandParameter type; after RaiseCanExecuteChanged))</text>
  <text class="cell" x="1663" y="177.5" text-anchor="end">False / False (PasswordBox; True)</text>
  <line class="line" x1="12" y1="38" x2="1677" y2="38" />
  <line class="line" x1="12" y1="68" x2="1677" y2="68" />
  <line class="line" x1="12" y1="98" x2="1677" y2="98" />
  <line class="line" x1="12" y1="128" x2="1677" y2="128" />
  <line class="line" x1="12" y1="158" x2="1677" y2="158" />
  <line class="line" x1="12" y1="188" x2="1677" y2="188" />
  <line class="line" x1="12" y1="38" x2="12" y2="188" />
  <line class="line" x1="1390" y1="38" x2="1390" y2="188" />
  <line class="line" x1="1677" y1="38" x2="1677" y2="188" />
</svg>
