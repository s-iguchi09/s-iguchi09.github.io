<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 290" width="866" height="290" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="866" height="290" />
  <text class="title" x="12" y="24">polyfill on net48 vs built-in on net10.0 — same source, same driver</text>
  <rect class="head" x="12" y="38" width="842" height="30" />
  <text class="cell" x="26" y="57.5">expression</text>
  <text class="cell" x="517" y="57.5" text-anchor="end">net10.0 (built-in)</text>
  <text class="cell" x="781" y="57.5" text-anchor="end">net48 (polyfill)</text>
  <text class="cell" x="840" y="57.5" text-anchor="end"></text>
  <text class="cell" x="26" y="87.5">Words.Order()</text>
  <text class="cell" x="517" y="87.5" text-anchor="end">[apple, date, fig, kiwi, pear]</text>
  <text class="cell" x="781" y="87.5" text-anchor="end">[apple, date, fig, kiwi, pear]</text>
  <text class="cell" x="840" y="87.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="117.5">Words.OrderDescending()</text>
  <text class="cell" x="517" y="117.5" text-anchor="end">[pear, kiwi, fig, date, apple]</text>
  <text class="cell" x="781" y="117.5" text-anchor="end">[pear, kiwi, fig, date, apple]</text>
  <text class="cell" x="840" y="117.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="147.5">Order(OrdinalIgnoreCase)</text>
  <text class="cell" x="517" y="147.5" text-anchor="end">[apple, date, fig, kiwi, pear]</text>
  <text class="cell" x="781" y="147.5" text-anchor="end">[apple, date, fig, kiwi, pear]</text>
  <text class="cell" x="840" y="147.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="177.5">OrderDescending(ByLength)</text>
  <text class="cell" x="517" y="177.5" text-anchor="end">[apple, pear, kiwi, date, fig]</text>
  <text class="cell" x="781" y="177.5" text-anchor="end">[apple, pear, kiwi, date, fig]</text>
  <text class="cell" x="840" y="177.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="207.5">Order(ByLength), stability</text>
  <text class="cell" x="517" y="207.5" text-anchor="end">[fig, pear, kiwi, date, apple]</text>
  <text class="cell" x="781" y="207.5" text-anchor="end">[fig, pear, kiwi, date, apple]</text>
  <text class="cell" x="840" y="207.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="237.5">Order().ThenByDescending(len)</text>
  <text class="cell" x="517" y="237.5" text-anchor="end">[apple, date, fig, kiwi, pear]</text>
  <text class="cell" x="781" y="237.5" text-anchor="end">[apple, date, fig, kiwi, pear]</text>
  <text class="cell" x="840" y="237.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="267.5">empty.Order()</text>
  <text class="cell" x="517" y="267.5" text-anchor="end">[]</text>
  <text class="cell" x="781" y="267.5" text-anchor="end">[]</text>
  <text class="cell" x="840" y="267.5" text-anchor="end">same</text>
  <line class="line" x1="12" y1="38" x2="854" y2="38" />
  <line class="line" x1="12" y1="68" x2="854" y2="68" />
  <line class="line" x1="12" y1="98" x2="854" y2="98" />
  <line class="line" x1="12" y1="128" x2="854" y2="128" />
  <line class="line" x1="12" y1="158" x2="854" y2="158" />
  <line class="line" x1="12" y1="188" x2="854" y2="188" />
  <line class="line" x1="12" y1="218" x2="854" y2="218" />
  <line class="line" x1="12" y1="248" x2="854" y2="248" />
  <line class="line" x1="12" y1="278" x2="854" y2="278" />
  <line class="line" x1="12" y1="38" x2="12" y2="278" />
  <line class="line" x1="268" y1="38" x2="268" y2="278" />
  <line class="line" x1="531" y1="38" x2="531" y2="278" />
  <line class="line" x1="795" y1="38" x2="795" y2="278" />
  <line class="line" x1="854" y1="38" x2="854" y2="278" />
</svg>
