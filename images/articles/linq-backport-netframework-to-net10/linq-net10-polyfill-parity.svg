<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1078 320" width="1078" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1078" height="320" />
  <text class="title" x="12" y="24">polyfill on net48 vs built-in on net10.0 — same source, same driver</text>
  <rect class="head" x="12" y="38" width="1054" height="30" />
  <text class="cell" x="26" y="57.5">expression</text>
  <text class="cell" x="713" y="57.5" text-anchor="end">net10.0 (built-in)</text>
  <text class="cell" x="993" y="57.5" text-anchor="end">net48 (polyfill)</text>
  <text class="cell" x="1052" y="57.5" text-anchor="end"></text>
  <text class="cell" x="26" y="87.5">LeftJoin</text>
  <text class="cell" x="713" y="87.5" text-anchor="end">[pear:-, apple:ripe, fig:dry]</text>
  <text class="cell" x="993" y="87.5" text-anchor="end">[pear:-, apple:ripe, fig:dry]</text>
  <text class="cell" x="1052" y="87.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="117.5">RightJoin</text>
  <text class="cell" x="713" y="117.5" text-anchor="end">[apple:ripe, fig:dry, -:unknown]</text>
  <text class="cell" x="993" y="117.5" text-anchor="end">[apple:ripe, fig:dry, -:unknown]</text>
  <text class="cell" x="1052" y="117.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="147.5">LeftJoin, no match at all</text>
  <text class="cell" x="713" y="147.5" text-anchor="end">[pear:-, apple:-, fig:-]</text>
  <text class="cell" x="993" y="147.5" text-anchor="end">[pear:-, apple:-, fig:-]</text>
  <text class="cell" x="1052" y="147.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="177.5">RightJoin, empty right</text>
  <text class="cell" x="713" y="177.5" text-anchor="end">[]</text>
  <text class="cell" x="993" y="177.5" text-anchor="end">[]</text>
  <text class="cell" x="1052" y="177.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="207.5">Shuffle, sorted back</text>
  <text class="cell" x="713" y="207.5" text-anchor="end">[apple, fig, pear]</text>
  <text class="cell" x="993" y="207.5" text-anchor="end">[apple, fig, pear]</text>
  <text class="cell" x="1052" y="207.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="237.5">Shuffle, count</text>
  <text class="cell" x="713" y="237.5" text-anchor="end">3</text>
  <text class="cell" x="993" y="237.5" text-anchor="end">3</text>
  <text class="cell" x="1052" y="237.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="267.5">empty.Shuffle()</text>
  <text class="cell" x="713" y="267.5" text-anchor="end">[]</text>
  <text class="cell" x="993" y="267.5" text-anchor="end">[]</text>
  <text class="cell" x="1052" y="267.5" text-anchor="end">same</text>
  <text class="cell" x="26" y="297.5">Shuffle, 8 threads started together: distinct orders</text>
  <text class="cell" x="713" y="297.5" text-anchor="end">8</text>
  <text class="cell" x="993" y="297.5" text-anchor="end">8</text>
  <text class="cell" x="1052" y="297.5" text-anchor="end">same</text>
  <line class="line" x1="12" y1="38" x2="1066" y2="38" />
  <line class="line" x1="12" y1="68" x2="1066" y2="68" />
  <line class="line" x1="12" y1="98" x2="1066" y2="98" />
  <line class="line" x1="12" y1="128" x2="1066" y2="128" />
  <line class="line" x1="12" y1="158" x2="1066" y2="158" />
  <line class="line" x1="12" y1="188" x2="1066" y2="188" />
  <line class="line" x1="12" y1="218" x2="1066" y2="218" />
  <line class="line" x1="12" y1="248" x2="1066" y2="248" />
  <line class="line" x1="12" y1="278" x2="1066" y2="278" />
  <line class="line" x1="12" y1="308" x2="1066" y2="308" />
  <line class="line" x1="12" y1="38" x2="12" y2="308" />
  <line class="line" x1="448" y1="38" x2="448" y2="308" />
  <line class="line" x1="727" y1="38" x2="727" y2="308" />
  <line class="line" x1="1007" y1="38" x2="1007" y2="308" />
  <line class="line" x1="1066" y1="38" x2="1066" y2="308" />
</svg>
