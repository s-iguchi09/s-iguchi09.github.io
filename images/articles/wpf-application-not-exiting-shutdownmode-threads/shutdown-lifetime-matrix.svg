<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 320" width="709" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="709" height="320" />
  <text class="title" x="12" y="24">process lifetime by condition</text>
  <rect class="head" x="12" y="38" width="685" height="30" />
  <text class="cell" x="26" y="57.5"></text>
  <text class="cell" x="431" y="57.5" text-anchor="end">Application.Exit</text>
  <text class="cell" x="561" y="57.5" text-anchor="end">Run() returns</text>
  <text class="cell" x="683" y="57.5" text-anchor="end">process ends</text>
  <text class="cell" x="26" y="87.5">visible window only</text>
  <text class="cell" x="431" y="87.5" text-anchor="end">raised</text>
  <text class="cell" x="561" y="87.5" text-anchor="end">returns</text>
  <text class="cell" x="683" y="87.5" text-anchor="end">3.6 s</text>
  <text class="cell" x="26" y="117.5">no window at all</text>
  <text class="cell" x="431" y="117.5" text-anchor="end">never</text>
  <text class="cell" x="561" y="117.5" text-anchor="end">never</text>
  <text class="cell" x="683" y="117.5" text-anchor="end">never</text>
  <text class="cell" x="26" y="147.5">Window created, never closed</text>
  <text class="cell" x="431" y="147.5" text-anchor="end">never</text>
  <text class="cell" x="561" y="147.5" text-anchor="end">never</text>
  <text class="cell" x="683" y="147.5" text-anchor="end">never</text>
  <text class="cell" x="26" y="177.5">new Thread(...)</text>
  <text class="cell" x="431" y="177.5" text-anchor="end">raised</text>
  <text class="cell" x="561" y="177.5" text-anchor="end">returns</text>
  <text class="cell" x="683" y="177.5" text-anchor="end">6.3 s</text>
  <text class="cell" x="26" y="207.5">+ IsBackground = true</text>
  <text class="cell" x="431" y="207.5" text-anchor="end">raised</text>
  <text class="cell" x="561" y="207.5" text-anchor="end">returns</text>
  <text class="cell" x="683" y="207.5" text-anchor="end">2.9 s</text>
  <text class="cell" x="26" y="237.5">Task.Run(...)</text>
  <text class="cell" x="431" y="237.5" text-anchor="end">raised</text>
  <text class="cell" x="561" y="237.5" text-anchor="end">returns</text>
  <text class="cell" x="683" y="237.5" text-anchor="end">3.2 s</text>
  <text class="cell" x="26" y="267.5">2nd UI thread + Dispatcher.Run()</text>
  <text class="cell" x="431" y="267.5" text-anchor="end">raised</text>
  <text class="cell" x="561" y="267.5" text-anchor="end">returns</text>
  <text class="cell" x="683" y="267.5" text-anchor="end">never</text>
  <text class="cell" x="26" y="297.5">+ InvokeShutdown() on Exit</text>
  <text class="cell" x="431" y="297.5" text-anchor="end">raised</text>
  <text class="cell" x="561" y="297.5" text-anchor="end">returns</text>
  <text class="cell" x="683" y="297.5" text-anchor="end">3.0 s</text>
  <line class="line" x1="12" y1="38" x2="697" y2="38" />
  <line class="line" x1="12" y1="68" x2="697" y2="68" />
  <line class="line" x1="12" y1="98" x2="697" y2="98" />
  <line class="line" x1="12" y1="128" x2="697" y2="128" />
  <line class="line" x1="12" y1="158" x2="697" y2="158" />
  <line class="line" x1="12" y1="188" x2="697" y2="188" />
  <line class="line" x1="12" y1="218" x2="697" y2="218" />
  <line class="line" x1="12" y1="248" x2="697" y2="248" />
  <line class="line" x1="12" y1="278" x2="697" y2="278" />
  <line class="line" x1="12" y1="308" x2="697" y2="308" />
  <line class="line" x1="12" y1="38" x2="12" y2="308" />
  <line class="line" x1="291" y1="38" x2="291" y2="308" />
  <line class="line" x1="445" y1="38" x2="445" y2="308" />
  <line class="line" x1="575" y1="38" x2="575" y2="308" />
  <line class="line" x1="697" y1="38" x2="697" y2="308" />
</svg>
