<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 320" width="1140" height="320" role="img">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .head { fill: #f5f7fb; }
      .line { stroke: #c3ccdb; stroke-width: 1; }
      .cell { font-family: Consolas, "Courier New", monospace; font-size: 13px; fill: #1f2933; }
      .title { font-family: Consolas, "Courier New", monospace; font-size: 11px; fill: #5b6673; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1140" height="320" />
  <text class="title" x="12" y="24">MessageBox enums on .NET 8 and .NET 10</text>
  <rect class="head" x="12" y="38" width="1116" height="30" />
  <text class="cell" x="26" y="57.5">case</text>
  <text class="cell" x="1114" y="57.5" text-anchor="end">measured</text>
  <text class="cell" x="26" y="87.5">.NET 8.0.31: MessageBoxButton</text>
  <text class="cell" x="1114" y="87.5" text-anchor="end">OK, OKCancel, YesNoCancel, YesNo</text>
  <text class="cell" x="26" y="117.5">.NET 8.0.31: MessageBoxResult</text>
  <text class="cell" x="1114" y="117.5" text-anchor="end">None, OK, Cancel, Yes, No</text>
  <text class="cell" x="26" y="147.5">.NET 8.0.31: MessageBoxOptions</text>
  <text class="cell" x="1114" y="147.5" text-anchor="end">None, DefaultDesktopOnly, RightAlign, RtlReading, ServiceNotification</text>
  <text class="cell" x="26" y="177.5">.NET 8.0.31: Enum.GetValues(MessageBoxImage) as text</text>
  <text class="cell" x="1114" y="177.5" text-anchor="end">None, Hand, Hand, Hand, Question, Exclamation, Exclamation, Asterisk, Asterisk</text>
  <text class="cell" x="26" y="207.5">.NET 10.0.10: MessageBoxButton</text>
  <text class="cell" x="1114" y="207.5" text-anchor="end">OK, OKCancel, AbortRetryIgnore, YesNoCancel, YesNo, RetryCancel, CancelTryContinue</text>
  <text class="cell" x="26" y="237.5">.NET 10.0.10: MessageBoxResult</text>
  <text class="cell" x="1114" y="237.5" text-anchor="end">None, OK, Cancel, Abort, Retry, Ignore, Yes, No, TryAgain, Continue</text>
  <text class="cell" x="26" y="267.5">.NET 10.0.10: MessageBoxOptions</text>
  <text class="cell" x="1114" y="267.5" text-anchor="end">None, DefaultDesktopOnly, RightAlign, RtlReading, ServiceNotification</text>
  <text class="cell" x="26" y="297.5">.NET 10.0.10: Enum.GetValues(MessageBoxImage) as text</text>
  <text class="cell" x="1114" y="297.5" text-anchor="end">None, Hand, Hand, Hand, Question, Exclamation, Exclamation, Asterisk, Asterisk</text>
