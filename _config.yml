url: "https://s-iguchi09.github.io"

# Markdown（kramdown）設定
# Jekyll（kramdown）の既定は hard_wrap: false のため、段落内の単一改行が
# 空白として扱われ、「1 文 1 行」で書いた記事の改行が HTML で消えてしまう。
# hard_wrap: true で単一改行を <br /> として描画し、意図した改行を保持する。
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true

include:
  - sitemap.xml
  - sitemap_index.xml

# 公開サイトに出力しないファイル。
# docs/rules 配下は AI エージェント向けの内部ルール文書であり、サイトのコンテンツではない。
# とくに template-ja.md / template-en.md は front matter に記事レイアウトを指定しているため、
# 除外しないと「（タイトル）」のままのプレースホルダ記事がそのまま公開されてしまう。
# CLAUDE.md / AGENTS.md も同様にエージェント向けの指示であり、公開する意味がない。
# tools 配下は記事用スクリーンショットを生成する .NET プロジェクトであり、
# サイトの公開物ではない。
exclude:
  - docs
  - tools
  - CLAUDE.md
  - AGENTS.md

collections:
  articles_en:
    output: true
    permalink: /articles/:name/
  articles_ja:
    output: true
    permalink: /ja/articles/:name/
  apps_en:
    output: true
    permalink: /apps/:name/
  apps_ja:
    output: true
    permalink: /ja/apps/:name/